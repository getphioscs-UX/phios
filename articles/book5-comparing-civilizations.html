  <main id="article-main" class="knowledge-article-shell" data-article-slug="book5-comparing-civilizations" aria-busy="true"><article class="knowledge-article knowledge-article--static" data-static-article-admission><header class="knowledge-article__header"><div class="knowledge-article__header-content"><p class="knowledge-eyebrow">第五册 · 世界如何分化</p><h1 data-cx-en="Comparing civilizations without erasing uncertainty" data-cx-zh="怎样比较文明，并保留未知">怎样比较文明，并保留未知</h1><p class="knowledge-article__answer" data-cx-en="Calling a civilization powerful or declining does not yet explain what is happening. Territory, population, knowledge, institutions and external connections can move in different directions. The Atlas separates these questions to describe a historical structure, not to calculate a civilization's overall score." data-cx-zh="说一个文明强大或衰落，仍然没有说清楚它发生了什么。领土、人口、知识、制度和外部联系可能朝不同方向变化。文明图谱把这些问题拆开，是为了描述某一历史时刻的结构，而不是给文明算出总分。">说一个文明强大或衰落，仍然没有说清楚它发生了什么。领土、人口、知识、制度和外部联系可能朝不同方向变化。文明图谱把这些问题拆开，是为了描述某一历史时刻的结构，而不是给文明算出总分。</p><div class="knowledge-article__actions"><a class="public-button public-button--quiet" href="/books/reality-differentiation/" data-cx-en="Read this volume" data-cx-zh="阅读本册">阅读本册</a><a class="public-button public-button--quiet" href="/knowledge/ask/?contextType=PUBLISHED_ARTICLE&contextRef=ARTICLE%3Abook5-comparing-civilizations&bookCode=BOOK-5" data-cx-en="Ask about this article" data-cx-zh="询问这篇文章">询问这篇文章</a></div></div></header></article></main>
