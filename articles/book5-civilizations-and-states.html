  <main id="article-main" class="knowledge-article-shell" data-article-slug="book5-civilizations-and-states" aria-busy="true"><article class="knowledge-article knowledge-article--static" data-static-article-admission><header class="knowledge-article__header"><div class="knowledge-article__header-content"><p class="knowledge-eyebrow">第五册 · 世界如何分化</p><h1 data-cx-en="Why civilizations are not states" data-cx-zh="文明为什么不能等同于国家">文明为什么不能等同于国家</h1><p class="knowledge-article__answer" data-cx-en="A political map shows where sovereignty ends. It cannot, on its own, show where a civilization continues. Languages, religions and trading networks may cross several states with clearly drawn borders. Treating a civilization as a colored territory confuses political unity with the whole of cultural, intellectual and social life." data-cx-zh="政治地图告诉我们主权在哪里结束，却不能独自说明文明在哪里延续。一个国家可以拥有清楚的疆界，一种语言、宗教或贸易网络却可能同时穿过许多国家。把文明直接画成地图上的色块，容易把政治统一误认为文化、知识与社会生活的全部。">政治地图告诉我们主权在哪里结束，却不能独自说明文明在哪里延续。一个国家可以拥有清楚的疆界，一种语言、宗教或贸易网络却可能同时穿过许多国家。把文明直接画成地图上的色块，容易把政治统一误认为文化、知识与社会生活的全部。</p><div class="knowledge-article__actions"><a class="public-button public-button--quiet" href="/books/reality-differentiation/" data-cx-en="Read this volume" data-cx-zh="阅读本册">阅读本册</a><a class="public-button public-button--quiet" href="/knowledge/ask/?contextType=PUBLISHED_ARTICLE&contextRef=ARTICLE%3Abook5-civilizations-and-states&bookCode=BOOK-5" data-cx-en="Ask about this article" data-cx-zh="询问这篇文章">询问这篇文章</a></div></div></header></article></main>
