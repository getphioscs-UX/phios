<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><style>@import url('/assets/css/public-cinematic-heroes.css');
@layer cx.tokens, cx.base, cx.typography, cx.layout, cx.components, cx.motion, cx.utilities, cx.preview;

@layer cx.tokens {
  :root {
    /* CX-R3 W1 — semantic color roles. */
    --cx-color-canvas: #f7f5ef;
    --cx-color-surface: #ffffff;
    --cx-color-surface-raised: #fffefa;
    --cx-color-ink: #171914;
    --cx-color-ink-muted: #676a61;
    --cx-color-border: rgba(23, 25, 20, 0.14);
    --cx-color-border-strong: rgba(23, 25, 20, 0.24);
    --cx-color-accent: #8d6a1f;
    --cx-color-accent-soft: #eee4cc;
    --cx-color-success: #2f6a4f;
    --cx-color-warning: #8a5b19;
    --cx-color-critical: #8d3e35;
    --cx-color-unknown: #666a70;
    --cx-color-professional: #4d537a;
    --cx-color-focus: #7a5b18;

    /* Domain accents may decorate a bounded domain without changing UI architecture. */
    --cx-domain-personal: #6e5b82;
    --cx-domain-financial: #4f6857;
    --cx-domain-knowledge: #7a6331;
    --cx-domain-professional: var(--cx-color-professional);

    /* CX-R3 W2 — two primary font roles plus optional data role. */
    --cx-font-display: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --cx-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --cx-font-data: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

    --cx-type-display-xl: clamp(3.25rem, 7vw, 6.75rem);
    --cx-type-display-lg: clamp(2.5rem, 5vw, 4.75rem);
    --cx-type-heading-1: clamp(2rem, 3.4vw, 3.25rem);
    --cx-type-heading-2: clamp(1.55rem, 2.4vw, 2.25rem);
    --cx-type-heading-3: clamp(1.2rem, 1.6vw, 1.55rem);
    --cx-type-body-lg: 1.125rem;
    --cx-type-body: 1rem;
    --cx-type-body-sm: 0.875rem;
    --cx-type-label: 0.8125rem;
    --cx-type-caption: 0.75rem;

    --cx-leading-display: 0.98;
    --cx-leading-heading: 1.15;
    --cx-leading-body: 1.7;
    --cx-leading-compact: 1.4;

    /* CX-R3 W3 — one spacing scale. */
    --cx-space-1: 0.25rem;
    --cx-space-2: 0.5rem;
    --cx-space-3: 0.75rem;
    --cx-space-4: 1rem;
    --cx-space-5: 1.25rem;
    --cx-space-6: 1.5rem;
    --cx-space-7: 2rem;
    --cx-space-8: 2.5rem;
    --cx-space-9: 3rem;
    --cx-space-10: 4rem;
    --cx-space-11: 5.5rem;
    --cx-space-12: 7rem;

    /* CX-R3 W4/W5 — layout, shape and elevation. */
    --cx-size-container: 76rem;
    --cx-size-container-wide: 90rem;
    --cx-size-reading: 49rem;
    --cx-size-sidebar: 17rem;
    --cx-size-control-min: 2.75rem;
    --cx-size-header: 4.75rem;
    --cx-gutter: clamp(1rem, 3vw, 2rem);

    --cx-radius-sm: 0.625rem;
    --cx-radius-md: 1rem;
    --cx-radius-lg: 1.5rem;
    --cx-radius-full: 999px;
    --cx-border-width: 1px;
    --cx-shadow-1: 0 10px 30px rgba(31, 28, 18, 0.07);
    --cx-shadow-2: 0 24px 70px rgba(31, 28, 18, 0.12);

    /* CX-R3 W13/W14 — interaction and focus. */
    --cx-motion-fast: 160ms;
    --cx-motion-medium: 240ms;
    --cx-motion-slow: 360ms;
    --cx-ease-standard: cubic-bezier(0.2, 0, 0, 1);
    --cx-focus-width: 3px;
    --cx-focus-offset: 3px;

    /* Compatibility aliases for already-shipped CX surfaces. Values resolve to R3 roles. */
    --cx-bg: var(--cx-color-canvas);
    --cx-surface: var(--cx-color-surface);
    --cx-surface-soft: var(--cx-color-surface-raised);
    --cx-ink: var(--cx-color-ink);
    --cx-muted: var(--cx-color-ink-muted);
    --cx-line: var(--cx-color-border);
    --cx-line-strong: var(--cx-color-border-strong);
    --cx-border: var(--cx-color-border);
    --cx-accent: var(--cx-color-accent);
    --cx-accent-soft: var(--cx-color-accent-soft);
    --cx-positive: var(--cx-color-success);
    --cx-warning: var(--cx-color-warning);
    --cx-danger: var(--cx-color-critical);
    --cx-text: var(--cx-color-ink);
    --cx-text-muted: var(--cx-color-ink-muted);
    --cx-font-sans: var(--cx-font-body);
    --cx-font-serif: var(--cx-font-display);
    --cx-container: var(--cx-size-container);
    --cx-reading: var(--cx-size-reading);
    --cx-container-pad: var(--cx-gutter);
    --cx-header: var(--cx-size-header);
    --cx-shadow: var(--cx-shadow-1);
    --cx-fast: var(--cx-motion-fast);
  }
}

@layer cx.base {
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--cx-color-canvas); color: var(--cx-color-ink); font-family: var(--cx-font-body); text-rendering: optimizeLegibility; }
  body { margin: 0; min-height: 100vh; background: var(--cx-color-canvas); color: var(--cx-color-ink); }
  img, svg, video, canvas { display: block; max-width: 100%; height: auto; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button, a, input, select, textarea { touch-action: manipulation; }
  button, input, select, textarea { min-height: var(--cx-size-control-min); }
  :focus-visible { outline: var(--cx-focus-width) solid var(--cx-color-focus); outline-offset: var(--cx-focus-offset); }
  ::selection { background: var(--cx-color-accent-soft); color: var(--cx-color-ink); }
  [hidden] { display: none; }

  .cx-skip {
    position: fixed;
    left: var(--cx-space-4);
    top: -6rem;
    z-index: 1000;
    background: var(--cx-color-ink);
    color: var(--cx-color-surface);
    padding: var(--cx-space-3) var(--cx-space-4);
    border-radius: var(--cx-radius-sm);
  }
  .cx-skip:focus { top: var(--cx-space-4); }
}

@layer cx.base {
  /* PVP-R1-VIS Phase 12: these overlays remain inert until W31 remote evidence is present. */
  html[data-pvp-static-atmosphere="remote-verified"] body {
    background-color: var(--cx-color-canvas);
    background-image: var(--pvp-vis-tex-001, none);
    background-size: 640px 640px;
    background-attachment: fixed;
  }
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-surface="HOME"],
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-surface="KNOWLEDGE_HOME"],
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-surface="KNOWLEDGE_ASK"] {
    --pvp-surface-atmosphere: var(--pvp-vis-tex-002, none);
  }
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-surface="MY_REALITY"],
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-surface="REALITY_HOME"],
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-surface="REALITY_READING"] {
    --pvp-surface-atmosphere: var(--pvp-vis-dec-001, var(--pvp-vis-tex-003, none));
  }
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-surface="PERSPECTIVES"],
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-surface="PERSONAL"],
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-method="astrology"],
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-method="ziwei"] {
    --pvp-surface-atmosphere: var(--pvp-vis-dec-002, var(--pvp-vis-dec-004, none));
  }
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-method="bazi"],
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-method="numerology"],
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-method="human-design"] {
    --pvp-surface-atmosphere: var(--pvp-vis-dec-004, none);
  }
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-surface="PROFESSIONAL"],
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-surface="FINANCIAL"],
  html[data-pvp-static-atmosphere="remote-verified"] body[data-cx-surface="ACCOUNT"] {
    --pvp-surface-atmosphere: var(--pvp-vis-dec-003, none);
  }
  html[data-pvp-static-atmosphere="remote-verified"] [data-cx-shell-region="header"],
  html[data-pvp-static-atmosphere="remote-verified"] main > :first-child {
    background-image: var(--pvp-surface-atmosphere, none);
    background-repeat: no-repeat;
    background-position: top right;
    background-size: min(58rem, 86vw) auto;
  }
  html[data-pvp-static-atmosphere="remote-verified"] [data-pvp-paid-depth="true"] {
    background-image: var(--pvp-vis-tex-004, none);
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
  }
}

@layer cx.base {
  /* PVP-R1-VIS W33: decorative R2 atmosphere never consumes ink or obscures print output. */
  @media print {
    html[data-pvp-static-atmosphere="remote-verified"] body,
    html[data-pvp-static-atmosphere="remote-verified"] [data-cx-shell-region="header"],
    html[data-pvp-static-atmosphere="remote-verified"] main > :first-child,
    html[data-pvp-static-atmosphere="remote-verified"] [data-pvp-paid-depth="true"] {
      background-image: none;
      background-color: #fff;
    }
  }
}

@layer cx.typography {
  .cx-display-xl,
  .cx-display {
    margin: 0;
    font-family: var(--cx-font-display);
    font-size: var(--cx-type-display-xl);
    font-weight: 500;
    letter-spacing: -0.035em;
    line-height: var(--cx-leading-display);
  }

  .cx-display-lg,
  .cx-title {
    margin: 0;
    font-family: var(--cx-font-display);
    font-size: var(--cx-type-display-lg);
    font-weight: 500;
    letter-spacing: -0.025em;
    line-height: 1.04;
  }

  .cx-heading-1 { margin: 0; font-size: var(--cx-type-heading-1); line-height: var(--cx-leading-heading); letter-spacing: -0.025em; }
  .cx-heading-2 { margin: 0; font-size: var(--cx-type-heading-2); line-height: var(--cx-leading-heading); letter-spacing: -0.02em; }
  .cx-heading-3,
  .cx-heading { margin: 0; font-size: var(--cx-type-heading-3); line-height: var(--cx-leading-heading); letter-spacing: -0.018em; }

  .cx-body-lg,
  .cx-lead { margin: 0; max-width: 44rem; font-size: var(--cx-type-body-lg); line-height: var(--cx-leading-body); color: var(--cx-color-ink-muted); }
  .cx-body { font-size: var(--cx-type-body); line-height: var(--cx-leading-body); }
  .cx-body-sm { font-size: var(--cx-type-body-sm); line-height: 1.6; }
  .cx-label,
  .cx-eyebrow { font-size: var(--cx-type-label); line-height: var(--cx-leading-compact); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .cx-eyebrow { color: var(--cx-color-accent); }
  .cx-caption,
  .cx-meta { font-size: var(--cx-type-caption); line-height: 1.5; color: var(--cx-color-ink-muted); }
  .cx-data { font-family: var(--cx-font-data); font-variant-numeric: tabular-nums; }
}

@layer cx.layout {
  .cx-container { width: min(calc(100% - (2 * var(--cx-gutter))), var(--cx-size-container)); margin-inline: auto; }
  .cx-container--wide { width: min(calc(100% - (2 * var(--cx-gutter))), var(--cx-size-container-wide)); margin-inline: auto; }
  .cx-container--reading,
  .cx-reading { width: min(100%, var(--cx-size-reading)); }

  .cx-stack { display: flex; flex-direction: column; gap: var(--cx-space-5); }
  .cx-stack--tight { gap: var(--cx-space-3); }
  .cx-stack--loose { gap: var(--cx-space-8); }
  .cx-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cx-space-3); }
  .cx-grid { display: grid; gap: var(--cx-space-6); }
  .cx-grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cx-grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cx-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(18rem, 0.8fr); gap: var(--cx-space-9); align-items: start; }
  .cx-sidebar-layout { display: grid; grid-template-columns: minmax(13rem, var(--cx-size-sidebar)) minmax(0, 1fr); gap: var(--cx-space-8); align-items: start; }

  .cx-section { padding-block: var(--cx-space-11); }
  .cx-section--tight { padding-block: var(--cx-space-9); }
  .cx-hero { min-height: min(78vh, 48rem); display: grid; align-items: center; padding-block: var(--cx-space-11); }
  .cx-hero__grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(18rem, 0.95fr); gap: var(--cx-space-10); align-items: center; }

  @media (max-width: 52rem) {
    .cx-grid--2,
    .cx-grid--3,
    .cx-split,
    .cx-sidebar-layout,
    .cx-hero__grid { grid-template-columns: 1fr; }
    .cx-hero { min-height: auto; }
  }
}

@layer cx.components {
  /* CX-R3 W6 — buttons. */
  .cx-button {
    display: inline-flex;
    min-height: var(--cx-size-control-min);
    align-items: center;
    justify-content: center;
    gap: var(--cx-space-2);
    padding: 0.72rem 1.1rem;
    border: var(--cx-border-width) solid var(--cx-color-border);
    border-radius: var(--cx-radius-full);
    background: var(--cx-color-surface);
    color: var(--cx-color-ink);
    font-weight: 650;
    line-height: 1;
    text-decoration: none;
    cursor: pointer;
  }
  .cx-button:hover { border-color: var(--cx-color-border-strong); }
  .cx-button:active { transform: translateY(1px); }
  .cx-button:disabled,
  .cx-button[aria-disabled="true"] { opacity: 0.48; cursor: not-allowed; transform: none; }
  .cx-button[aria-busy="true"] { cursor: progress; }
  .cx-button--primary { border-color: var(--cx-color-ink); background: var(--cx-color-ink); color: var(--cx-color-surface); }
  .cx-button--secondary { border-color: var(--cx-color-border-strong); background: var(--cx-color-surface-raised); }
  .cx-button--quiet { background: transparent; }
  .cx-button--text { min-height: var(--cx-size-control-min); padding-inline: var(--cx-space-2); border-color: transparent; background: transparent; }
  .cx-button--critical { border-color: var(--cx-color-critical); background: var(--cx-color-critical); color: var(--cx-color-surface); }
  .cx-button--icon { width: var(--cx-size-control-min); padding: 0; border-radius: 50%; }

  /* CX-R3 W7 — semantic cards. */
  .cx-card {
    border: var(--cx-border-width) solid var(--cx-color-border);
    border-radius: var(--cx-radius-lg);
    background: var(--cx-color-surface);
    padding: var(--cx-space-6);
  }
  .cx-card--soft { background: var(--cx-color-surface-raised); }
  .cx-card--content { border-top: 2px solid var(--cx-color-accent); }
  .cx-card--perspective { border-top: 2px solid var(--cx-domain-personal); }
  .cx-card--reality { border-left: 3px solid var(--cx-color-accent); }
  .cx-card--navigation-option { border-style: dashed; }
  .cx-card--evidence { background: var(--cx-color-surface-raised); }
  .cx-card--unknown { border-color: color-mix(in srgb, var(--cx-color-unknown) 45%, transparent); }
  .cx-card--book { box-shadow: var(--cx-shadow-1); }
  .cx-card--professional { border-top: 2px solid var(--cx-color-professional); }
  .cx-card--report { border-bottom: 3px solid var(--cx-color-ink); }

  /* CX-R3 W8 — form system. */
  .cx-field,
  .cx-form-field { display: grid; gap: var(--cx-space-2); }
  .cx-field > label,
  .cx-form-field > label { font-weight: 650; }
  .cx-input,
  .cx-textarea,
  .cx-select,
  .cx-date,
  .cx-time,
  .cx-field input,
  .cx-field textarea,
  .cx-field select,
  .cx-form-field input,
  .cx-form-field textarea,
  .cx-form-field select {
    width: 100%;
    min-height: var(--cx-size-control-min);
    padding: 0.78rem 0.9rem;
    border: var(--cx-border-width) solid var(--cx-color-border);
    border-radius: var(--cx-radius-sm);
    background: var(--cx-color-surface);
    color: var(--cx-color-ink);
  }
  .cx-textarea,
  .cx-field textarea,
  .cx-form-field textarea { min-height: 7rem; resize: vertical; }
  .cx-segmented { display: inline-flex; flex-wrap: wrap; gap: var(--cx-space-1); padding: var(--cx-space-1); border: var(--cx-border-width) solid var(--cx-color-border); border-radius: var(--cx-radius-full); background: var(--cx-color-surface-raised); }
  .cx-segmented button[aria-pressed="true"] { background: var(--cx-color-ink); color: var(--cx-color-surface); }
  .cx-radio,
  .cx-checkbox,
  .cx-consent { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: var(--cx-space-3); }
  .cx-radio input,
  .cx-checkbox input,
  .cx-consent input { width: 1.15rem; min-height: 1.15rem; margin-top: 0.2rem; }
  .cx-field-helper { margin: 0; font-size: var(--cx-type-body-sm); color: var(--cx-color-ink-muted); }
  .cx-field-error { margin: 0; font-size: var(--cx-type-body-sm); color: var(--cx-color-critical); font-weight: 650; }
  .cx-field[data-invalid="true"] input,
  .cx-field[data-invalid="true"] textarea,
  .cx-field[data-invalid="true"] select { border-color: var(--cx-color-critical); }

  /* CX-R3 W9 — one status language. Labels remain mandatory; color is supplemental. */
  .cx-status {
    display: inline-flex;
    width: fit-content;
    align-items: center;
    gap: var(--cx-space-2);
    padding: 0.35rem 0.65rem;
    border: var(--cx-border-width) solid var(--cx-color-border);
    border-radius: var(--cx-radius-full);
    background: var(--cx-color-surface-raised);
    font-size: var(--cx-type-caption);
    font-weight: 700;
    line-height: 1.2;
  }
  .cx-status::before { width: 0.5rem; height: 0.5rem; border: 1px solid currentColor; border-radius: 50%; content: ""; background: currentColor; }
  .cx-status--available { color: var(--cx-color-success); }
  .cx-status--limited { color: var(--cx-color-warning); }
  .cx-status--unavailable { color: var(--cx-color-unknown); }
  .cx-status--in-review { color: var(--cx-color-accent); }
  .cx-status--unknown { color: var(--cx-color-unknown); }
  .cx-status--needs-attention { color: var(--cx-color-critical); }
  .cx-status--professional-required { color: var(--cx-color-professional); }

  /* CX-R3 W10 — evidence language. */
  .cx-evidence-panel { display: grid; gap: var(--cx-space-4); padding: var(--cx-space-5); border: var(--cx-border-width) solid var(--cx-color-border); border-radius: var(--cx-radius-md); background: var(--cx-color-surface-raised); }
  .cx-evidence,
  .cx-source,
  .cx-unknown,
  .cx-confidence,
  .cx-assumption,
  .cx-limitation,
  .cx-professional-note { display: grid; grid-template-columns: minmax(7rem, auto) minmax(0, 1fr); gap: var(--cx-space-4); align-items: start; }
  .cx-evidence { border-top: var(--cx-border-width) solid var(--cx-color-border); padding-top: var(--cx-space-4); }
  .cx-evidence dt { font-size: var(--cx-type-caption); color: var(--cx-color-ink-muted); }
  .cx-evidence dd { margin: 0; }
  .cx-source::before,
  .cx-unknown::before,
  .cx-confidence::before,
  .cx-assumption::before,
  .cx-limitation::before,
  .cx-professional-note::before { font-size: var(--cx-type-label); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cx-color-ink-muted); }
  .cx-source::before { content: "Source"; }
  .cx-unknown::before { content: "Unknown"; }
  .cx-confidence::before { content: "Confidence"; }
  .cx-assumption::before { content: "Assumption"; }
  .cx-limitation::before { content: "Limitation"; }
  .cx-professional-note::before { content: "Professional note"; color: var(--cx-color-professional); }

  /* CX-R3 W11 — runtime result primitives. */
  .cx-result-section { display: grid; gap: var(--cx-space-6); }
  .cx-result-finding { padding-left: var(--cx-space-5); border-left: 3px solid var(--cx-color-accent); }
  .cx-result-context { padding: var(--cx-space-5); border-radius: var(--cx-radius-md); background: var(--cx-color-surface-raised); }
  .cx-result-evidence { border-top: var(--cx-border-width) solid var(--cx-color-border); padding-top: var(--cx-space-4); }
  .cx-result-unknown { padding: var(--cx-space-4); border: var(--cx-border-width) dashed var(--cx-color-border-strong); border-radius: var(--cx-radius-md); }
  .cx-result-perspective { padding: var(--cx-space-5); border-left: 3px solid var(--cx-domain-personal); }
  .cx-result-action { display: flex; flex-wrap: wrap; gap: var(--cx-space-3); align-items: center; }

  /* CX-R3 W12 — workspace components. */
  .cx-workspace { display: grid; grid-template-columns: minmax(13rem, var(--cx-size-sidebar)) minmax(0, 1fr); min-height: 34rem; overflow: hidden; border: var(--cx-border-width) solid var(--cx-color-border); border-radius: var(--cx-radius-lg); background: var(--cx-color-surface); }
  .cx-workspace-header { display: grid; gap: var(--cx-space-3); padding-bottom: var(--cx-space-5); border-bottom: var(--cx-border-width) solid var(--cx-color-border); }
  .cx-context-summary { display: grid; gap: var(--cx-space-2); padding: var(--cx-space-4); border-radius: var(--cx-radius-md); background: var(--cx-color-surface-raised); }
  .cx-stage-rail,
  .cx-workspace__rail { padding: var(--cx-space-5); border-right: var(--cx-border-width) solid var(--cx-color-border); background: var(--cx-color-surface-raised); }

.cx-ecr-mandala:focus,.cx-ecr-calculation-story:focus,.cx-ecr-coordinate-story__section:focus,.cx-ecr-driver-profile:focus,.cx-ecr-motion:focus,.cx-ecr-activation:focus,.cx-ecr-specialist-reading>section:focus,.cx-ecr-technical:focus{outline:3px solid color-mix(in srgb,var(--cx-accent,#9b6a16) 65%,transparent);outline-offset:4px}

}

@media print{

  .cx-ecr-driver-profile__bar span,.cx-ecr-motion__node.is-current,.cx-ecr-activation__stage.is-current{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .cx-ecr-spread__grid{grid-template-columns:repeat(3,1fr)}
  .cx-ecr-technical{break-before:page}
}
