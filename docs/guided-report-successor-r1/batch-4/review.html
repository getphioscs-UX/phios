<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BaZi Batch 4 · P20–P22</title><link rel="stylesheet" href="/assets/css/tokens.css"><link rel="stylesheet" href="/assets/customer-ui/surfaces/visual-report.css"><style>body{margin:0;background:#e8e5de}nav{padding:16px;max-width:940px;margin:auto;font:14px/1.5 system-ui}nav a,nav button{margin:4px;padding:8px;display:inline-block}#comparison{max-width:1440px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px}#comparison img{width:100%}#comparison[hidden]{display:none}#comparison .vrpt-page{margin:0}#comparison figcaption{font:14px system-ui}button,select{font:inherit}@media(max-width:600px){#comparison{grid-template-columns:1fr;padding:8px}}@media print{nav,#comparison{display:none!important}body{background:white}}</style><nav><strong>BaZi · BATCH 4 · P20–P22</strong><p>计算示例，非客户资料。切换目标案例会切换独立测试盘，不代表原示例的当前年份；默认 PDF 保留无目标状态。来自现有八字 runtime；参考图只控制构图。三语言共享数据、Web 与 PDF 共享 Page IR。动态视觉待确认；到 P22 停止。</p><a href="?locale=zh-Hans">中文</a><a href="?locale=en">English</a><a href="?locale=bilingual">双语</a><label>独立测试案例 <select id="case"><option value="default">原示例／无目标时间</option><option value="selected">完整目标／独立测试盘</option><option value="transition">交接日／仅流年</option><option value="annualMissing">缺流年</option><option value="cycleMissing">缺当前大运</option></select></label><button id="compare">参考图并排对照</button><label>页面 <select id="page"><option value="20">P20</option><option value="21">P21</option><option value="22">P22</option></select></label><a id="pdf">A4 PDF</a><p>并排对照保留参考构图、金线与象牙白面板；不复制参考图的人物资料、比例、判断或山水像素。</p></nav><main id="report"></main><div id="comparison" hidden></div><script type="module">
import {renderVisualReportPages} from '/assets/customer-ui/js/personal-products/visual-report-pages.js';
const data=await(await fetch('./cases.json')).json();const locale=new URLSearchParams(location.search).get('locale')||'zh-Hans';const caseKey=new URLSearchParams(location.search).get('case')||'default';const report=caseKey==='default'?data.reports[locale]:data.caseVariants[caseKey]?.reports[locale];document.querySelector('#case').value=caseKey;document.querySelector('#case').onchange=e=>location.search='?locale='+locale+'&case='+e.target.value;document.querySelector('#pdf').hidden=caseKey!=='default';if(!report)throw Error('Unknown locale');window.batchReport=report;document.querySelector('#report').innerHTML=renderVisualReportPages(report);document.querySelector('#pdf').href='./bazi-p20-p22-'+locale+'.pdf';
const refs={M07:'M07 Timing.webp'};function compare(){const number=Number(document.querySelector('#page').value),p=report.pages.find(x=>x.pageNumber===number);const target=document.querySelector('#comparison');target.innerHTML='<figure><img alt="Composition reference '+p.visualTemplateId+'" src="/assets/images/report/'+encodeURIComponent(refs[p.visualTemplateId])+'"><figcaption>'+p.visualTemplateId+' · COMPOSITION REFERENCE ONLY</figcaption></figure><div>'+document.querySelector('[data-page-number="'+number+'"]').outerHTML+'</div>';target.querySelector('div').className='vrpt-report';target.querySelector('div').dataset.visualBatch=report.visualBatch;target.hidden=false;document.querySelector('#report').hidden=true;}document.querySelector('#compare').onclick=()=>{if(!document.querySelector('#comparison').hidden){document.querySelector('#comparison').hidden=true;document.querySelector('#report').hidden=false;}else compare();};document.querySelector('#page').onchange=()=>{if(!document.querySelector('#comparison').hidden)compare();};for(const a of document.querySelectorAll('nav a[href^="?locale="]'))a.href+='&case='+caseKey;window.batchReady=true;
</script></html>
