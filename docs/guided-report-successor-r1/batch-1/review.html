<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BaZi Batch 1 · P06–P10</title><link rel="stylesheet" href="/assets/css/tokens.css"><link rel="stylesheet" href="/assets/customer-ui/surfaces/visual-report.css"><style>body{margin:0;background:#e8e5de}nav{padding:16px;max-width:940px;margin:auto;font:14px/1.5 system-ui}nav a,nav button{margin:4px;padding:8px;display:inline-block}#comparison{max-width:1440px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px}#comparison img{width:100%}#comparison[hidden]{display:none}#comparison .vrpt-page{margin:0}#comparison figcaption{font:14px system-ui}button,select{font:inherit}@media(max-width:600px){#comparison{grid-template-columns:1fr;padding:8px}}@media print{nav,#comparison{display:none!important}body{background:white}}</style><nav><strong>BaZi · BATCH 1 · P06–P10</strong><p>计算示例，非客户资料。来自现有八字 runtime；参考图只控制构图。三语言共享数据、Web 与 PDF 共享 Page IR。动态视觉待确认；到 P10 停止。</p><a href="?locale=zh-Hans">中文</a><a href="?locale=en">English</a><a href="?locale=bilingual">双语</a><button id="compare">参考图并排对照</button><label>页面 <select id="page"><option value="6">P06</option><option value="7">P07</option><option value="8">P08</option><option value="9">P09</option><option value="10">P10</option></select></label><a id="pdf">A4 PDF</a><p>并排对照保留参考构图、金线与象牙白面板；不复制参考图的人物资料、比例、判断或山水像素。</p></nav><main id="report"></main><div id="comparison" hidden></div><script type="module">
import {renderVisualReportPages} from '/assets/customer-ui/js/personal-products/visual-report-pages.js';
const data=await(await fetch('./cases.json')).json();const locale=new URLSearchParams(location.search).get('locale')||'zh-Hans';const report=data.reports[locale];if(!report)throw Error('Unknown locale');window.batchReport=report;document.querySelector('#report').innerHTML=renderVisualReportPages(report);document.querySelector('#pdf').href='./bazi-p06-p10-'+locale+'.pdf';
const refs={M03:'M03 Snapshot.webp',M04:'M04 Structure.webp',M05:'M05 Distribution.webp'};function compare(){const number=Number(document.querySelector('#page').value),p=report.pages.find(x=>x.pageNumber===number);const target=document.querySelector('#comparison');target.innerHTML='<figure><img alt="Composition reference '+p.visualTemplateId+'" src="/assets/images/report/'+encodeURIComponent(refs[p.visualTemplateId])+'"><figcaption>'+p.visualTemplateId+' · COMPOSITION REFERENCE ONLY</figcaption></figure><div>'+document.querySelector('[data-page-number="'+number+'"]').outerHTML+'</div>';target.querySelector('div').className='vrpt-report';target.querySelector('div').dataset.visualBatch=report.visualBatch;target.hidden=false;document.querySelector('#report').hidden=true;}document.querySelector('#compare').onclick=()=>{if(!document.querySelector('#comparison').hidden){document.querySelector('#comparison').hidden=true;document.querySelector('#report').hidden=false;}else compare();};document.querySelector('#page').onchange=()=>{if(!document.querySelector('#comparison').hidden)compare();};window.batchReady=true;
</script></html>
