<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report successor candidate review</title><link rel="stylesheet" href="/assets/customer-ui/surfaces/visual-report.css"><style>body{margin:0;background:#edf1f3;font:16px/1.6 system-ui}main{max-width:1440px;margin:auto;padding:16px}select{max-width:100%;padding:12px}nav li{overflow-wrap:anywhere}</style><main><h1>Report candidate review / 报告候选审阅</h1><p>Static artwork missing. Translation meaning and visual acceptance pending. Synthetic data only. / 静态图缺失，语言含义与视觉待审核，仅使用测试资料。</p><label>Variant <select id="variant"></select></label><div id="report"></div></main><script type="module">import {renderVisualReportPages} from '/assets/customer-ui/js/personal-products/visual-report-pages.js';const m=await(await fetch('./cases.json')).json();variant.innerHTML=m.cases.map(c=>'<option value="'+c.path+'">'+c.method+' · '+c.reportLocale+'</option>').join('');async function show(){document.body.dataset.ready='false';const r=await(await fetch('./'+variant.value)).json();document.documentElement.lang=r.presentation.reportLocale==='bilingual'?'zh-Hans':r.presentation.reportLocale;document.getElementById('report').innerHTML=renderVisualReportPages(r);document.body.dataset.ready='true';}variant.value=new URLSearchParams(location.search).get('case')||m.cases[0].path;variant.onchange=show;await show();</script></html>
