<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Observation time · R2 review</title><style>body{font:18px/1.7 system-ui;margin:30px auto;padding:20px;max-width:760px;background:#fcfaf5;color:#23364a}label{display:block;margin:16px 0}input,textarea,button{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}fieldset{border:1px solid #cbb88e}output{display:block;padding:16px}a{color:inherit}</style><h1>观察时间选择</h1><p>输入组件预览。不会改变已生成的报告。</p><form><div id="control"></div><button>查看时间选择</button></form><output aria-live="polite"></output><a href="review.html">返回报告</a><script type="module">import {mountPublicationObservationControl} from '/assets/customer-ui/js/personal-inputs/shared-target-context.js';import {resolveReportObservationTime} from '/functions/method-production-activation/report-observation-time.js';const locale=new URLSearchParams(location.search).get('locale')||'zh-Hans';const control=mountPublicationObservationControl(document.querySelector('#control'),{locale,customerTimezone:'Asia/Kuala_Lumpur'});document.querySelector('form').onsubmit=e=>{e.preventDefault();try{const snapshot=resolveReportObservationTime({...control.read(),generatedAt:new Date().toISOString()});document.querySelector('output').textContent=snapshot.localDate+' · '+snapshot.localTime+' · '+snapshot.timezone+' ('+snapshot.utcOffset+')';}catch{document.querySelector('output').textContent='请核对日期、时间和时区。 / Please check the date, time and timezone.';}};window.inputReady=true;</script></html>
