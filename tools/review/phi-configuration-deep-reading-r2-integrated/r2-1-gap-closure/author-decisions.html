<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R2.1 作者逐项决定</title><style>body{max-width:1000px;margin:30px auto;padding:20px;font:16px/1.6 Arial;background:#f2f5f4;color:#193b43}article{background:white;margin:20px 0;padding:20px}label{display:block}textarea{width:95%;min-height:70px}</style><h1>作者逐项决定 / Author decisions</h1><p>现有三条 Story 仍缺完整原稿。本表不会改变 runtime admission。每项默认为待决定；导出也不自动发布。</p><label>作者／审阅者 Reviewer <input id="reviewer"></label><div id="items"></div><button id="export">导出带内容 SHA256 的决定 / Export bound decisions</button><script>const units=[{"id":"CAPABILITY_RUNTIME_FORMATION","source":"tools/review/phi-configuration-deep-reading-r2-integrated/original-story-candidates.json","sourceSha256":"1be15f884d75026d74aeda36e59dfc8b28e8e14b17750a5e3b394bf84763dda8","contentSha256":"46592d9f98fe8d89cfb878b3fee0f9ca45e893c1b483df70b15b7dfba8e436c8","status":"AUTHOR_REVIEW_REQUIRED","manuscriptCompleteness":"FIELD_DRAFT_ONLY_FULL_STORY_MANUSCRIPT_NOT_SUPPLIED","decision":null},{"id":"RELATIONSHIP_FEEDBACK","source":"tools/review/phi-configuration-deep-reading-r2-integrated/original-story-candidates.json","sourceSha256":"1be15f884d75026d74aeda36e59dfc8b28e8e14b17750a5e3b394bf84763dda8","contentSha256":"40971ef226bf4a2bb662bcd09d7a38f89393ca9c29bccd8ce0d4b99fb06835f6","status":"AUTHOR_REVIEW_REQUIRED","manuscriptCompleteness":"FIELD_DRAFT_ONLY_FULL_STORY_MANUSCRIPT_NOT_SUPPLIED","decision":null},{"id":"CONTRIBUTION_RESOURCE_CONTINUITY","source":"tools/review/phi-configuration-deep-reading-r2-integrated/original-story-candidates.json","sourceSha256":"1be15f884d75026d74aeda36e59dfc8b28e8e14b17750a5e3b394bf84763dda8","contentSha256":"70e6c293bdde478ab7482d0d015a9290312a1121667c1d4b44b9108aa6ed67a2","status":"AUTHOR_REVIEW_REQUIRED","manuscriptCompleteness":"FIELD_DRAFT_ONLY_FULL_STORY_MANUSCRIPT_NOT_SUPPLIED","decision":null},{"id":"DESIGN_JUPITER_15_6","source":"tools/review/phi-configuration-deep-reading-r2-integrated/original-story-candidates.json","sourceSha256":"1be15f884d75026d74aeda36e59dfc8b28e8e14b17750a5e3b394bf84763dda8","contentSha256":"c05af5ef1ec14ad27ab1cd29f49809066aeb57f5b5a1f5dcc36d6170a0b0adff","decision":null,"status":"AUTHOR_REVIEW_REQUIRED"}];const host=document.querySelector('#items');for(const u of units){const a=document.createElement('article');const h=document.createElement('h2');h.textContent=u.id;a.append(h);const p=document.createElement('p');p.textContent=u.contentSha256;a.append(p);const s=document.createElement('select');s.dataset.id=u.id;for(const v of ['', 'ACCEPT','REVISE','REJECT']){const o=document.createElement('option');o.value=v;o.textContent=v||'PENDING / 待决定';s.append(o);}a.append(s);const n=document.createElement('textarea');n.placeholder='逐项修改意见、来源和权利意见 / Revision, sources and rights';a.append(n);host.append(a);}document.querySelector('#export').onclick=()=>{if(!document.querySelector('#reviewer').value.trim())return alert('Reviewer required / 请填写审阅者');const result={schemaVersion:'ECR-R21-AUTHOR-DECISION-DRAFT-v1',reviewer:document.querySelector('#reviewer').value.trim(),reviewedAt:new Date().toISOString(),runtimeAdmission:false,requiresAuthorizedHumanAdmissionProcess:true,decisions:units.map((u,i)=>({...u,decision:host.children[i].querySelector('select').value||null,notes:host.children[i].querySelector('textarea').value}))};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));a.download='author-decisions-r21.json';a.click();};</script></html>
