与摩羯都是非常强调深度与结构的星座，只是表达方式不同。天蝎关心的是：事情真正的核心在哪里？什么需要被彻底看清、处理、转化？摩羯则更关心：这个东西怎样落地？谁承担？怎样长期运行？","因此，你的盘不是轻飘型的。很多事情一旦进入你的生命，很容易从「我试试看」逐渐变成「我要知道它到底是什么」「我要把它建立成一个真正能存在的结构」。","这既是你的能力，也是你的负荷来源。"]},{"blockId":"CHAPTER-2","title":"二｜核心运作结构：月亮是入口，火星与土星是终点","paragraphs":["你的上升点位于巨蟹座，因此在传统七星守护体系里，月亮是这张盘最重要的整盘入口之一。这里的「命盘守护星」并不等于唯一主宰你的星体，而是表示：当你进入现实、面对新情境、判断是否安全、是否值得投入时，很多事情会先经过月亮所代表的适应、节律、回应与内在调节。","但你的月亮并没有停留在巨蟹式的情绪容纳。月亮落在双子座第十二宫，随后经由守护关系进入水星，而水星位于天蝎座第五宫，最后进入火星；火星本身落在天蝎座第四宫，是守护链的一个最终终点。换句话说，你的很多重要反应会经历这样一条内部路径：","先感受到 → 再分辨和思考 → 再深入问题本身 → 最后才真正行动。","这解释了一种很常见的生活经验：别人看到你「突然决定了」，但你自己知道，那并不是突然。真正的过程可能已经在心里进行了很久。你可能先感觉某件事不太对，之后反复想、观察、比较，然后才真正确定问题在哪里；一旦看清，你的行动往往比别人想象得更坚决。","另一方面，金星、天王星、海王星都通过摩羯座进入土星，而土星本身也位于摩羯座，是另一个最终守护终点。于是整张盘形成两类非常清楚的终端功能：","火星：行动、边界、切入、推动。","土星：责任、结构、承载、长期稳定。","你的很多人生问题最终都会落到这两者之间：我要不要真正行动？这件事情值不值得长期承担？","这种结构非常有力量，但也意味着你不太适合随意投入。因为你一旦进入，通常不是浅浅地参与。你很容易既投入行动，又承担责任。"]}],"en":[{"blockId":"OPENING","title":"Personal Astrology Reading","paragraphs":["This report reads your natal chart as an integrated whole rather than treating the Sun, Moon, Venus, or any other single planet as an isolated label. Several structural centers stand out very clearly. Cancer rises on the Ascendant, making the Moon an important entry point into the chart. The Moon’s dispositor path continues through Mercury and Mars, while Saturn forms another major terminal point in the chart’s rulership structure. At the same time, Jupiter, Venus, Saturn, and Neptune form an exceptionally tight network of major aspects across the twelfth and sixth houses, linking inner space, recovery, and unseen load with daily functioning, responsibility, work, and maintenance."]},{"blockId":"CHAPTER-1","title":"Chart Overview: Depth, Structure, and the Inner Background","paragraphs":["Among your ten core planets, five are in Water signs, four in Earth signs, one in an Air sign, and none in Fire signs. By modality, five are Cardinal, four are Fixed, and one is Mutable. These counts should not be reduced to labels such as “emotional,” “stubborn,” or “lacking initiative.” Element and modality distributions describe the background structure of the chart, not a complete personality profile.","Even so, one pattern is unmistakable: Water and Earth dominate the chart’s planetary distribution, while Cardinal and Fixed modes account for nearly all of it. This creates a strong combination of depth, realism, initiation, and persistence. You are likely to care not only about what something means, but whether it can actually be built, sustained, and carried into real life.","This helps explain why you may not be satisfied with things that merely sound convincing. If something never becomes real, it can be difficult for you to keep believing in it. At the same time, if a structure is functional but has lost its meaning, you are unlikely to remain engaged with it indefinitely simply because it already exists.","Four planets in your chart are in Scorpio: the Sun, Mercury, Mars, and Pluto. Another four are concentrated in Capricorn: Venus, Saturn, Uranus, and Neptune. Scorpio and Capricorn both emphasize depth and structure, but in different ways. Scorpio asks: What is really underneath this? What needs to be understood, confronted, or transformed? Capricorn asks: How will this work in practice? Who will carry the responsibility? What can endure over time?","This is not a lightweight chart. Once something genuinely enters your life, you may move quickly from “I want to try this” to “I need to understand what this really is” and eventually to “I want to build this into something that can actually stand.”","That is both a strength and a source of pressure."]},{"blockId":"CHAPTER-2","title":"Core Operating Structure: The Moon as Entry Point, Mars and Saturn as Terminals","paragraphs":["Your Ascendant is in Cancer. Under the traditional seven-planet rulership system, the Moon therefore functions as one of the chart’s most important entry points. Calling the Moon the chart ruler does not mean it controls your personality or determines your fate. It means that many situations are first routed through lunar functions such as adaptation, rhythm, responsiveness, and internal regulation.","But the Moon does not remain in a purely Cancerian mode of containment. It is placed in Gemini in the twelfth house, and its dispositor path continues to Mercury. Mercury is in Scorpio in the fifth house and is ultimately routed to Mars. Mars itself is in Scorpio in the fourth house and acts as one of the chart’s final dispositors.","In practice, this suggests a process that often moves in stages:","First you sense something → then you differentiate and think it through → then you go deeper into the issue → only then do you act decisively.","This can produce a familiar experience: other people may see you make what appears to be a sudden decision, while from your perspective it was not sudden at all. The actual process may have been unfolding internally for quite some time. You may first notice that something feels wrong, then think about it repeatedly, observe patterns, compare details, and only later identify what the real issue is. Once that point is reached, your actions can become much firmer than others expect.","A second major pathway in the chart ends at Saturn. Venus, Uranus, and Neptune are all in Capricorn and therefore route through Saturn. Saturn itself is also in Capricorn and forms the chart’s other major terminal point.","This gives the chart two very clear organizing endpoints:","Mars: action, boundary, mobilization, and directed force.","Saturn: responsibility, structure, endurance, and long-term support.","Many important questions in your life may eventually come down to some version of these two decisions:","Do I need to act?","And if I enter this, is it worth carrying over the long term?","This is a powerful structure, but it also means that casual involvement may not suit you very well. Once you truly enter something, you often do not participate only at the surface. You are likely to bring both action and responsibility with you."]}]},"sharedDiagrams":["AST-D01","AST-D02"],"profile":{"sectionId":"SEC-01","assetId":"VIS-REPORT-ASTROLOGY-SEC-01-NATAL-ARCHITECTURE","assetPath":"assets/ast-vfr-r1/images/reports/astrology/editorial/shared/VIS-REPORT-ASTROLOGY-SEC-01-NATAL-ARCHITECTURE.webp","assetDigest":"e4c515d10c614dfaed2d6a6b10646ffcdeac28fce4866d7c7294f86197f181b1","layoutVersion":"PHI-OS-AST-SECTION-MASTER-LAYOUT-v1.0.0","safeZone":{"x":70,"y":900,"width":654,"height":150},"anchor":{"xPercent":50,"yPercent":50},"centerAnchor":{"x":397,"y":975},"alignment":"CENTER","sectionNumberStyle":{"fontSize":17,"lineHeight":1.2},"zhTitleStyle":{"fontSize":32,"lineHeight":1.2},"enTitleStyle":{"fontSize":20,"lineHeight":1.2},"zhDescriptorStyle":{"fontSize":14,"lineHeight":1.4},"enDescriptorStyle":{"fontSize":13,"lineHeight":1.4},"spacing":{"number":3,"title":4,"descriptor":5,"rule":5},"maxLines":{"zhTitle":1,"enTitle":1,"zhDescriptor":1,"enDescriptor":1},"overflowPolicy":"FAIL_CLOSED","horizontalTolerance":4,"verticalTolerance":4,"protectedRegions":[{"x":190,"y":260,"width":420,"height":555},{"x":375,"y":805,"width":44,"height":90}],"text":{"number":"01","zhTitle":"本命架构","enTitle":"Natal Architecture","zhDescriptor":"深度、结构与整盘入口","enDescriptor":"Depth, structure, and the chart's entry point"},"humanStatus":"HUMAN_REVIEW_PENDING","descriptors":["深度、结构与整盘入口","Depth, structure, and the chart's entry point"]},"diagrams":[{"id":"AST-D01","hero":true,"html":"\u003cfigure class=\"figure\" data-diagram=\"AST-D01\">\u003ch3>本命盘 \u003cspan>Natal Wheel\u003c/span>\u003c/h3>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 720\" role=\"img\" data-diagram=\"AST-D01\" aria-label=\"占星结构图\" style=\"font-family:Segoe UI Symbol,Microsoft YaHei,serif\">\u003ctitle>占星结构图\u003c/title>\u003ctext x=\"40\" y=\"35\" text-anchor=\"start\" font-size=\"25\" fill=\"#193746\" >本命盘 · Placidus\u003c/text>\u003ccircle cx=\"360\" cy=\"330\" r=\"276\" fill "#193746\" >圈内符号表示实际落宫；宫位数量不定义人生结果。\u003c/text>\u003c/svg>\u003cfigcaption>第四、第五、第六与第十二宫的行星集中。\u003cbr>Planet concentrations in houses 4, 5, 6 and 12.\u003c/figcaption>\u003cdiv class=\"legend\">☉ Sun · ☽ Moon · ☿ Mercury · ♀ Venus · ♂ Mars · ♃ Jupiter · ♄ Saturn · ♅ Uranus · ♆ Neptune · ♇ Pluto\u003c/div>\u003c/figure>"}],"insertions":{"AST-D01":["OPENING",0],"AST-D02":["CHAPTER-2",1],"AST-D06":["CHAPTER-4",1],"AST-D04":["CHAPTER-5",0],"AST-D05":["CHAPTER-4",0],"AST-D07":["CHAPTER-5",2],"AST-D08":["CHAPTER-3",1],"AST-D09":["CHAPTER-6",1],"AST-D10":["CHAPTER-7",1],"AST-D11":["CHAPTER-8",1],"AST-D12":["CHAPTER-9",1],"AST-D14":["CHAPTER-10",1],"AST-D15":["CHAPTER-12",3]}},{"sectionId":"SEC-02","title":"模式与资源","englishTitle":"Pattern & Resources","assetId":"VIS-REPORT-ASTROLOGY-SEC-02-PATTERN-RESOURCES","modeLabel":"","localeBlocks":{"zhHans":[{"blockId":"CHAPTER-4","title":"四｜第六宫与第十二宫：你命盘最重要的现实轴线","paragraphs":["你的盘里最紧密的一组主要相位网络，是：","第六宫的金星、土星、海王星，与第十二宫的木星彼此形成非常精确的合相与对分。","其中，金星合土星约 0.47°，金星合海王星约 0.33°，土星合海王星约 0.14°；而木星则几乎精确地与这三颗星形成对分，其中木星对冲海王星只有约 0.06°。这是一组非常集中的结构，不是因为它拥有某个传统格局名称，而是因为四颗行星之间的连线密度极高。","第六宫和第十二宫本身是一条非常值得认真理解的轴线。","第六宫涉及日常运作、工作、服务、维护、责任、流程与持续负荷；第十二宫则涉及后台过程、恢复、退隐、结束、没有被别人看见的部分，以及那些不容易立即进入语言和表面秩序的东西。","因此，你的生活里很可能经常出现一种张力：","外面的系统仍然在运行，但里面的负荷已经很大。","金星在第六宫，使你会关心日常安排是否符合自己的价值与审美。你不是只想把事情完成，你还会在意：这个方式值得吗？关系是否公平？投入与回报是否协调？","土星也在第六宫，则把责任、耐久、秩序和持续性放到同一个领域。于是「应该做的事」很容易变得很多，而且很多责任并不是一次性的，而是持续发生的。","海王星又在这里，带来另一层复杂性。某些责任、服务或工作边界可能会变得模糊。你可能不是不知道事情很多，而是不容易马上区分：","哪些是我的责任？\n哪些只是因为我能做，所以慢慢落到我身上？\n哪些事情已经从帮助变成了长期代偿？","而对面的木星在第十二宫，会扩大后台空间。","这并不简单等于「隐藏的好运」。更准确地说，它放大了内在整合、恢复、退隐、无形负荷与宽广背景之间的关系。于是你一方面很能承担外部系统，另一方面又需要比很多人更多的内部恢复空间。","真正重要的是：这两边不能长期互相否认。","如果你只强调第六宫，不断做、不断负责、不断维持，第十二宫的负荷会越来越大。","如果你只退回第十二宫，不愿意进入现实结构，第六宫又会不断把责任重新带回来。","你的平衡不是选其中一边，而是让两边真正形成循环：","工作以后能恢复，承担以后能退出，服务别人以后还能回到自己的空间。"]},{"blockId":"CHAPTER-5","title":"五｜价值、责任与理想：金星、土星、海王星的合相","paragraphs":["金星、土星与海王星在摩羯座第六宫彼此非常接近，这是你盘里非常重要的一个复合结构。","金星处理价值、偏好、吸引与交换；土星负责限制、责任与长期结构；海王星则带来渗透、理想、模糊与情境融合。三者集中在一起，使「我重视什么」「我愿意承担什么」「我理想中希望它是什么」这三个问题很难完全分开。","现实中，这可能表现为：你很少只因为喜欢就投入。","你还会考虑：","这能不能持续？\n现实条件够不够？\n我需要承担什么？\n别人是不是也在承担？\n这件事最后会变成怎样的日常？","但另一方面，你也不会只因为一个结构稳定就满意。","如果一个工作、关系或生活安排非常稳定，却已经没有价值感、没有共鸣、没有真正的意义，你可能仍然会逐渐感觉消耗。","这使你的人生很容易出现一个长期主题：","理想需要现实，现实也必须保留理想。","如果理想过多、结构不足，容易失望。","如果结构过多、意义太少，则容易变成沉重。","金星合土星也往往使价值选择带有时间感。你可能不会轻易把最重要的东西交出去，但一旦真正认可，也愿意持续投入。金星合海王星则使你仍然保留很强的共感与想象力。","于是你既不是纯粹现实主义，也不是纯粹理想主义。","你的功课更接近：哪些理想值得被建成现实。"]}],"en":[{"blockId":"CHAPTER-4","title":"The Sixth–Twelfth House Axis: One of the Central Structures of the Chart","paragraphs":["The tightest major-aspect network in your chart connects Venus, Saturn, and Neptune in the sixth house with Jupiter in the twelfth.","Venus is conjunct Saturn by about 0.47°. Venus is conjunct Neptune by about 0.33°. Saturn is conjunct Neptune by about 0.14°. Jupiter, from the twelfth house, stands in extremely close opposition to all three, with the Jupiter–Neptune opposition within roughly 0.06°.","This is an unusually concentrated structure. Its importance does not come from forcing it into a named traditional pattern. It is important because four planets are tied together through a dense network of very close major aspects.","The sixth and twelfth houses form an especially meaningful axis.","The sixth house deals with daily operation, work, service, maintenance, responsibility, routines, and sustained load. The twelfth house deals with background processes, retreat, recovery, closure, unseen strain, and the parts of experience that do not easily become visible or organized.","This creates a recurring tension:","The external system may still be functioning while the internal load has already become substantial.","Venus in the sixth house makes value an important part of daily life. You may care not only whether something gets done, but whether the way it is being done still feels worthwhile, fair, or aligned with what matters to you.","Saturn in the sixth brings responsibility, structure, endurance, and repetition into the same territory. Duties can accumulate, and many of them may not be one-time tasks. They can become ongoing structures that you continue carrying simply because they need to be maintained.","Neptune complicates this further by making some boundaries around service, responsibility, or work more permeable. The issue may not be that you are unaware of how much is happening. The difficulty may be in separating:","What is actually my responsibility?","What has gradually become mine simply because I am capable of handling it?","What began as help but has now turned into long-term compensation for someone else’s absence?","On the opposite side, Jupiter in the twelfth enlarges the inner background.","This should not be reduced to a phrase such as “hidden luck.” More accurately, Jupiter expands the field of retreat, integration, recovery, unseen load, and contextual understanding. This can give you a considerable capacity for inner processing, but it can also mean that you require more internal space than other people realize.","The important point is that these two sides cannot keep denying each other.","If you emphasize only the sixth house—working, carrying, maintaining, producing—the twelfth-house load can steadily increase.","If you retreat completely into the twelfth and avoid external structure, the sixth house will eventually bring practical obligations back into focus.","Balance therefore does not come from choosing one side.","It comes from creating a functioning cycle:","After work, there must be recovery. After responsibility, there must be release. After serving others, there must still be a way back to your own space."]},{"blockId":"CHAPTER-5","title":"Values, Responsibility, and Ideals: Venus, Saturn, and Neptune Together","paragraphs":["Venus, Saturn, and Neptune are closely conjunct in Capricorn in the sixth house, making them one of the most important compound structures in the chart.","Venus organizes value, attraction, preference, and conditions of exchange. Saturn organizes limitation, accountability, durability, and long-term structure. Neptune introduces permeability, imagination, ambiguity, and the tendency for boundaries to become less clearly defined.","Because these functions are tightly concentrated, three questions can become difficult to separate:","What do I value?","What am I willing to carry?","What do I hope this could become?","In practical life, this can mean that you rarely commit simply because you like something.","You may also ask:","Can this last?","Are the conditions realistic?","What will I have to carry?","Is anyone else carrying their part?","What will this become in ordinary daily life?","At the same time, stability alone may not be enough.","A work situation, relationship, or life arrangement can be very structured and still become draining if it no longer carries meaning, value, or emotional resonance.","This creates a long-term theme:","Ideals need reality, but reality must still preserve something of the ideal.","Too much ideal without structure can lead to disappointment.","Too much structure without meaning can become heavy.","Venus conjunct Saturn can make your value choices more time-conscious. You may not give your deepest commitment away easily, but once you truly believe in something, you can be willing to stay with it for a long time. Venus conjunct Neptune preserves imagination, empathy, and sensitivity inside that structure.","So you are unlikely to be a pure realist or a pure idealist.","The deeper question is:","Which ideals are worth building into reality?"]}]},"sharedDiagrams":["AST-D06","AST-D07","AST-D04","AST-D05"],"profile":{"sectionId":"SEC-02","assetId":"VIS-REPORT-ASTROLOGY-SEC-02-PATTERN-RESOURCES","assetPath":"assets/ast-vfr-r1/images/reports/astrology/editorial/shared/VIS-REPORT-ASTROLOGY-SEC-02-PATTERN-RESOURCES.webp","assetDigest":"05fa3f5feb6905f1605f60dca6ab0349d6d12730d75d0ba6624bd4b0e31ce11e","layoutVersion":"PHI-OS-AST-SECTION-MASTER-LAYOUT-v1.0.0","saf =\"rotate(-90 190 270)\"/>\u003ccircle cx=\"90\" cy=\"583\" r=\"5\" fill=\"#a57861\"/>\u003ctext x=\"108\" y=\"590\" text-anchor=\"start\" font-size=\"20\" fill=\"#193746\" >水象\u003c/text>\u003ctext x=\"295\" y=\"590\" text-anchor=\"end\" font-size=\"22\" fill=\"#193746\" >5\u003c/text>\u003ctext x=\"190\" y=\"265\" text-anchor=\"middle\" font-size=\"27\" fill=\"#193746\" >元素\u003c/text>\u003ctext x=\"190\" y=\"299\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >10 颗核心行星\u003c/text>\u003ccircle cx=\"530\" cy=\"270\" r=\"108\" fill=\"none\" stroke=\"#768e98\" opacity=\".15\" stroke-width=\"38\"/>\u003ccircle cx=\"530\" cy=\"270\" r=\"108\" fill=\"none\" stroke=\"#468384\" stroke-width=\"38\" stroke-dasharray=\"339.29200658769764 678.5840131753953\" stroke-dashoffset=\"0\" transform=\"rotate(-90 530 270)\"/>\u003ccircle cx=\"430\" cy=\"460\" r=\"5\" fill=\"#468384\"/>\u003ctext x=\"448\" y=\"467\" text-anchor=\"start\" font-size=\"20\" fill=\"#193746\" >基本\u003c/text>\u003ctext x=\"635\" y=\"467\" text-anchor=\"end\" font-size=\"22\" fill=\"#193746\" >5\u003c/text>\u003ccircle cx=\"530\" cy=\"270\" r=\"108\" fill=\"none\" stroke=\"#aa884f\" stroke-width=\"38\" stroke-dasharray=\"271.4336052701581 678.5840131753953\" stroke-dashoffset=\"-339.29200658769764\" transform=\"rotate(-90 530 270)\"/>\u003ccircle cx=\"430\" cy=\"501\" r=\"5\" fill=\"#aa884f\"/>\u003ctext x=\"448\" y=\"508\" text-anchor=\"start\" font-size=\"20\" fill=\"#193746\" >固定\u003c/text>\u003ctext x=\"635\" y=\"508\" text-anchor=\"end\" font-size=\"22\" fill=\"#193746\" >4\u003c/text>\u003ccircle cx=\"530\" cy=\"270\" r=\"108\" fill=\"none\" stroke=\"#768e98\" stroke-width=\"38\" stroke-dasharray=\"67.85840131753953 678.5840131753953\" stroke-dashoffset=\"-610.7256118578558\" transform=\"rotate(-90 530 270)\"/>\u003ccircle cx=\"430\" cy=\"542\" r=\"5\" fill=\"#768e98\"/>\u003ctext x=\"448\" y=\"549\" text-anchor=\"start\" font-size=\"20\" fill=\"#193746\" >变动\u003c/text>\u003ctext x=\"635\" y=\"549\" text-anchor=\"end\" font-size=\"22\" fill=\"#193746\" >1\u003c/text>\u003ctext x=\"530\" y=\"265\" text-anchor=\"middle\" font-size=\"27\" fill=\"#193746\" >模式\u003c/text>\u003ctext x=\"530\" y=\"299\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >10 颗核心行星\u003c/text>\u003ctext x=\"360\" y=\"667\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >分布是结构背景，不等于人格或能力评分。\u003c/text>\u003c/svg>\u003cfigcaption>十颗核心行星；分布不等于完整人格。\u003cbr>Ten core planets; distribution is not a complete personality profile.\u003c/figcaption>\u003cdiv class=\"legend\">☉ Sun · ☽ Moon · ☿ Mercury · ♀ Venus · ♂ Mars · ♃ Jupiter · ♄ Saturn · ♅ Uranus · ♆ Neptune · ♇ Pluto\u003c/div>\u003c/figure>"}],"insertions":{"AST-D01":["OPENING",0],"AST-D02":["CHAPTER-2",1],"AST-D06":["CHAPTER-4",1],"AST-D04":["CHAPTER-5",0],"AST-D05":["CHAPTER-4",0],"AST-D07":["CHAPTER-5",2],"AST-D08":["CHAPTER-3",1],"AST-D09":["CHAPTER-6",1],"AST-D10":["CHAPTER-7",1],"AST-D11":["CHAPTER-8",1],"AST-D12":["CHAPTER-9",1],"AST-D14":["CHAPTER-10",1],"AST-D15":["CHAPTER-12",3]}},{"sectionId":"SEC-03","title":"自我与表达","englishTitle":"Self & Expression","assetId":"VIS-REPORT-ASTROLOGY-SEC-03-SELF-EXPRESSION","modeLabel":"","localeBlocks":{"zhHans":[{"blockId":"CHAPTER-3","title":"三｜自我、表达与内在调节：你需要一个真正属于自己的深度空间","paragraphs":["太阳与水星都位于天蝎座第五宫。第五宫与创造、实验、表达、生成、个人作品以及「我真正想把什么东西带出来」有关。太阳在这里，使个人创造与表达不只是兴趣，它很容易和你的中心感连接在一起；水星也在这里，则使表达带有明显的研究、分析与深挖倾向。","你可能很难长期满足于表面的表达。对很多人来说，一个兴趣就是兴趣，一个项目就是项目；对你来说，一旦真正被某个主题吸引，很容易从「我想试试看」走向「我要把它弄清楚」。","这类投入有时表现为研究，有时是创作，有时是系统设计，也可能是某种长期计划。关键不在形式，而在于：你需要感觉自己的理解、判断与意志真正进入了这个东西。","太阳与水星在天蝎的组合，也使你对「别人没说出来的部分」很敏感。你可能会注意到语言背后的动机、结构里的漏洞、关系中隐藏的矛盾，或者一个系统为什么表面能运作，实际上却已经开始失去健康。","这使你很适合处理复杂问题。","但它也带来一个风险：不是每个问题都值得你深入到底。","因为当你真正进入一个问题以后，你容易把它当成必须理解、必须解决、必须完成的东西。长期来看，你需要的不是更强的洞察力，而是判断：","这个问题值得我用这么深的注意力吗？","月亮落在双子座第十二宫，则让你的内部世界比外表看起来更加活跃。你的情绪与适应不是单纯靠「感觉」，而是大量通过语言、比较、信息整理来完成。你可能在事情发生以后，脑中继续回放细节，试图理解每个环节。第十二宫使这个过程很大一部分发生在别人看不见的地方。","所以你有时不是不累，而是累得很安静。","真正的恢复对你来说，往往不是换一个活动继续做，而是需要一定程度的退出：少一点信息、少一点回应、少一点别人对你的要求，让内在重新获得整理空间。"]}],"en":[{"blockId":"CHAPTER-3","title":"Self, Expression, and Inner Regulation: You Need a Space of Real Depth","paragraphs":["The Sun and Mercury are both in Scorpio in the fifth house. The fifth house concerns creation, experimentation, expression, generative output, and the question of what you want to bring into visible form. With the Sun here, creative expression is not merely a hobby category; it can become closely tied to your sense of center and continuity. Mercury in the same area adds research, analysis, and depth of thought to the way you express yourself.","You may find it difficult to remain interested in expression that stays on the surface. For many people, an interest can remain an interest and a project can remain a project. For you, once a subject genuinely captures your attention, it can quickly move from “I would like to explore this” to “I need to understand it properly.”","That involvement may appear as research, writing, design, systems thinking, problem solving, or long-term creation. The form matters less than the fact that you need to feel that your understanding, judgment, and intention have truly entered the work.","The Sun–Mercury emphasis in Scorpio can also make you attentive to what has not been said directly. You may notice motives behind language, weaknesses inside structures, tension beneath relationships, or the reason a system continues to function on the surface even though something underneath it is beginning to fail.","That makes you well suited to complex problems.","But it also introduces a risk: not every problem deserves that level of depth.","Once you become genuinely involved, you can start treating the issue as something that must be understood, resolved, or completed. Over time, the question is not whether you can become more perceptive. It is whether you can decide:","Is this problem worth this much of my attention?","The Moon in Gemini in the twelfth house adds another layer. Your internal world may be more active than it appears from the outside. Emotional regulation is not only a matter of feeling; it can involve a great deal of language, comparison, mental processing, and information sorting. After something happens, your mind may continue replaying details and trying to understand the structure of what occurred.","Because this process takes place in the twelfth house, much of it may remain invisible to other people.","So there are times when you are not “fine” simply because you are quiet.","You may be tired in a very private way.","Real recovery is therefore unlikely to come from merely replacing one activity with another. You may need genuine withdrawal from input: fewer messages, fewer demands, less stimulation, and more space in which your internal system can reorganize itself."]}]},"sharedDiagrams":["AST-D08"],"profile":{"sectionId":"SEC-03","assetId":"VIS-REPORT-ASTROLOGY-SEC-03-SELF-EXPRESSION","assetPath":"assets/ast-vfr-r1/images/reports/astrology/editorial/shared/VIS-REPORT-ASTROLOGY-SEC-03-SELF-EXPRESSION.webp","assetDigest":"c2394dba58b4b6035f06b173d6c15a4ecda51cd23a7f29fdc082d283154d28ec","layoutVersion":"PHI-OS-AST-SECTION-MASTER-LAYOUT-v1.0.0","safeZone":{"x":65,"y":40,"width":305,"height":230},"anchor":{"xPercent":50,"yPercent":50},"centerAnchor":{"x":217.5,"y":155},"alignment":"CENTER","sectionNumberStyle":{"fontSize":19,"lineHeight":1.2},"zhTitleStyle":{"fontSize":30,"lineHeight":1.2},"enTitleStyle":{"fontSize":19,"lineHeight":1.2},"zhDescriptorStyle":{"fontSize":15,"lineHeight":1.4},"enDescriptorStyle":{"fontSize":13,"lineHeight":1.4},"spacing":{"number":5,"title":6,"descriptor":7,"rule":7},"maxLines":{"zhTitle":1,"enTitle":1,"zhDescriptor":1,"enDescriptor":2},"overflowPolicy":"FAIL_CLOSED","horizontalTolerance":4,"verticalTolerance":4,"protectedRegions":[{"x":170,"y":310,"width":460,"height":650},{"x":380,"y":0,"width":35,"height":270}],"text":{"number":"03","zhTitle":"自我与表达","enTitle":"Self & Expression","zhDescriptor":"表达、研究与内部调节","enDescriptor":"Expression, inquiry, and inner regulation"},"humanStatus":"HUMAN_REVIEW_PENDING","descriptors":["表达、研究与内部调节","Expression, inquiry, and inner regulation"]},"diagrams":[{"id":"AST-D08","hero":false,"html":"\u003cfigure class=\"figure\" data-diagram=\"AST-D08\">\u003ch3>内部调节与表达 \u003cspan>Inner Regulation & Expression\u003c/span>\u003c/h3>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 720\" role=\"img\" data-diagram=\"AST-D08\" aria-label=\"占星结构图\" style=\"font-family:Segoe UI Symbol,Microsoft YaHei,serif\">\u003ctitle>占星结构图\u003c/title>\u003ctext x=\"360\" y=\"38\" text-anchor=\"middle\" font-size=\"25\" fill=\"#193746\" >整盘入口 · 理解与行动\u003c/text>\u003ctext x=\"360\" y=\"102\" text-anchor=\"middle\" font-size=\"24\" fill=\"#193746\" >ASC 巨蟹\u003c/text>\u003cpath d=\"M360,177 Q392,199.5 360,292\" fill=\"none\" stroke=\"#768e98\" stroke-width=\"2.5\"/>\u003cpath d=\"M360,292 Q392,314.5 360,407\" fill=\"none\" stroke=\"#768e98\" stroke-width=\"2.5\"/>\u003cg class=\"ast-node\" data-body=\"MOON\">\u003ccircle cx=\"360\" cy=\"177\" r=\"32\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"360\" y=\"187\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">☽\u003c/text>\u003ctext x=\"360\" y=\"236\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >月亮\u003c/text>\u003c/g>\u003cg class=\"ast-node\" data-body=\"MERCURY\">\u003ccircle cx=\"360\" cy=\"292\" r=\"32\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"360\" y=\"302\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">☿\u003c/text>\u003ctext x=\"360\" y=\"351\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >水星\u003c/text>\u003c/g>\u003cg class=\"ast-node\" data-body=\"MARS\">\u003ccircle cx=\"360\" cy=\"407\" r=\"32\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"360\" y=\"417\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♂\u003c/text>\u003ctext x=\"360\" y=\"466\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >火星\u003c/text>\u003c/g>\u003cpath d=\"M360,469 Q210,457 210,492\" stroke=\"#768e98\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>\u003cg class=\"ast-node\" data-body=\"MARS\">\u003ccircle cx=\"210\" cy=\"532\" r=\"35\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"210\" y=\"542\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♂\u003c/text>\u003ctext x=\"210\" y=\"594\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >火星\u003c/text>\u003c/g>\u003ctext x=\"210\" y=\"617\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >最终守护 · 第4宫\u003c/text>\u003cpath d=\"M360,469 Q510,457 510,492\" stroke=\"#768e98\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>\u003cg class=\"ast-node\" data-body=\"SATURN\">\u003ccircle cx=\"510\" cy=\"532\" r=\"35\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"510\" y=\"542\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♄\u003c/text>\u003ctext x=\"510\" y=\"594\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >土星\u003c/text>\u003c/g>\u003ctext x=\"510\" y=\"617\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >最终守护 · 第6宫\u003c/text>\u003c/svg>\u003cfigcaption>感受、理解与行动的连接。\u003cbr>Connections between responsiveness, understanding and action.\u003c/figcaption>\u003cdiv class=\"legend\">☉ Sun · ☽ Moon · ☿ Mercury · ♀ Venus · ♂ Mars · ♃ Jupiter · ♄ Saturn · ♅ Uranus · ♆ Neptune · ♇ Pluto\u003c/div>\u003c/figure>"}],"insertions":{"AST-D01":["OPENING",0],"AST-D02":["CHAPTER-2",1],"AST-D06":["CHAPTER-4",1],"AST-D04":["CHAPTER-5",0],"AST-D05":["CHAPTER-4",0],"AST-D07":["CHAPTER-5",2],"AST-D08":["CHAPTER-3",1],"AST-D09":["CHAPTER-6",1],"AST-D10":["CHAPTER-7",1],"AST-D11":["CHAPTER-8",1],"AST-D12":["CHAPTER-9",1],"AST-D14":["CHAPTER-10",1],"AST-D15":["CHAPTER-12",3]}},{"sectionId":"SEC-04","title":"关系与互惠","englishTitle":"Relationships","assetId":"VIS-REPORT-ASTROLOGY-SEC-04-RELATIONSHIPS","modeLabel":"","localeBlocks":{"zhHans":[{"blockId":"CHAPTER-6","title":"六｜关系与互惠：真正的关系问题，是责任如何进入日常","paragraphs":["你的下降点位于摩羯座，因此在这张盘里，第七宫的一对一关系领域由土星主导。土星实际落在摩羯座第六宫，而且本身是最终守护星之一。也就是说，关系主题并不会只停留在「喜欢谁」「有没有感觉」上，而会很快进入现实：日常怎样安排、谁承担什么、时间怎么分配、双方如何维持关系的实际运行。","这非常重要，因为你的第七宫虽然没有大量行星直接占据，但第七宫守护星土星本身进入了一组非常密集的相位网络。","土星与金星合相，使关系中的价值与责任彼此靠得很近。你很难真正接受一种「只有感觉、不承担现实」的关系。","土星与海王星合相，则让责任与理想同时出现。你可能会在关系中很想理解别人，也可能对关系本身抱有某种更大的愿景。但这也容易出现一种情况：因为理解太多，所以承担也变多。","土星与木星对冲，又把扩张与限制放在两端。于是关系里经常不是简单的「我要不要在一起」，而是：","我们怎样既保有成长空间，又能够承担彼此？\n这段关系要扩张到什么程度？\n责任增加以后，原来的生活还能不能承受？","金星与木星也处于非常紧密的对分，使价值与扩张不断互相校准。很多时候，你会发现关系越重要，越需要讨论资源、时间、生活安排和真实责任。","这不是浪漫的反面。","对你而言，这反而是关系能不能真正成熟的条件。","你需要的关系很可能不是表面上最轻松的，而是能够把复杂现实说清楚，同时仍然保留价值与情感的人际结构。"]}],"en":[{"blockId":"CHAPTER-6","title":"Relationships and Reciprocity: The Real Question Is How Responsibility Enters Daily Life","paragraphs":["Your Descendant is in Capricorn, so the seventh-house field of one-to-one relationships is ruled by Saturn in the traditional system. Saturn itself is in Capricorn in the sixth house and is one of the chart’s final dispositors.","This means relationships are unlikely to remain only about attraction or emotional feeling. They tend to move quickly into practical questions: how daily life is organized, who carries what, how time is distributed, and whether both people are actually contributing to the structure of the relationship.","This matters because the seventh house is not heavily occupied by planets, but its ruler, Saturn, is deeply embedded in the chart’s tightest aspect network.","Saturn conjunct Venus brings value and responsibility close together. It can be difficult for you to take seriously a relationship that has feeling but no willingness to deal with reality.","Saturn conjunct Neptune brings responsibility and idealism together. You may genuinely want to understand another person and may hold a larger vision of what the relationship could become. But this can also create situations in which understanding expands faster than boundaries.","Saturn opposite Jupiter places expansion and limitation on opposite sides of the same structure. So relationship questions may not simply be “Do I want this?” but rather:","How can we grow without making the relationship impossible to carry?","How much expansion can this structure actually support?","If responsibilities increase, can the existing life still hold them?","Venus is also in very close opposition to Jupiter, which keeps value and expansion in constant dialogue. The more important a relationship becomes, the more likely it is that time, resources, responsibilities, and practical arrangements will eventually need to be discussed clearly.","That is not the opposite of romance.","For you, it may be one of the conditions that allows intimacy to mature.","The relationships that suit you best are unlikely to be those that remain permanently light and undefined. You may need relationships in which difficult realities can be spoken about clearly without losing warmth, value, or emotional meaning."]}]},"sharedDiagrams":["AST-D09"],"profile":{"sectionId":"SEC-04","assetId":"VIS-REPORT-ASTROLOGY-SEC-04-RELATIONSHIPS","assetPath":"assets/ast-vfr-r1/images/reports/astrology/editorial/shared/VIS-REPORT-ASTROLOGY-SEC-04-RELATIONSHIPS.webp","assetDigest":"ef51cf091a33a95a0a7c9b90ac56990f2f46b5d29839f74679c927da460c707e","layoutVersion":"PHI-OS-AST-SECTION-MASTER-LAYOUT-v1.0.0","safeZone":{"x":70,"y":900,"width":654,"height":150},"anchor":{"xPercent":50,"yPercent":50},"centerAnchor":{"x":397,"y":975},"alignment":"CENTER","sectionNumberStyle":{"fontSize":17,"lineHeight":1.2},"zhTitleStyle":{"fontSize":32,"lineHeight":1.2},"enTitleStyle":{"fontSize":20,"lineHeight":1.2},"zhDescriptorStyle":{"fontSize":14,"lineHeight":1.4},"enDescriptorStyle":{"fontSize":13,"lineHeight":1.4},"spacing":{"number":3,"title":4,"descriptor":5,"r "none\" stroke=\"#aa884f\" stroke-width=\"2.4\" data-aspect=\"ASPECT_18\"/>\u003cg class=\"ast-node\" data-body=\"VENUS\">\u003ccircle cx=\"183.26998152785328\" cy=\"227.5894389605636\" r=\"28\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"183.26998152785328\" y=\"237.5894389605636\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♀\u003c/text>\u003ctext x=\"183.26998152785328\" y=\"282.5894389605636\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >金星\u003c/text>\u003c/g>\u003ctext x=\"183.26998152785328\" y=\"187.5894389605636\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >0.47°\u003c/text>\u003cg class=\"ast-node\" data-body=\"MARS\">\u003ccircle cx=\"195.53866806648728\" cy=\"414.77342362763056\" r=\"28\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"195.53866806648728\" y=\"424.77342362763056\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♂\u003c/text>\u003ctext x=\"195.53866806648728\" y=\"469.77342362763056\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >火星\u003c/text>\u003c/g>\u003ctext x=\"195.53866806648728\" y=\"374.77342362763056\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >2.90°\u003c/text>\u003cg class=\"ast-node\" data-body=\"JUPITER\">\u003ccircle cx=\"359.99999999999994\" cy=\"505\" r=\"28\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"359.99999999999994\" y=\"515\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♃\u003c/text>\u003ctext x=\"359.99999999999994\" y=\"560\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >木星\u003c/text>\u003c/g>\u003ctext x=\"414.99999999999994\" y=\"465\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >0.20°\u003c/text>\u003cg class=\"ast-node\" data-body=\"URANUS\">\u003ccircle cx=\"524.4613319335126\" cy=\"414.77342362763073\" r=\"28\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width= 0",1],"AST-D15":["CHAPTER-12",3]}},{"sectionId":"SEC-05","title":"工作与公共方向","englishTitle":"Career","assetId":"VIS-REPORT-ASTROLOGY-SEC-05-CAREER","modeLabel":"","localeBlocks":{"zhHans":[{"blockId":"CHAPTER-7","title":"七｜工作、责任与公共方向：白羊中天，火星落第四宫","paragraphs":["你的天顶位于白羊座。在本命盘中，天顶描述的是公共方向、可见贡献以及你如何在外部世界建立角色。白羊的方向性偏向启动、开路、率先进入，而你的第十宫守护星火星实际落在天蝎座第四宫。","这让你的职业结构很有特色。","表面上，白羊中天需要主动性。你很难永远只做别人已经完全定义好的事情。即使在组织里，你最终也容易希望拥有某一块真正属于自己的判断权。","但火星落第四宫，说明公共方向的推动力并不是单纯来自外在竞争，而很大程度上连接到更深层的基础、私域、安全与内部锚定。","换句话说，你真正能够长期做大的事情，往往需要一个稳固的内部基地。","这个基地可以是家庭，也可以是工作方式、个人空间、自己的系统、自己的团队，甚至是一套你真正信任的操作逻辑。","如果外在事业不断扩张，但内部基础越来越混乱，你很难长期维持。","火星在天蝎又使你的职业推动方式偏向深挖和重构。你未必最适合那种每天只快速处理表面问题的环境。你更容易在需要判断、研究、修复结构、解决复杂问题、处理敏感信息或建立长期系统的工作中发挥能力。","火星与木星形成三分，与金星、土星、海王星形成六合。这些相位提供了一组非常实用的支持通道：行动并不是孤立的，它可以和扩张、价值、责任与理想形成协调。","因此，你的职业能力很可能不只是「想法多」，而是能把复杂目标逐渐变成结构。","真正需要留意的，是责任膨胀。","因为你一旦证明自己能处理复杂问题，环境很容易越来越习惯把复杂问题交给你。","所以职业发展的关键不是：","我还能不能做更多？","而是：","我真正应该长期承担的是哪些。"]}],"en":[{"blockId":"CHAPTER-7","title":"Work, Responsibility, and Public Direction: Aries Midheaven, Mars in the Fourth House","paragraphs":["Your Midheaven is in Aries. In the natal chart, the Midheaven describes public direction, visible contribution, and the way a person establishes a role in the outer world. Aries brings an initiating quality to this part of the chart.","The ruler of your tenth house is Mars, and Mars is placed in Scorpio in the fourth house.","This creates an interesting professional structure.","On the surface, an Aries Midheaven needs initiative. You are unlikely to be satisfied forever in a role where every important decision has already been defined by someone else. Even inside an organization, you may eventually need a domain in which your own judgment genuinely matters.","But Mars in the fourth house suggests that your outward direction depends heavily on the strength of your internal foundation. Your public life is not driven only by external competition. It is connected to deeper issues of stability, privacy, security, and internal anchoring.","In other words, the things you can build most successfully over time often require a strong internal base.","That base could be family, but it could also be a way of working, personal space, your own system, a trusted team, or an operating structure that you know you can rely on.","If your external career keeps expanding while your internal foundation becomes increasingly unstable, it will be difficult to sustain the growth indefinitely.","Mars in Scorpio also gives your work style a deep, investigative quality. You may be less suited to environments that demand only quick surface-level reactions and more suited to situations that require judgment, research, structural repair, complex problem solving, sensitive information, or long-term system building.","Mars forms a trine to Jupiter and sextiles to Venus, Saturn, and Neptune. These aspects create useful channels between action and expansion, value, responsibility, and imagination.","This suggests that your professional strength may lie not simply in having ideas, but in being able to turn complex intentions into workable structure.","The caution is that responsibility can expand around competence.","Once you demonstrate that you can handle complicated problems, other people may increasingly assume that you will continue to handle them.","So the long-term career question is not:","Can I do more?","It is:","Which responsibilities are actually worth carrying for the long term?"]}]},"sharedDiagrams":["AST-D10"],"profile":{"sectionId":"SEC-05","assetId":"VIS-REPORT-ASTROLOGY-SEC-05-CAREER","assetPath":"assets/ast-vfr-r1/images/reports/astrology/editorial/shared/VIS-REPORT-ASTROLOGY-SEC-05-CAREER.webp","assetDigest":"fc6af62b85d9af9ef26b38823fbd8a20f36b29e9079cfdd9aaaab15b9d40456d","layoutVersion":"PHI-OS-AST-SECTION-MASTER-LAYOUT-v1.0.0","safeZone":{"x":55,"y":35,"width":310,"height":235},"anchor":{"xPercent":50,"yPercent":50},"centerAnchor":{"x":210,"y":152.5},"alignment":"CENTER","sectionNumb \"465\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >2.90°\u003c/text>\u003cg class=\"ast-node\" data-body=\"NEPTUNE\">\u003ccircle cx=\"524.4613319335126\" cy=\"414.77342362763073\" r=\"28\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"524.4613319335126\" y=\"424.77342362763073\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♆\u003c/text>\u003ctext x=\"524.4613319335126\" y=\"469.77342362763073\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >海王星\u003c/text>\u003c/g>\u003ctext x=\"524.4613319335126\" y=\"374.77342362763073\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >2.76°\u003c/text>\u003cg class=\"ast-node\" data-body=\"PLUTO\">\u003ccircle cx=\"536.7300184721468\" cy=\"227.5894389605636\" r=\"28\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"536.7300184721468\" y=\"237.5894389605636\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♇\u003c/text>\u003ctext x=\"536.7300184721468\" y=\"282.5894389605636\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >冥王星\u003c/text>\u003c/g>\u003ctext x=\"536.7300184721468\" y=\"187.5894389605636\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >7.78°\u003c/text>\u003cg class=\"ast-node\" data-body=\"MARS\">\u003ccircle cx=\"360\" cy=\"310\" r=\"45\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"360\" y=\"320\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♂\u003c/text>\u003ctext x=\"360\" y=\"382\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >火星\u003c/text>\u003c/g>\u003c/svg>\u003cfigcaption>白羊中天；火星在天蝎第四宫。\u003cbr>Aries Midheaven; Mars in Scorpio in house 4.\u003c/figcaption>\u003cdiv class=\"legend\">☉ Sun · ☽ Moon · ☿ Mercury · ♀ Venus · ♂ Mars · ♃ Jupiter · ♄ Saturn · ♅ Uranus · ♆ Neptune · ♇ Pluto\u003c/div>\u003c/figure>"}],"insertions":{"AST-D01":["OPENING",0],"AST-D02":["CHAPTER-2",1],"AST-D06":["CHAPTER-4",1],"AST-D04":["CHAPTER-5",0],"AST-D05":["CHAPTER-4",0],"AST-D07":["CHAPTER-5",2],"AST-D08":["CHAPTER-3",1],"AST-D09":["CHAPTER-6",1],"AST-D10":["CHAPTER-7",1],"AST-D11":["CHAPTER-8",1],"AST-D12":["CHAPTER-9",1],"AST-D14":["CHAPTER-10",1],"AST-D15":["CHAPTER-12",3]}},{"sectionId":"SEC-06","title":"资源与价值","englishTitle":"Resources & Values","assetId":"VIS-REPORT-ASTROLOGY-SEC-06-RESOURCES-VALUES","modeLabel":"","localeBlocks":{"zhHans":[{"blockId":"CHAPTER-8","title":"八｜资源、安全与共享依赖：个人价值与共同结构","paragraphs":["你的第二宫宫头落在狮子座，由太阳守护；太阳实际位于天蝎座第五宫。因此，个人资源与「我真正创造什么、表达什么、形成什么」之间存在直接连接。你对资源的理解，很可能不仅是拥有多少，而是：我有没有足够的基础，让自己可以持续创造、选择和决定。","太阳与水星合相，使资源判断很容易进入思考、策略和长期规划；太阳与冥王星也在合相范围内，则使你对资源结构的变化较为敏感。","当你真正发现旧的资源结构不再适合时，可能不会满足于做一点小调整，而是会重新思考整个分配方式。","第八宫宫头落在水瓶座，在当前传统守护体系里由土星守护；土星实际位于摩羯座第六宫。于是共享资源、共同责任、长期依赖与现实维护之间又建立了连接。","这使「我的资源」和「我们的结构」之间成为一个非常重要的长期议题。","无论是亲密关系、家庭、商业合作还是共同资产，你都比较需要清楚地知道：","谁负责什么？\n什么是共同的？\n什么仍然属于个人？\n如果条件改变，谁承担后果？","对你而言，讲清楚这些问题并不是冷漠。","相反，它是一种保护信任的方式。","因为当边界模糊时，你很容易进入过度承担。"]}],"en":[{"blockId":"CHAPTER-8","title":"Resources, Security, and Shared Dependency: Personal Value and Shared Structure","paragraphs":["The cusp of your second house is in Leo, ruled by the Sun. The Sun itself is in Scorpio in the fifth house. This creates a direct connection between personal resources and the things you create, express, develop, or bring into visible form.","For you, resources may not be only about how much you possess. They may also be about whether you have enough stability to keep creating, choosing, and directing your own life.","The Sun is conjunct Mercury, which can bring thinking, strategy, planning, and analysis into resource decisions. The Sun is also within conjunction range of Pluto, which can make structural changes around resources feel significant rather than superficial.","When an old resource structure no longer works, you may not be satisfied with minor adjustments. You may eventually want to rethink the entire arrangement.","The cusp of your eighth house is in Aquarius. Under the traditional rulership system used here, Aquarius is ruled by Saturn. Saturn is in Capricorn in the sixth house.","This links shared resources, long-term dependency, and mutual responsibility directly to practical maintenance and daily reality.","As a result, “my resources” and “our structure” can become an important life theme.","Whether the situation involves an intimate relationship, family, business partnership, or shared assets, you are likely to need clarity around questions such as:","Who is responsible for what?","What is genuinely shared?","What remains individual?","If circumstances change, who carries the consequences?","For you, asking these questions is not necessarily cold.","It can be a way of protecting trust.","Because when boundaries become vague, you can end up carrying more than you originally intended."]}]},"sharedDiagrams":["AST-D11"],"profile":{"sectionId":"SEC-06","assetId":"VIS-REPORT-ASTROLOGY-SEC-06-RESOURCES-VALUES","assetPath":"assets/ast-vfr-r1/images/reports/astrology/editorial/shared/VIS-REPORT-ASTROLOGY-SEC-06-RESOURCES-VALUES.webp","assetDigest":"0cb8321126d4eb0b1c3044314f0794346d931a46e58d656492d5d18765499b97","layoutVersion":"PHI-OS-AST-SECTION-MASTER-LAYOUT-v1.0.0","safeZone":{"x":70,"y":35,"width":654,"height":210},"anchor":{"xPercent":50,"yPercent":50},"centerAnchor":{"x":397,"y":140},"alignment":"CENTER","sectionNumberStyle":{"fontSize":19,"lineHeight":1.2},"zhTitleStyle":{"fontSize":34,"lineHeight":1.2},"enTitleStyle":{"fontSize":21,"lineHeight":1.2},"zhDescriptorStyle":{"fontSize":15,"lineHeight":1.4},"enDescriptorStyle":{"fontSize":14,"lineHeight":1.4},"spacing":{"number":5,"title":6,"descriptor":7,"rule":7},"maxLines":{"zhTitle":1,"enTitle":1,"zhDescriptor":1,"enDescriptor":1},"overflowPolicy":"FAIL_CLOSED","horizontalTolerance":4,"verticalTolerance":4,"protectedRegions":[{"x":190,"y":400,"width":460,"height":470}],"text":{"number":"06","zhTitle":"资源与价值","enTitle":"Resources & Va =\"642.9541050640494\" y=\"393.77434986839353\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♅\u003c/text>\u003ctext x=\"642.9541050640494\" y=\"433.77434986839353\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >天王星\u003c/text>\u003c/g>\u003ctext x=\"642.9541050640494\" y=\"343.77434986839353\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >7.45°\u003c/text>\u003cg class=\"ast-node\" data-body=\"NEPTUNE\">\u003ccircle cx=\"651.0073967406912\" cy=\"260.90486249719044\" r=\"23\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"651.0073967406912\" y=\"270.90486249719044\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♆\u003c/text>\u003ctext x=\"651.0073967406912\" y=\"310.90486249719044\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >海王星\u003c/text>\u003c/g>\u003ctext x=\"651.0073967406912\" y=\"220.90486249719044\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >0.14°\u003c/text>\u003cg class=\"ast-node\" data-body=\"SATURN\">\u003ccircle cx=\"535\" cy=\"315\" r=\"45\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"535\" y=\"325\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♄\u003c/text>\u003ctext x=\"535\" y=\"387\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >土星\u003c/text>\u003c/g>\u003cpath d=\"M360,145 V560\" stroke=\"#768e98\" opacity=\".4\" stroke-width=\"1.8\"/>\u003c/svg>\u003cfigcaption>第二宫与第八宫的资源路径。\u003cbr>Resource routes of houses 2 and 8.\u003c/figcaption>\u003cdiv class=\"legend\">☉ Sun · ☽ Moon · ☿ Mercury · ♀ Venus · ♂ Mars · ♃ Jupiter · ♄ Saturn · ♅ Uranus · ♆ Neptune · ♇ Pluto\u003c/div>\u003c/figure>"}],"insertions":{"AST-D01":["OPENING",0],"AST-D02":["CHAPTER-2",1],"AST-D06":["CHAPTER-4",1],"AST-D04":["CHAPTER-5",0],"AST-D05":["CHAPTER-4",0],"AST-D07":["CHAPTER-5",2],"AST-D08":["CHAPTER-3",1],"AST-D09":["CHAPTER-6",1],"AST-D10":["CHAPTER-7",1],"AST-D11":["CHAPTER-8",1],"AST-D12":["CHAPTER-9",1],"AST-D14":["CHAPTER-10",1],"AST-D15":["CHAPTER-12",3]}},{"sectionId":"SEC-07","title":"压力与适应","englishTitle":"Pressure & Adaptation","assetId":"VIS-REPORT-ASTROLOGY-SEC-07-TIMING-CHANGE","modeLabel":"变化以结构发展来理解；本报告未加入事件时间推演。","localeBlocks":{"zhHans":[{"blockId":"CHAPTER-9","title":"九｜压力与适应：最大的张力在扩张、责任与边界之间","paragraphs":["你命盘中最紧密的张力相位，主要集中在木星与第六宫摩羯群星之间。","木星对冲海王星约 0.06°，对冲土星约 0.20°，金星对冲木星约 0.27°。这些都是非常紧密的对分，因此「扩张」与「限制」、「理想」与「现实」、「价值」与「范围」之间的拉扯，会比一般相位更值得被认真看见。","木星在第十二宫，希望扩大内部空间、理解更大背景、容纳复杂性。","土星在第六宫却要求事情能落到日常、时间、制度和具体责任。","所以你可能经常遇到类似的问题：","我知道事情为什么复杂，但现实上到底怎么做？","我理解别人有困难，可是这份责任要由谁承担？","我想给事情更多空间，可是我的时间和精力还有多少？","我愿意相信某种可能，但它有没有真正进入现实？","海王星参与其中，使边界变得更加重要。很多时候，压力并不是来自明显冲突，而是来自慢慢增加的模糊责任。","而金星也参与对分，则表示价值判断会不断被卷进来。","你并不是只在管理工作量。","你还在问：","这件事到底值不值得。","真正的适应，不是把所有张力消除，而是让每一类问题回到它本来的位置。","有些问题是价值问题。","有些是资源问题。","有些是责任问题。","有些只是别人没有承担。","一旦这些被混成一个整体，你会很累。"]}],"en":[{"blockId":"CHAPTER-9","title":"Pressure and Adaptation: Expansion, Responsibility, and Boundaries","paragraphs":["The tightest tension aspects in your chart are concentrated between Jupiter and the Capricorn planets in the sixth house.","Jupiter opposes Neptune by about 0.06°, Saturn by about 0.20°, and Venus by about 0.27°. These are very close oppositions, so the pull between expansion and limitation, ideal and reality, value and scale deserves serious attention.","Jupiter in the twelfth house wants broader perspective, contextual understanding, space, and inner integration.","Saturn in the sixth insists that things must still fit into time, routines, systems, and concrete responsibility.","So you may repeatedly encounter questions such as:","I understand why this is complicated, but what actually needs to be done?","I understand that someone else is struggling, but whose responsibility is this?","I want to leave more room for possibility, but how much time and energy do I really have?","I want to believe in what this could become, but has it actually entered reality?","Neptune’s involvement makes boundaries especially important. Pressure may not always come from obvious conflict. It can build through slowly accumulating ambiguity.","Venus is also involved, which means value judgments are continually drawn into the tension.","You are not only managing workload.","You are also asking:","Is this actually worth it?","Adaptation, then, is not about eliminating every form of tension. It is about returning each problem to the category where it belongs.","Some problems are about value.","Some are about resources.","Some are about responsibility.","And some exist because someone else has not taken responsibility at all.","When all of these become mixed together, the result can be exhaustion."]}]},"sharedDiagrams":["AST-D12"],"profile":{"sectionId":"SEC-07","assetId":"VIS-REPORT-ASTROLOGY-SEC-07-TIMING-CHANGE","assetPath":"assets/ast-vfr-r1/images/reports/astrology/editorial/shared/VIS-REPORT-ASTROLOGY-SEC-07-TIMING-CHANGE.webp","assetDigest":"6bf0013a1ae4a7a92d4e743dcfa9f2d3a206c827926723014d8f6620bd959db3","layoutVersion":"PHI-OS-AST-SECTION-MASTER-LAYOUT-v1.0.0","safeZone":{"x":70,"y":900,"width":654,"height":150},"anchor":{"xPercent":50,"yPercent":50},"centerAnchor":{"x":397,"y":975},"alignment":"CENTER","sectionNumberStyle":{"fontSize":17,"lineHeight":1.2},"zhTitleStyle":{"fontSize":32,"lineHeight":1.2},"enTitleStyle":{"fontSize":20,"lineHeight":1.2},"zhDescriptorStyle":{"fontSize":14,"lineHeight":1.4},"enDescriptorStyle":{"fontSize":13,"lineHeight":1.4},"spacing":{"number":3,"title":4,"descriptor":5,"rule":5},"maxLines":{"zhTitle":1,"enTitle":1,"zhDescriptor":1,"enDescriptor":1},"overflowPolicy":"FAIL_CLOSED","horizontalTolerance":4,"verticalTolerance":4,"protectedRegions":[{"x":170,"y":280,"width":460,"height":555},{"x":375,"y":805,"width":44,"height":90}],"text":{"number":"07","zhTitle":"压力与适应","enTitle":"Pressure & Adaptation","zhDescriptor":"压力、恢复与边界","enDescriptor":"Pressure, recovery, and boundaries"},"humanStatus":" a-body=\"SATURN\">\u003ccircle cx=\"115\" cy=\"275\" r=\"26\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"115\" y=\"285\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♄\u003c/text>\u003ctext x=\"115\" y=\"328\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >土星\u003c/text>\u003c/g>\u003cg class=\"ast-node\" data-body=\"URANUS\">\u003ccircle cx=\"190\" cy=\"350\" r=\"26\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"190\" y=\"360\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♅\u003c/text>\u003ctext x=\"190\" y=\"403\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >天王星\u003c/text>\u003c/g>\u003cg class=\"ast-node\" data-body=\"NEPTUNE\">\u003ccircle cx=\"265\" cy=\"275\" r=\"26\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"265\" y=\"285\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♆\u003c/text>\u003ctext x=\"265\" y=\"328\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >海王星\u003c/text>\u003c/g>\u003cg class=\"ast-node\" data-body=\"MOON\">\u003ccircle cx=\"530\" cy=\"200\" r=\"26\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"530\" y=\"210\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">☽\u003c/text>\u003ctext x=\"530\" y=\"253\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >月亮\u003c/text>\u003c/g>\u003cg class=\"ast-node\" data-body=\"JUPITER\">\u003ccircle cx=\"530\" cy=\"350\" r=\"26\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"530\" y=\"360\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♃\u003c/text>\u003ctext x=\"530\" y=\"403\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >木星\u003c/text>\u003c/g>\u003cg class=\"ast-node\" data-body=\"MARS\">\u003ccircle cx=\"250\" cy=\"540\" r=\"26\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"250\" y=\"550\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♂\u003c/text>\u003ctext x=\"250\" y=\"593\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >火星\u003c/text>\u003c/g>\u003ctext x=\"360\" y=\"640\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >青色连接：实际支持桥梁\u003c/text>\u003c/svg>\u003cfigcaption>结构性压力与适应；不包含时间预测。\u003cbr>Structural pressure and adaptation; no timing forecast.\u003c/figcaption>\u003cdiv class=\"legend\">☉ Sun · ☽ Moon · ☿ Mercury · ♀ Venus · ♂ Mars · ♃ Jupiter · ♄ Saturn · ♅ Uranus · ♆ Neptune · ♇ Pluto\u003c/div>\u003c/figure>"}],"insertions":{"AST-D01":["OPENING",0],"AST-D02":["CHAPTER-2",1],"AST-D06":["CHAPTER-4",1],"AST-D04":["CHAPTER-5",0],"AST-D05":["CHAPTER-4",0],"AST-D07":["CHAPTER-5",2],"AST-D08":["CHAPTER-3",1],"AST-D09":["CHAPTER-6",1],"AST-D10":["CHAPTER-7",1],"AST-D11":["CHAPTER-8",1],"AST-D12":["CHAPTER-9",1],"AST-D14":["CHAPTER-10",1],"AST-D15":["CHAPTER-12",3]}},{"sectionId":"SEC-08","title":"结构整合","englishTitle":"Structural Integration","assetId":"VIS-REPORT-ASTROLOGY-SEC-08-REALITY-COMPARISON","modeLabel":"以长期发展作结构整合；没有提供当前生活资料。","localeBlocks":{"zhHans":[{"blockId":"CHAPTER-11","title":"十一｜长期发展：从“我能承担”走向“我选择承担”","paragraphs":["你的盘中，火星与土星分别成为两条主要守护链的终点。","这是一种很强的组合。","火星让你可以行动。","土星让你可以长期承担。","这两种能力结合以后，会使你成为一个很能把复杂事情做到底的人。","但长期发展真正重要的，并不是让这两种能力越来越强。","而是让它们越来越有选择。","早期的人生很容易是：","我能做，所以我来做。\n我看得懂，所以我来处理。\n我可以承受，所以我继续。","但随着经验增加，你真正需要形成的是：","这件事情值不值得我做。\n这份责任是不是我的。\n这个结构值得我维持多久。\n我有没有因为能力强，而承担了太多不属于自己的东西。","这也是为什么你后期的人生质量，很可能与「筛选」能力有很大关系。","不是所有复杂问题都需要你解决。","不是所有关系都需要你理解到底。","不是所有责任都因为你做得到，就应该继续由你承担。","你的盘真正成熟以后，火星不再只是执行，土星也不再只是忍耐。","它们会成为：","有边界的行动，和有选择的承担。"]}],"en":[{"blockId":"CHAPTER-11","title":"Long-Term Development: From “I Can Carry It” to “I Choose to Carry It”","paragraphs":["Mars and Saturn are the two major terminal points in your chart’s dispositor structure.","This is a strong combination.","Mars gives you the ability to act.","Saturn gives you the ability to endure and sustain responsibility.","Together, they can make you someone who is capable of carrying complex matters through to completion.","But long-term development is not about making these capacities endlessly stronger.","It is about making them more selective.","Earlier in life, the pattern can easily become:","I can do it, so I will.","I understand it, so I will handle it.","I can endure it, so I will continue.","With experience, the more important questions become:","Is this worth doing?","Is this responsibility actually mine?","How long is this structure worth maintaining?","Am I carrying too much simply because I am capable?","This is why the quality of your later life may depend less on how much you can manage and more on how carefully you choose what deserves your strength.","Not every complex problem requires your intervention.","Not every relationship needs to be understood all the way to the bottom.","Not every responsibility should remain yours merely because you can carry it.","As the chart matures, Mars becomes more than execution, and Saturn becomes more than endurance.","Together they can become:","Action with boundaries, and responsibility by choice."]}]},"sharedDiagrams":[],"profile":{"sectionId":"SEC-08","assetId":"VIS-REPORT-ASTROLOGY-SEC-08-REALITY-COMPARISON","assetPath":"assets/ast-vfr-r1/images/reports/astrology/editorial/shared/VIS-REPORT-ASTROLOGY-SEC-08-REALITY-COMPARISON.webp","assetDigest":"54227155da278fb85709cba1ab393be6eb374b12f86f60acfe2fe859cdbd7229","layoutVersion":"PHI-OS-AST-SECTION-MASTER-LAYOUT-v1.0.0","safeZone":{"x":60,"y":25,"width":310,"height":235},"anchor":{"xPercent":50,"yPercent":50},"centerAnchor":{"x":215,"y":142.5},"alignment":"CENTER","sectionNumberStyle":{"fontSize":19,"lineHeight":1.2},"zhTitleStyle":{"fontSize":30,"lineHeight":1.2},"enTitleStyle":{"fontSize":19,"lineHeight":1.2},"zhDescriptorStyle":{"fontSize":15,"lineHeight":1.4},"enDescriptorStyle":{"fontSize":13,"lineHeight":1.4},"spacing":{"number":5,"title":6,"descriptor":7,"rule":7},"maxLines":{"zhTitle":1,"enTitle":1,"zhDescriptor":1,"enDescriptor":2},"overflowPolicy":"FAIL_CLOSED","horizontalTolerance":4,"verticalTolerance":4,"protectedRegions":[{"x":120,"y":330,"width":560,"height":550},{"x":380,"y":0,"width":35,"height":270}],"text":{"number":"08","zhTitle":"结构整合","enTitle":"Structural Integration","zhDescriptor":"从能力走向选择","enDescriptor":"From capacity to choice"},"humanStatus":"HUMAN_REVIEW_PENDING","descriptors":["从能力走向选择","From capacity to choice"]},"diagrams":[],"insertions":{"AST-D01":["OPENING",0],"AST-D02":["CHAPTER-2",1],"AST-D06":["CHAPTER-4",1],"AST-D04":["CHAPTER-5",0],"AST-D05":["CHAPTER-4",0],"AST-D07":["CHAPTER-5",2],"AST-D08":["CHAPTER-3",1],"AST-D09":["CHAPTER-6",1],"AST-D10":["CHAPTER-7",1],"AST-D11":["CHAPTER-8",1],"AST-D12":["CHAPTER-9",1],"AST-D14":["CHAPTER-10",1],"AST-D15":["CHAPTER-12",3]}},{"sectionId":"SEC-09","title":"机会导航","englishTitle":"Opportunity Navigation","assetId":"VIS-REPORT-ASTROLOGY-SEC-09-OPPORTUNITY-NAVIGATION","modeLabel":"","localeBlocks":{"zhHans":[{"blockId":"CHAPTER-10","title":"十｜支持性流动：行动是你重要的整合通道","paragraphs":["你的盘虽然有非常强的第六宫—第十二宫张力，但火星建立了几条很有价值的支持相位。","火星三分木星，火星六合金星，火星六合海王星，这些都说明当你能够把抽象、复杂或情绪性的东西转成具体行动时，许多原本卡住的问题会开始变得可以处理。","这也是你的一个重要优势。","你并不只是擅长理解问题。","你也能够把理解转成动作。","但这里的关键是：行动必须建立在真正看清之后。","如果行动太早，可能变成替别人解决问题。","如果行动太晚，则可能累积到不得不一次性大改。","最成熟的状态，是当你已经辨认出核心结构以后，尽早采取足够具体的行动。","火星位于天蝎座第四宫，也使这些行动常常从「内部结构」开始。","你可能不是先改变外面，而是先改变自己的边界、生活方式、基础、时间安排、家庭结构或者工作底层逻辑。","外部结果往往只是后面才出现。"]}],"en":[{"blockId":"CHAPTER-10","title":"Supportive Flow: Action as an Important Route of Integration","paragraphs":["Although the chart contains a strong sixth–twelfth house tension, Mars forms several valuable supportive aspects.","Mars trines Jupiter, sextiles Venus, and sextiles Neptune. These relationships suggest that when you are able to turn something abstract, complex, or emotionally charged into a concrete action, many problems begin to become more manageable.","This is one of your important strengths.","You are not only capable of understanding a problem.","You can also convert understanding into movement.","The key is timing the action well.","If you act too early, you may find yourself solving problems that actually belong to someone else.","If you act too late, pressure can accumulate until a much larger change becomes necessary.","The most effective state is often one in which you have already identified the real structure of the problem and then act before the burden becomes excessive.","Mars in Scorpio in the fourth house also suggests that many important changes begin internally.","You may not always change the external world first. You may first change your boundary, your daily structure, your foundation, your schedule, your private environment, or the operating logic beneath your work.","The visible result may come later."]}]},"sharedDiagrams":["AST-D14"],"profile":{"sectionId":"SEC-09","assetId":"VIS-REPORT-ASTROLOGY-SEC-09-OPPORTUNITY-NAVIGATION","assetPath":"assets/ast-vfr-r1/images/reports/astrology/editorial/shared/VIS-REPORT-ASTROLOGY-SEC-09-OPPORTUNITY-NAVIGATION.webp","assetDigest":"53e3028ad21b6d63e2e4eca0d8ded7b8bab06bdd0f7a092dcd51ba72b73d6f78","layoutVersion":"PHI-OS-AST-SECTION-MASTER-LAYOUT-v1.0.0","safeZone":{"x":70,"y":45,"width":654,"height":220},"anchor":{"xPercent":50,"yPercent":50},"centerAnchor":{"x":397,"y":155},"alignment":"CENTER","sectionNumberStyle":{"fontSize":19,"lineHeight":1.2},"zhTitleStyle":{"fontSize":34,"lineHeight":1.2},"enTitleStyle":{"fontSize":21,"lineHeight":1.2},"zhDescriptorStyle":{"fontSize":15,"lineHeight":1.4},"enDescriptorStyle":{"fontSize":14,"lineHeight":1.4},"spacing":{"number":5,"title":6,"descriptor":7,"rule":7},"maxLines":{"zhTitle":1,"enTitle":1,"zhDescriptor":1,"enDescriptor":1},"overflowPolicy":"FAIL_CLOSED","horizontalTolerance":4,"verticalTolerance":4,"protectedRegions":[{"x":200,"y":680,"width":420,"height":360}],"text":{"number":"09","zhTitle":"机会导航","enTitle":"Opportunity Navigation","zhDescriptor":"行动与支持性连接","enDescriptor":"Action and supportive connections"},"humanStatus":"HUMAN_REVIEW_PENDING","descriptors":["行动与支持性连接","Action and supportive connections"]},"diagrams":[{"id":"AST-D14","hero":false,"html":"\u003cfigure class=\"figure\" data-diagram=\"AST-D14\">\u003ch3>支持性行动路径 \u003cspan>Supportive Action Routes\u003c/span>\u003c/h3>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 720\" role=\"img\" data-diagram=\"AST-D14\" aria-label=\"占星结构图\" style=\"font-family:Segoe UI Symbol,Microsoft YaHei,serif\">\u003ctitle>占星结构图\u003c/title>\u003ctext x=\"360\" y=\"38\" text-anchor=\"middle\" font-size=\"25\" fill=\"#193746\" >行动 · 支持路径\u003c/text>\u003cpath d=\"M360,285 Q392,165 360,115\" fill=\"none\" stroke=\"#468384\" stroke-width=\"2.8\"/>\u003cpath d=\"M360,285 Q318.38784067832273,292.5 212.77568135664544,370\" fill=\"none\" stroke=\"#468384\" stroke-width=\"2.8\"/>\u003cpath d=\"M360,285 Q465.61215932167727,292.5 507.22431864335454,370.00000000000006\" fill=\"none\" stroke=\"#468384\" stroke-width=\"2.8\"/>\u003cpath d=\"M360,285 Q279.5,380 135,545\" fill=\"none\" stroke=\"#768e98\" stroke-width=\"1.8\"/>\u003ctext x=\"135\" y=\"535\" text-anchor=\"middle\" font-size=\"20\" fill=\"#193746\" >公共方向\u003c/text>\u003ctext x=\"135\" y=\"573\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >火星 · 第4宫\u003c/text>\u003cpath d=\"M360,285 Q392,380 360,545\" fill=\"none\" stroke=\"#768e98\" stroke-width=\"1.8\"/>\u003ctext x=\"360\" y=\"535\" text-anchor=\"middle\" font-size=\"20\" fill=\"#193746\" >个人资源\u003c/text>\u003ctext x=\"360\" y=\"573\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >太阳 · 第5宫\u003c/text>\u003cpath d=\"M360,285 Q504.5,380 585,545\" fill=\"none\" stroke=\"#768e98\" stroke-width=\"1.8\"/>\u003ctext x=\"585\" y=\"535\" text-anchor=\"middle\" font-size=\"20\" fill=\"#193746\" >共享资源\u003c/text>\u003ctext x=\"585\" y=\"573\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >土星 · 第6宫\u003c/text>\u003cg class=\"ast-node\" data-body=\"JUPITER\">\u003ccircle cx=\"360\" cy=\"115\" r=\"31\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"360\" y=\"125\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♃\u003c/text>\u003ctext x=\"360\" y=\"173\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >木星\u003c/text>\u003c/g>\u003cg class=\"ast-node\" data-body=\"VENUS\">\u003ccircle cx=\"212.77568135664544\" cy=\"370\" r=\"31\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"212.77568135664544\" y=\"380\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♀\u003c/text>\u003ctext x=\"212.77568135664544\" y=\"428\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >金星\u003c/text>\u003c/g>\u003cg class=\"ast-node\" data-body=\"NEPTUNE\">\u003ccircle cx=\"507.22431864335454\" cy=\"370.00000000000006\" r=\"31\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"507.22431864335454\" y=\"380.00000000000006\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♆\u003c/text>\u003ctext x=\"507.22431864335454\" y=\"428.00000000000006\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >海王星\u003c/text>\u003c/g>\u003cg class=\"ast-node\" data-body=\"MARS\">\u003ccircle cx=\"360\" cy=\"285\" r=\"49\" fill=\"#FFFFFF\" stroke=\"#98733c\" stroke-width=\"2\"/>\u003ctext x=\"360\" y=\"295\" text-anchor=\"middle\" font-size=\"30\" fill=\"#193746\" class=\"ast-glyph\">♂\u003c/text>\u003ctext x=\"360\" y=\"361\" text-anchor=\"middle\" font-size=\"19\" fill=\"#193746\" >火星\u003c/text>\u003c/g>\u003ctext x=\"360\" y=\"659\" text-anchor=\"middle\" font-size=\"18\" fill=\"#193746\" >路径用于导航，不保证现实结果。\u003c/text>\u003c/svg>\u003cfigcaption>现有支持性连接；不预测未来事件。\u003cbr>Existing supportive connections; no future-event prediction.\u003c/figcaption>\u003cdiv class=\"legend\">☉ Sun · ☽ Moon · ☿ Mercury · ♀ Venus · ♂ Mars · ♃ Jupiter · ♄ Saturn · ♅ Uranus · ♆ Neptune · ♇ Pluto\u003c/div>\u003c/figure>"}],"insertions":{"AST-D01":["OPENING",0],"AST-D02":["CHAPTER-2",1],"AST-D06":["CHAPTER-4",1],"AST-D04":["CHAPTER-5",0],"AST-D05":["CHAPTER-4",0],"AST-D07":["CHAPTER-5",2],"AST-D08":["CHAPTER-3",1],"AST-D09":["CHAPTER-6",1],"AST-D10":["CHAPTER-7",1],"AST-D11":["CHAPTER-8",1],"AST-D12":["CHAPTER-9",1],"AST-D14":["CHAPTER-10",1],"AST-D15":["CHAPTER-12",3]}},{"sectionId":"SEC-10","title":"整合阅读与边界","englishTitle":"Integrated Reading & Boundary","assetId":"VIS-REPORT-ASTROLOGY-SEC-10-EVIDENCE-BOUNDARY","modeLabel":"","localeBlocks":{"zhHans":[{"blockId":"CHAPTER-12","title":"十二｜整合阅读：真正重要的是，你把什么带进生命核心","paragraphs":["把整张盘放在一起，你的人生不是由某一颗所谓「最强行星」决定，也不是由某一个传统格局定义。","你的命盘更像一个高度连接的系统。","巨蟹上升使你先通过感受、环境与安全感进入现实；月亮落第十二宫，使很多适应过程发生在内部；月亮经水星进入火星，使你最终需要把感觉转成理解，再转成真正行动。","与此同时，大量摩羯能量进入第六宫，使责任、工作、维护、现实结构和长期承载成为生活中无法忽略的部分。","而木星在第十二宫与金星、土星、海王星形成非常紧密的对分，使「扩张与退隐」和「责任与运行」长期彼此牵引。","于是你真正的人生主线，并不是简单的「深度」或者「责任」。","而是：","怎样让深度进入一个可以持续的结构，同时又不让结构压掉真正的生命感。","你有能力走得很深。","你也有能力承担很多。","但真正决定生活质量的，不会是你能承受多少，而是你越来越能不能判断：","什么值得我进入这么深。","当这种判断逐渐成熟以后，你的行动会变得更准确，关系会变得更清楚，工作责任也会更接近真正值得长期建立的部分。","你不需要把所有复杂性消除。","你的命盘本来就不是简单型的。","真正重要的是，把复杂性变成结构，把结构保留弹性，把责任放回边界之内，然后把最深的投入，留给真正值得进入你生命核心的事情。"]}],"en":[{"blockId":"CHAPTER-12","title":"Integrated Reading: What You Allow Into the Core of Your Life","paragraphs":["Taken as a whole, your chart is not ruled by one supposedly “strongest planet,” nor is it defined by a single named configuration.","It is better understood as a highly connected system.","Cancer rising means you often meet life first through responsiveness, environment, and a sense of safety. The Moon in the twelfth house means much of your adaptation happens internally. The Moon’s path through Mercury to Mars suggests that feeling often becomes understanding, and understanding eventually becomes action.","At the same time, the concentration of Capricorn planets in the sixth house makes responsibility, maintenance, work, practical systems, and sustained load impossible to ignore.","Jupiter in the twelfth house stands in very close opposition to Venus, Saturn, and Neptune in the sixth, creating a long-term dialogue between expansion and retreat, responsibility and recovery, idealism and practical structure.","So the central story of the chart is not simply “depth,” and it is not simply “responsibility.”","It is:","How do you allow depth to enter a structure that can actually last without letting the structure crush the life inside it?","You are capable of going very deep.","You are also capable of carrying a great deal.","But the quality of your life is unlikely to depend on how much you can endure.","It will depend increasingly on whether you can decide:","What is worth entering this deeply?","As that judgment becomes more refined, your actions can become more precise, your relationships clearer, and your responsibilities more closely aligned with what is genuinely worth building.","You do not need to eliminate every complexity.","This is not a simple chart.","The task is to turn complexity into structure, preserve flexibility inside structure, return responsibility to its proper boundaries, and reserve your deepest investment for what genuinely deserves a place at the center of your life."]}]},"sharedDiagrams":["AST-D15"],"profile":{"sectionId":"SEC-10","assetId":"VIS-REPORT-ASTROLOGY-SEC-10-EVIDENCE-BOUNDARY","assetPath":"assets/ast-vfr-r1/images/reports/astrology/editorial/shared/VIS-REPORT-ASTROLOGY-SEC-10-EVIDENCE-BOUNDARY.webp","assetDigest":"efefc17432f4b4b338bae41a75eaa27b84f9b78a2a967d1ac937fba8af57fbbc","layoutVersion":"PHI-OS-AST-SECTION-MASTER-LAYOUT-v1.0.0","safeZone":{"x":150,"y":335,"width":494,"height":250},"anchor":{"xPercent":50,"yPercent":50},"centerAnchor":{"x":397,"y":460},"alignment":"CENTER","sectionNumberStyle":{"fontSize":19,"lineHeight":1.2},"zhTitleStyle":{"fontSize":34,"lineHeight":1.2},"enTitleStyle":{"fontSize":21,"lineHeight":1.2
