<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Book VI · B6-WEB-B Human Review</title>
<style>
:root{font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17211f;background:#f4f1e8}
*{box-sizing:border-box}body{margin:0}.shell{max-width:1480px;margin:auto;padding:20px}.top{position:sticky;top:0;z-index:10;background:#f4f1e8ee;backdrop-filter:blur(10px);padding:12px 0;border-bottom:1px solid #c9d0cc}
h1,h2,h3{line-height:1.25}.muted{color:#66736f}.warning{padding:12px 14px;background:#fff0bf;border-radius:10px}.summary{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.pill{padding:6px 10px;border-radius:999px;background:white;border:1px solid #bac4c0}.pill.ok{background:#dff3e7}.pill.bad{background:#f9dddd}.layout{display:grid;grid-template-columns:330px 1fr;gap:20px;margin-top:18px}.sidebar{position:sticky;top:150px;align-self:start;max-height:calc(100vh - 175px);overflow:auto;padding:12px;background:#fff;border-radius:12px}.entry{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border:1px solid #d6ddda;border-radius:9px;background:#fff;cursor:pointer}.entry[aria-current="true"]{border-color:#176c68;box-shadow:0 0 0 2px #176c6822}.entry.approved{background:#ebf8ef}.entry.rejected{background:#fde8e8}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;border:1px solid #d8dfdc}.meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.lang{padding:18px;border:1px solid #d8dfdc;border-radius:12px}.lang p{white-space:pre-wrap}.boundary{padding:12px;border-left:4px solid #b58a28;background:#fff8df}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:.85rem;padding:4px 7px;background:#eef3f1;border-radius:999px}textarea{width:100%;min-height:90px;padding:10px;border:1px solid #aebbb6;border-radius:8px;font:inherit}.actions{display:flex;flex-wrap:wrap;gap:10px;position:sticky;bottom:0;background:#fff;padding:14px 0;border-top:1px solid #d8dfdc}.actions button,.top button,.top a{padding:10px 14px;border-radius:8px;border:1px solid #8fa09a;background:white;color:#173a36;text-decoration:none;cursor:pointer}.approve{background:#1f6f50!important;color:white!important}.reject{background:#9a3434!important;color:white!important}.status{font-weight:700}.status.approved{color:#1f6f50}.status.rejected{color:#9a3434}.status.pending{color:#8b6a15}.openlinks{display:flex;gap:10px;flex-wrap:wrap}.openlinks a{color:#145d69}.footer-tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.loading{padding:60px;text-align:center}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}.pair{grid-template-columns:1fr}.meta-grid{grid-template-columns:1fr}.top{position:static}.actions{position:static}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
<h1>第六册《世界如何重组》· B6-WEB-B Human Review</h1>
<p class="warning"><strong>审阅对象固定在 commit 93761b47cd1aaf4e2b3d20fcebf764245de4021d</strong>。这里只审 28 组双语文章的 publication copy + semantic parity。Approve 不代表 B6-WEB-C/D/E/F、Browser Acceptance、R2 Visual 或 Current Data 已通过。</p>
<div class="summary" id="summary"></div>
<div class="footer-tools">
<button id="prev">← Previous</button><button id="next">Next →</button><button id="nextPending">Next Pending</button>
<button id="export">Export review JSON</button><button id="copySummary">Copy result summary</button><button id="reset">Reset all decisions</button>
<a href="/books/reality-configuration/" target="_blank" rel="noopener">Open Book VI</a>
</div>
</header>
<div id="app" class="loading">Loading review packet…</div>
</div>
<script>
const BASELINE="93761b47cd1aaf4e2b3d20fcebf764245de4021d";
const RAW='https://raw.githubusercontent.com/getphioscs-UX/phios/'+BASELINE;
const MANIFEST='/content/knowledge/public/successors/book6-publication-v1/visual-article-release.json';
const STORAGE='phiOS.book6.b6-web-b.human-review.'+BASELINE;
const state={manifest:null,pairs:[],index:0,decisions:loadDecisions(),cache:new Map()};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
async function readJson(path){
 const candidates=[RAW+path, location.protocol==='file:'?null:path].filter(Boolean);
 let last;
 for(const url of candidates){try{const r=await fetch(url,{cache:'no-store'});if(r.ok)return await r.json();last=new Error(url+' '+r.status)}catch(e){last=e}}
 throw last||new Error('SOURCE_UNAVAILABLE');
}
function loadDecisions(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch{return {}}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state.decisions))}
function statusFor(id){return state.decisions[id]?.decision||'PENDING'}
function counts(){let a=0,r=0;for(const p of state.pairs){const s=statusFor(p.articleId);if(s==='APPROVED')a++;if(s==='REJECTED')r++}return {approved:a,rejected:r,pending:state.pairs.length-a-r}}
function renderSummary(){const c=counts();document.getElementById('summary').innerHTML='<span class="pill">Total '+state.pairs.length+'</span><span class="pill ok">Approved '+c.approved+'</span><span class="pill bad">Rejected '+c.rejected+'</span><span class="pill">Pending '+c.pending+'</span><span class="pill">Semantic parity decision = HUMAN</span>'}
function body(article){return (article.sections||[]).flatMap(s=>(s.blocks||[]).map(b=>b.text||b.statement||'')).filter(Boolean)}
function chips(label,values){return '<div><strong>'+esc(label)+'</strong><div class="chips">'+((values||[]).length?(values||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join(''):'<span class="muted">None</span>')+'</div></div>'}
async function getPair(pair){
 if(state.cache.has(pair.articleId))return state.cache.get(pair.articleId);
 const zh=pair.records.find(r=>r.locale==='zh-Hans'),en=pair.records.find(r=>r.locale==='en');
 const value=await Promise.all([readJson(zh.path),readJson(en.path)]).then(([z,e])=>({zh:z,en:e}));
 state.cache.set(pair.articleId,value);return value;
}
async function render(){
 renderSummary();
 const app=document.getElementById('app');
 if(!state.pairs.length){app.className='loading';app.textContent='No review entries.';return}
 const pair=state.pairs[state.index],d=state.decisions[pair.articleId]||{};
 app.className='layout';
 app.innerHTML='<aside class="sidebar" id="list"></aside><main id="main"><div class="card">Loading article pair…</div></main>';
 document.getElementById('list').innerHTML=state.pairs.map((p,i)=>{const s=statusFor(p.articleId);return '<button class="entry '+s.toLowerCase()+'" data-i="'+i+'" aria-current="'+(i===state.index)+'"><strong>'+(i+1)+'. '+esc(p.title['zh-Hans'])+'</strong><br><span class="muted">'+esc(p.title.en)+'</span><br><span class="status '+s.toLowerCase()+'">'+s+'</span></button>'}).join('');
 document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{state.index=Number(b.dataset.i);render()});
 try{
  const data=await getPair(pair), zh=data.zh,en=data.en,rel=zh.atlasRelations||{},current=statusFor(pair.articleId);
  document.getElementById('main').innerHTML=`
  <section class="card">
   <div class="meta-grid">
    <div><strong>Article</strong><br>${esc(pair.articleId)}<br><span class="muted">${esc(pair.slug)}</span></div>
    <div><strong>Source sections</strong><br>${esc((pair.sourceSections||[]).join(' · '))}</div>
    <div><strong>Manuscript pages</strong><br>${esc(pair.sourcePages?.start)}–${esc(pair.sourcePages?.end)}</div>
   </div>
   <p><strong>Decision:</strong> <span class="status ${current.toLowerCase()}">${current}</span></p>
   <div class="openlinks"><a href="/articles/${esc(pair.slug)}?locale=zh-Hans" target="_blank" rel="noopener">Open 中文 article</a><a href="/articles/${esc(pair.slug)}?locale=en" target="_blank" rel="noopener">Open English article</a></div>
  </section>
  <section class="card">
   <h2>Review criteria</h2>
   <ol><li>英文是否忠实保留中文的核心意义与限制。</li><li>英文是否没有增加中文没有的事实、因果、动机或预测。</li><li>历史事实 / 历史重建 / 当前观察 / 条件投影 / UNKNOWN 的边界是否仍清楚。</li><li>英文是否自然、可出版，而不是逐字机器翻译。</li><li>标题、summary、正文三段与 source sections 是否仍属于同一个论证单元。</li></ol>
  </section>
  <section class="pair">
   <article class="lang"><p class="muted">ZH-HANS</p><h2>${esc(zh.title)}</h2><p><strong>${esc(zh.summary)}</strong></p>${body(zh).map((p,i)=>'<p>'+(i===body(zh).length-1?'<span class="boundary">'+esc(p)+'</span>':esc(p))+'</p>').join('')}<h3>Knowledge boundary</h3>${(zh.knowledgeBoundary||[]).map(x=>'<p class="boundary">'+esc(typeof x==='string'?x:x.text)+'</p>').join('')}</article>
   <article class="lang"><p class="muted">ENGLISH</p><h2>${esc(en.title)}</h2><p><strong>${esc(en.summary)}</strong></p>${body(en).map((p,i)=>'<p>'+(i===body(en).length-1?'<span class="boundary">'+esc(p)+'</span>':esc(p))+'</p>').join('')}<h3>Knowledge boundary</h3>${(en.knowledgeBoundary||[]).map(x=>'<p class="boundary">'+esc(typeof x==='string'?x:x.text)+'</p>').join('')}</article>
  </section>
  <section class="card"><h2>Atlas relationship check</h2>
   ${chips('Cases',rel.relatedCases)}${chips('Windows',rel.relatedWindows)}${chips('Snapshots',rel.relatedSnapshots)}${chips('Dossiers',rel.relatedDossiers)}${chips('Lived Reality',rel.relatedLivedRealityDimensions)}${chips('Figures',rel.relatedFigures)}
  </section>
  <section class="card"><label for="note"><strong>Review note</strong> — Reject 时必填；Approve 可选。</label><textarea id="note" placeholder="例如：英文第二段把条件性关系写成确定因果，需要修改。">${esc(d.note||'')}</textarea>
   <div class="actions"><button class="approve" id="approve">Approve Pair</button><button class="reject" id="reject">Reject Pair</button><button id="clear">Clear Decision</button><button id="bottomNext">Next →</button></div>
  </section>`;
  const note=document.getElementById('note');
  document.getElementById('approve').onclick=()=>decide(pair,'APPROVED',note.value);
  document.getElementById('reject').onclick=()=>{if(!note.value.trim()){alert('Reject 必须填写原因。');note.focus();return}decide(pair,'REJECTED',note.value)};
  document.getElementById('clear').onclick=()=>{delete state.decisions[pair.articleId];save();render()};
  document.getElementById('bottomNext').onclick=()=>move(1);
 }catch(e){document.getElementById('main').innerHTML='<section class="card"><h2>Source unavailable</h2><p>'+esc(e.message)+'</p><p>请确认网络可访问 GitHub raw 或通过 repository/site server 打开。</p></section>'}
}
function decide(pair,decision,note){state.decisions[pair.articleId]={articleId:pair.articleId,slug:pair.slug,sourceSections:pair.sourceSections,decision,note:String(note||'').trim(),decidedAt:new Date().toISOString()};save();renderSummary();const next=state.pairs.findIndex((p,i)=>i>state.index&&statusFor(p.articleId)==='PENDING');if(next>=0)state.index=next;render()}
function move(n){state.index=Math.max(0,Math.min(state.pairs.length-1,state.index+n));render()}
function resultObject(){const c=counts();return {schemaVersion:'PHI-OS-B6-WEB-B-HUMAN-REVIEW-RESULTS-v1.0.0',package:'B6-WEB-B',reviewScope:'BOOK_VI_BILINGUAL_ARTICLE_SEMANTIC_PARITY_AND_PUBLICATION_COPY',baselineCommit:BASELINE,reviewer:'TL',generatedAt:new Date().toISOString(),overallStatus:c.pending?'INCOMPLETE':c.rejected?'REJECTED_ITEMS_PRESENT':'ALL_APPROVED',summary:c,decisions:state.pairs.map(p=>state.decisions[p.articleId]||{articleId:p.articleId,slug:p.slug,sourceSections:p.sourceSections,decision:null,note:'',decidedAt:null}),boundaries:{doesNotApprove:['B6-WEB-C','B6-WEB-D','B6-WEB-E','B6-WEB-F','FINAL_BROWSER_ACCEPTANCE','FINAL_R2_VISUAL_VALIDATION','CURRENT_DATA_POPULATION'],machineChecksDoNotConstituteHumanAcceptance:true}}}
function exportJson(){const obj=resultObject(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download='book6-b6-web-b-human-review-results.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function copySummary(){const o=resultObject();let text='B6-WEB-B Human Review · '+o.baselineCommit+'\nApproved '+o.summary.approved+'/28 · Rejected '+o.summary.rejected+' · Pending '+o.summary.pending+'\nOverall: '+o.overallStatus;if(o.summary.rejected){text+='\n\nRejected:\n'+o.decisions.filter(x=>x.decision==='REJECTED').map(x=>'- '+x.articleId+' '+x.slug+': '+x.note).join('\n')}await navigator.clipboard.writeText(text);alert('Summary copied.')}
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('nextPending').onclick=()=>{const n=state.pairs.findIndex((p,i)=>i>state.index&&statusFor(p.articleId)==='PENDING');const any=state.pairs.findIndex(p=>statusFor(p.articleId)==='PENDING');state.index=n>=0?n:any>=0?any:state.index;render()};document.getElementById('export').onclick=exportJson;document.getElementById('copySummary').onclick=copySummary;document.getElementById('reset').onclick=()=>{if(confirm('清除这次 28 篇所有人工决定？')){state.decisions={};save();state.index=0;render()}};
(async()=>{try{const m=await readJson(MANIFEST);state.manifest=m;const by=new Map;for(const r of m.records||[]){if(!by.has(r.articleId))by.set(r.articleId,[]);by.get(r.articleId).push(r)}state.pairs=[...by.entries()].map(([articleId,records])=>{const zh=records.find(r=>r.locale==='zh-Hans')||records[0];return {articleId,slug:zh.slug,title:{'zh-Hans':records.find(r=>r.locale==='zh-Hans')?.title||zh.title,en:records.find(r=>r.locale==='en')?.title||zh.title},sourceSections:zh.sourceSections,sourcePages:zh.sourcePages,records}}).sort((a,b)=>a.articleId.localeCompare(b.articleId));if(state.pairs.length!==28)throw new Error('Expected 28 review pairs, got '+state.pairs.length);render()}catch(e){document.getElementById('app').textContent='Review packet could not load: '+e.message}})();
</script>
</body></html>
