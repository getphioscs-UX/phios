  <meta name="description" content="文明运行不是城市、国家、文字、技术或人口的对象清单，而是制度、记忆、知识、意义、基础设施、人口与载体彼此进入对方时间以后形成的跨世代关系状态。真正重要的是这些层是否仍能互相转换、再生产和迁移；库存很多却转换失效，文明仍会下降。文明图谱阈值由此出现：知道某个社会“是文明”仍不足以判断它正在扩展、维护、失配、迁移、收缩还是继任，必须把能力、负荷、方向、时间距离与未来余量放进多维运行位置，而不是压成单一排名。">
