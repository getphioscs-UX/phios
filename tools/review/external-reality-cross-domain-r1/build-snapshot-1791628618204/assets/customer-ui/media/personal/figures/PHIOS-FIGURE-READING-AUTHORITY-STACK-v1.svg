<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><style>.t{font-family:Inter, 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif;fill:#26364A}.en{font-weight:700;letter-spacing:.6px}.zh{font-weight:600}.body{font-size:18px;fill:#667487;font-weight:500}</style><text x="800" y="48" text-anchor="middle" class="t en" font-size="34">PHI OS READING AUTHORITY STACK</text><text x="800" y="79" text-anchor="middle" class="t zh" font-size="22">PHI OS 读取权威层级</text><rect x="210" y="95" width="1060" height="118" rx="24" fill="#fff" stroke="#1F4E8C" stroke-width="2"/><rect x="210" y="95" width="112" height="118" rx="24" fill="#1F4E8C"/><text x="266" y="167" text-anchor="middle" font-family="Inter, 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="42" font-weight="700" fill="white">1</text><path d="M342 154 Q370 126 398 154 Q370 182 342 154Z" fill="none" stroke="#1F4E8C" stroke-width="3"/><circle cx="370" cy="154" r="6" fill="#1F4E8C"/><text x="420" y="143" class="t en" font-size="27" fill="#1F4E8C">OBSERVATION</text><text x="420" y="175" class="t zh" font-size="23">可观察现实</text><text x="770" y="137" class="t body">Reality leaves observable traces.</text><text x="770" y="170" class="t body">现实留下可观察的痕迹。</text><path d="M800 217v20" stroke="#12356B" stroke-width="3"/><path d="M792 231l8 8 8-8" fill="none" stroke="#12356B" stroke-width="3"/><rect x="210" y="241" width="1060" height="118" rx="24" fill="#fff" stroke="#2F8C87" stroke-width="2"/><rect x="210" y="241" width="112" height="118" rx="24" fill="#2F8C87"/><text x="266" y="313" text-anchor="middle" font-family="Inter, 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="42" font-weight="700" fill="white">2</text><circle cx="358" cy="300" r="5" fill="#2F8C87"/><circle cx="373" cy="279" r="5" fill="#2F8C87"/><circle cx="388" cy="301" r="5" fill="#2F8C87"/><path d="M361 296L370 283M377 283l8 14M363 301h20" stroke="#2F8C87" stroke-width="3" fill="none"/><text x="420" y="289" class="t en" font-size="27" fill="#2F8C87">EVIDENCE</text><text x="420" y="321" class="t zh" font-size="23">现实证据</text><text x="770" y="283" class="t body">Traces support, limit or contradict claims.</text><text x="770" y="316" class="t body">痕迹可以支持、限制或反驳判断。</text><path d="M800 363v20" stroke="#12356B" stroke-width="3"/><path d="M792 377l8 8 8-8" fill="none" stroke="#12356B" stroke-width="3"/><rect x="210" y="387" width="1060" height="118" rx="24" fill="#fff" stroke="#C7952E" stroke-width="2"/><rect x="210" y="387" width="112" height="118" rx="24" fill="#C7952E"/><text x="266" y="459" text-anchor="middle" font-family="Inter, 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="42" font-weight="700" fill="white">3</text><path d="M348 459l14-18 14 10 18-23" stroke="#C7952E" stroke-width="3" fill="none"/><circle cx="348" cy="459" r="3" fill="#C7952E"/><circle cx="362" cy="441" r="3" fill="#C7952E"/><circle cx="376" cy="451" r="3" fill="#C7952E"/><circle cx="394" cy="428" r="3" fill="#C7952E"/><text x="420" y="435" class="t en" font-size="27" fill="#C7952E">PROJECTION</text><text x="420" y="467" class="t zh" font-size="23">方法投影</text><text x="770" y="419" class="t body">Methods map limited information<tspan x="770" y="442">into structured models.</tspan></text><text x="770" y="470" class="t body">方法把有限信息映射成<tspan x="770" y="493">结构化模型。</tspan></text><path d="M800 509v20" stroke="#12356B" stroke-width="3"/><path d="M792 523l8 8 8-8" fill="none" stroke="#12356B" stroke-width="3"/><rect x="210" y="533" width="1060" height="118" rx="24" fill="#fff" stroke="#3F6DB5" stroke-width="2"/><rect x="210" y="533" width="112" height="118" rx="24" fill="#3F6DB5"/><text x="266" y="605" text-anchor="middle" font-family="Inter, 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="42" font-weight="700" fill="white">4</text><path d="M346 587l24-13 24 13-24 13zM346 597l24 13 24-13M346 607l24 13 24-13" fill="none" stroke="#3F6DB5" stroke-width="3"/><text x="420" y="581" class="t en" font-size="27" fill="#3F6DB5">READING</text><text x="420" y="613" class="t zh" font-size="23">统一读取</text><text x="770" y="565" class="t body">Evidence and projections are organized<tspan x="770" y="588">into a bounded reading.</tspan></text><text x="770" y="616" class="t body">证据与投影被组织成<tspan x="770" y="639">有边界的读取。</tspan></text><path d="M800 655v20" stroke="#12356B" stroke-width="3"/><path d="M792 669l8 8 8-8" fill="none" stroke="#12356B" stroke-width="3"/><rect x="210" y="679" width="1060" height="118" rx="24" fill="#fff" stroke="#7B5AA6" stroke-width="2"/><rect x="210" y="679" width="112" height="118" rx="24" fill="#7B5AA6"/><text x="266" y="751" text-anchor="middle" font-family="Inter, 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="42" font-weight="700" fill="white">5</text><path d="M346 731a18 14 0 0 1 18-14h12a18 14 0 0 1 18 14v8a18 14 0 0 1-18 14h-5l-10 9v-9h3a18 14 0 0 1-18-14z" fill="none" stroke="#7B5AA6" stroke-width="3"/><circle cx="362" cy="735" r="2" fill="#7B5AA6"/><circle cx="370" cy="735" r="2" fill="#7B5AA6"/><circle cx="378" cy="735" r="2" fill="#7B5AA6"/><text x="420" y="727" class="t en" font-size="27" fill="#7B5AA6">INTERPRETATION</text><text x="420" y="759" class="t zh" font-size="23">解释</text><text x="770" y="711" class="t body">Meaning is formed within source, context<tspan x="770" y="734">and evidence boundaries.</tspan></text><text x="770" y="762" class="t body">意义在来源、情境与证据<tspan x="770" y="785">边界内形成。</tspan></text><path d="M800 801v20" stroke="#12356B" stroke-width="3"/><path d="M792 815l8 8 8-8" fill="none" stroke="#12356B" stroke-width="3"/><rect x="210" y="825" width="1060" height="118" rx="24" fill="#fff" stroke="#687584" stroke-width="2"/><rect x="210" y="825" width="112" height="118" rx="24" fill="#687584"/><text x="266" y="897" text-anchor="middle" font-family="Inter, 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="42" font-weight="700" fill="white">6</text><path d="M370 855l24 9v16c0 15-10 25-24 31-14-6-24-16-24-31v-16z" fill="none" stroke="#687584" stroke-width="3"/><path d="M359 880l8 8 15-18" fill="none" stroke="#687584" stroke-width="3"/><text x="420" y="873" class="t en" font-size="27" fill="#687584">GOVERNANCE</text><text x="420" y="905" class="t zh" font-size="23">治理</text><text x="770" y="857" class="t body">Authority, ethics and responsibility<tspan x="770" y="880">constrain the reading.</tspan></text><text x="770" y="908" class="t body">权威、伦理与责任限制读取<tspan x="770" y="931">可以走多远。</tspan></text><path d="M800 947v20" stroke="#12356B" stroke-width="3"/><path d="M792 961l8 8 8-8" fill="none" stroke="#12356B" stroke-width="3"/><rect x="210" y="971" width="1060" height="118" rx="24" fill="#fff" stroke="#C7952E" stroke-width="2"/><rect x="210" y="971" width="112" height="118" rx="24" fill="#C7952E"/><text x="266" y="1043" text-anchor="middle" font-family="Inter, 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="42" font-weight="700" fill="white">7</text><path d="M348 1045l16-19 13 10 20-29" fill="none" stroke="#C7952E" stroke-width="3"/><path d="M386 1011v-17l16 7-16 7" fill="none" stroke="#C7952E" stroke-width="3"/><text x="420" y="1019" class="t en" font-size="24" fill="#C7952E">NAVIGATION THRESHOLD</text><text x="420" y="1051" class="t zh" font-size="23">导航阈值</text><text x="770" y="1003" class="t body">Reading stops before decision<tspan x="770" y="1026">authority begins.</tspan></text><text x="770" y="1054" class="t body">读取在行动决定权<tspan x="770" y="1077">之前停止。</tspan></text><line x1="1360" y1="155" x2="1360" y2="995" stroke="#12356B" stroke-width="2" stroke-dasharray="6 7" opacity=".55"/><circle cx="1360" cy="378" r="62" fill="#fff" stroke="#12356B" stroke-width="2" stroke-dasharray="5 6"/><text x="1360" y="371" text-anchor="middle" class="t en" font-size="20">UNKNOWN</text><text x="1360" y="400" text-anchor="middle" class="t zh" font-size="18">未知</text><circle cx="1360" cy="760" r="70" fill="#fff" stroke="#12356B" stroke-width="2" stroke-dasharray="5 6"/><text x="1360" y="748" text-anchor="middle" class="t en" font-size="17">VERSION</text><text x="1360" y="772" text-anchor="middle" class="t en" font-size="17">REVISION</text><text x="1360" y="800" text-anchor="middle" class="t zh" font-size="17">版本 / 修订</text><text x="800" y="1160" text-anchor="middle" class="t body">Observable Reality → Evidence → Projection → Reading → Interpretation → Governance → Navigation Threshold</text></svg>