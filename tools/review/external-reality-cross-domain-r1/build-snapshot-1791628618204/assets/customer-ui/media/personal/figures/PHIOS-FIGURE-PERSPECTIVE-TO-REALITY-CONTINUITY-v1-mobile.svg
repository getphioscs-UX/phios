<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1420" viewBox="0 0 720 1420" role="img">
<title>Perspective to Reality Continuity Mobile</title>
<style>.t{font-family:Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif;fill:#26364A}.en{font-weight:700}.zh{font-weight:600}.muted{fill:#667487}</style>
<text x="360" y="48" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#12356B">PERSPECTIVE → REALITY</text>
<text x="360" y="77" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="600" fill="#26364A">视角到现实</text>
<rect x="92" y="135" width="536" height="136" rx="23" fill="#FFFFFF" stroke="#C7952E" stroke-width="2"/>
<circle cx="150" cy="203" r="31" fill="#C7952E" fill-opacity=".09" stroke="#C7952E" stroke-width="1.8"/>
<circle cx="150" cy="203" r="8" fill="#C7952E"/>
<text x="202" y="193" class="t en" font-size="17.5" fill="#C7952E">PERSPECTIVE</text>
<text x="202" y="222" class="t zh" font-size="17">视角</text>
<path d="M360 277v36" stroke="#12356B" stroke-width="3"/><path d="M351 302l9 11 9-11" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="92" y="309" width="536" height="136" rx="23" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2"/>
<circle cx="150" cy="377" r="31" fill="#1F4E8C" fill-opacity=".09" stroke="#1F4E8C" stroke-width="1.8"/>
<circle cx="150" cy="377" r="8" fill="#1F4E8C"/>
<text x="202" y="367" class="t en" font-size="17.5" fill="#1F4E8C">OBSERVATION CANDIDATE</text>
<text x="202" y="396" class="t zh" font-size="17">观察候选</text>
<path d="M360 451v36" stroke="#12356B" stroke-width="3"/><path d="M351 476l9 11 9-11" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="92" y="483" width="536" height="136" rx="23" fill="#FFFFFF" stroke="#2F8C87" stroke-width="2"/>
<circle cx="150" cy="551" r="31" fill="#2F8C87" fill-opacity=".09" stroke="#2F8C87" stroke-width="1.8"/>
<circle cx="150" cy="551" r="8" fill="#2F8C87"/>
<text x="202" y="541" class="t en" font-size="17.5" fill="#2F8C87">OBSERVE OVER TIME</text>
<text x="202" y="570" class="t zh" font-size="17">持续观察</text>
<path d="M360 625v36" stroke="#12356B" stroke-width="3"/><path d="M351 650l9 11 9-11" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="92" y="657" width="536" height="136" rx="23" fill="#FFFFFF" stroke="#3F6DB5" stroke-width="2"/>
<circle cx="150" cy="725" r="31" fill="#3F6DB5" fill-opacity=".09" stroke="#3F6DB5" stroke-width="1.8"/>
<circle cx="150" cy="725" r="8" fill="#3F6DB5"/>
<text x="202" y="715" class="t en" font-size="17.5" fill="#3F6DB5">EVIDENCE / COUNTER-EVIDENCE</text>
<text x="202" y="744" class="t zh" font-size="17">证据 / 反证</text>
<path d="M360 799v36" stroke="#12356B" stroke-width="3"/><path d="M351 824l9 11 9-11" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="92" y="831" width="536" height="136" rx="23" fill="#FFFFFF" stroke="#7B5AA6" stroke-width="2"/>
<circle cx="150" cy="899" r="31" fill="#7B5AA6" fill-opacity=".09" stroke="#7B5AA6" stroke-width="1.8"/>
<circle cx="150" cy="899" r="8" fill="#7B5AA6"/>
<text x="202" y="889" class="t en" font-size="17.5" fill="#7B5AA6">REVIEW</text>
<text x="202" y="918" class="t zh" font-size="17">复核</text>
<path d="M360 973v36" stroke="#12356B" stroke-width="3"/><path d="M351 998l9 11 9-11" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="92" y="1005" width="536" height="136" rx="23" fill="#FFFFFF" stroke="#687584" stroke-width="2"/>
<circle cx="150" cy="1073" r="31" fill="#687584" fill-opacity=".09" stroke="#687584" stroke-width="1.8"/>
<circle cx="150" cy="1073" r="8" fill="#687584"/>
<text x="202" y="1063" class="t en" font-size="17.5" fill="#687584">CONTINUE / REVISE / REJECT</text>
<text x="202" y="1092" class="t zh" font-size="17">继续 / 修订 / 否定</text>

<rect x="105" y="1200" width="510" height="112" rx="22" fill="#F7F4ED" stroke="#C9D5E6" stroke-width="1.5"/>
<text x="360" y="1242" text-anchor="middle" class="t en" font-size="20" fill="#12356B">RESONATES ≠ FACT</text>
<text x="360" y="1272" text-anchor="middle" class="t zh" font-size="17">觉得贴近，不等于已经成为现实事实</text>

</svg>