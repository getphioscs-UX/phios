<text x="360" y="1205" text-anchor="middle" class="t muted" font-size="15">Status is explicit. Empty and unknown remain visible.</text>
<text x="360" y="1232" text-anchor="middle" class="t muted zh" font-size="15">状态明确显示；空白与未知不会被自动填满。</text>

