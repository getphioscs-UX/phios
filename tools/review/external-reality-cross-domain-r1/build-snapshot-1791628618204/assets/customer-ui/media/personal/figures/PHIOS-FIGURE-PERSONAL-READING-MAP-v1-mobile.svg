<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1340" viewBox="0 0 720 1340" role="img">
<title>Personal Reading Map Mobile</title>
<style>.t{font-family:Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif;fill:#26364A}.en{font-weight:700}.zh{font-weight:600}.muted{fill:#667487}</style>
