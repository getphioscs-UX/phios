<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040" role="img">
<title>PHI OS Perspective to Reality Continuity</title>

<style>
.t{font-family:Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif;fill:#26364A}
.en{font-weight:700;letter-spacing:.55px}
.zh{font-weight:600}
.muted{fill:#667487}
</style>
<text x="850" y="58" text-anchor="middle" class="t en" font-size="38">PERSPECTIVE → REALITY CONTINUITY</text>
<text x="850" y="94" text-anchor="middle" class="t zh" font-size="24">视角到现实的持续观察</text>
<text x="850" y="130" text-anchor="middle" class="t muted" font-size="20">A perspective can begin observation. It does not become fact because it resonates.</text>

<rect x="105" y="245" width="235" height="420" rx="26" fill="#FFFFFF" stroke="#C7952E" stroke-width="2.2"/>
<rect x="105" y="245" width="235" height="12" rx="6" fill="#C7952E"/>
<circle cx="222.5" cy="335" r="42" fill="#C7952E" fill-opacity=".08" stroke="#C7952E" stroke-width="2"/>
<circle cx="222.5" cy="335" r="20" fill="none" stroke="#C7952E" stroke-width="3"/><path d="M237.5 350l17 17" stroke="#C7952E" stroke-width="3"/><circle cx="222.5" cy="335" r="5" fill="#C7952E"/>
<text x="222.5" y="410" text-anchor="middle" class="t en" font-size="18" fill="#C7952E">PERSPECTIVE</text>
<text x="222.5" y="440" text-anchor="middle" class="t zh" font-size="18">视角</text>
<text x="222.5" y="490" text-anchor="middle" class="t muted" font-size="14.5">A bounded method result</text><text x="222.5" y="513" text-anchor="middle" class="t muted" font-size="14.5">enters reflection.</text><path d="M348 455H364" stroke="#12356B" stroke-width="3"/><path d="M351 446l13 9-13 9" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="378" y="245" width="235" height="420" rx="26" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.2"/>
<rect x="378" y="245" width="235" height="12" rx="6" fill="#1F4E8C"/>
<circle cx="495.5" cy="335" r="42" fill="#1F4E8C" fill-opacity=".08" stroke="#1F4E8C" stroke-width="2"/>
<path d="M473.5 335c7-11 14-16 22-16s15 5 22 16c-7 11-14 16-22 16S480.5 346 473.5 335z" fill="none" stroke="#1F4E8C" stroke-width="3"/><circle cx="495.5" cy="335" r="6" fill="#1F4E8C"/>
<text x="495.5" y="410" text-anchor="middle" class="t en" font-size="18" fill="#1F4E8C">OBSERVATION CANDIDATE</text>
<text x="495.5" y="440" text-anchor="middle" class="t zh" font-size="18">观察候选</text>
<text x="495.5" y="490" text-anchor="middle" class="t muted" font-size="14.5">The user chooses what may be</text><text x="495.5" y="513" text-anchor="middle" class="t muted" font-size="14.5">worth watching.</text><path d="M621 455H637" stroke="#12356B" stroke-width="3"/><path d="M624 446l13 9-13 9" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="651" y="245" width="235" height="420" rx="26" fill="#FFFFFF" stroke="#2F8C87" stroke-width="2.2"/>
<rect x="651" y="245" width="235" height="12" rx="6" fill="#2F8C87"/>
<circle cx="768.5" cy="335" r="42" fill="#2F8C87" fill-opacity=".08" stroke="#2F8C87" stroke-width="2"/>
<circle cx="768.5" cy="335" r="22" fill="none" stroke="#2F8C87" stroke-width="3"/><path d="M768.5 322v14l10 7" stroke="#2F8C87" stroke-width="3"/>
<text x="768.5" y="410" text-anchor="middle" class="t en" font-size="18" fill="#2F8C87">OBSERVE OVER TIME</text>
<text x="768.5" y="440" text-anchor="middle" class="t zh" font-size="18">持续观察</text>
<text x="768.5" y="490" text-anchor="middle" class="t muted" font-size="14.5">Life, events and changes add</text><text x="768.5" y="513" text-anchor="middle" class="t muted" font-size="14.5">reality traces.</text><path d="M894 455H910" stroke="#12356B" stroke-width="3"/><path d="M897 446l13 9-13 9" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="924" y="245" width="235" height="420" rx="26" fill="#FFFFFF" stroke="#3F6DB5" stroke-width="2.2"/>
<rect x="924" y="245" width="235" height="12" rx="6" fill="#3F6DB5"/>
<circle cx="1041.5" cy="335" r="42" fill="#3F6DB5" fill-opacity=".08" stroke="#3F6DB5" stroke-width="2"/>
<circle cx="1025.5" cy="345" r="5" fill="#3F6DB5"/><circle cx="1041.5" cy="322" r="5" fill="#3F6DB5"/><circle cx="1059.5" cy="345" r="5" fill="#3F6DB5"/><path d="M1029.5 341L1038.5 326M1044.5 326L1055.5 341M1031.5 345h23" stroke="#3F6DB5" stroke-width="3"/>
<text x="1041.5" y="410" text-anchor="middle" class="t en" font-size="18" fill="#3F6DB5">EVIDENCE / COUNTER-EVIDENCE</text>
<text x="1041.5" y="440" text-anchor="middle" class="t zh" font-size="18">证据 / 反证</text>
<text x="1041.5" y="490" text-anchor="middle" class="t muted" font-size="14.5">Reality may support,</text><text x="1041.5" y="513" text-anchor="middle" class="t muted" font-size="14.5">contradict or leave it</text><text x="1041.5" y="536" text-anchor="middle" class="t muted" font-size="14.5">unresolved.</text><path d="M1167 455H1183" stroke="#12356B" stroke-width="3"/><path d="M1170 446l13 9-13 9" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="1197" y="245" width="235" height="420" rx="26" fill="#FFFFFF" stroke="#7B5AA6" stroke-width="2.2"/>
<rect x="1197" y="245" width="235" height="12" rx="6" fill="#7B5AA6"/>
<circle cx="1314.5" cy="335" r="42" fill="#7B5AA6" fill-opacity=".08" stroke="#7B5AA6" stroke-width="2"/>
<path d="M1292.5 337a22 22 0 1 1 8 16" fill="none" stroke="#7B5AA6" stroke-width="3"/><path d="M1287.5 345l13 8 2-15" fill="none" stroke="#7B5AA6" stroke-width="3"/><path d="M1306.5 335l6 6 12-14" fill="none" stroke="#7B5AA6" stroke-width="3"/>
<text x="1314.5" y="410" text-anchor="middle" class="t en" font-size="18" fill="#7B5AA6">REVIEW</text>
<text x="1314.5" y="440" text-anchor="middle" class="t zh" font-size="18">复核</text>
<text x="1314.5" y="490" text-anchor="middle" class="t muted" font-size="14.5">Compare the earlier</text><text x="1314.5" y="513" text-anchor="middle" class="t muted" font-size="14.5">perspective with what</text><text x="1314.5" y="536" text-anchor="middle" class="t muted" font-size="14.5">actually happened.</text><path d="M1440 455H1456" stroke="#12356B" stroke-width="3"/><path d="M1443 446l13 9-13 9" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="1470" y="245" width="235" height="420" rx="26" fill="#FFFFFF" stroke="#687584" stroke-width="2.2"/>
<rect x="1470" y="245" width="235" height="12" rx="6" fill="#687584"/>
<circle cx="1587.5" cy="335" r="42" fill="#687584" fill-opacity=".08" stroke="#687584" stroke-width="2"/>
<path d="M1562.5 335h42" stroke="#687584" stroke-width="3"/><path d="M1595.5 326l12 9-12 9" fill="none" stroke="#687584" stroke-width="3"/><circle cx="1570.5" cy="335" r="5" fill="#687584"/>
<text x="1587.5" y="410" text-anchor="middle" class="t en" font-size="18" fill="#687584">CONTINUE / REVISE / REJECT</text>
<text x="1587.5" y="440" text-anchor="middle" class="t zh" font-size="18">继续 / 修订 / 否定</text>
<text x="1587.5" y="490" text-anchor="middle" class="t muted" font-size="14.5">The next state stays</text><text x="1587.5" y="513" text-anchor="middle" class="t muted" font-size="14.5">explicit and versioned.</text>
<rect x="215" y="735" width="1270" height="148" rx="24" fill="#F7F4ED" stroke="#C9D5E6" stroke-width="1.5"/>
<text x="850" y="780" text-anchor="middle" class="t en" font-size="24" fill="#12356B">RESONATES ≠ FACT</text>
<text x="850" y="814" text-anchor="middle" class="t zh" font-size="20">觉得贴近，不等于已经成为现实事实</text>
<text x="850" y="850" text-anchor="middle" class="t muted" font-size="17">Reality evidence develops through observation, time, support, contradiction and review.</text>
<text x="850" y="875" text-anchor="middle" class="t muted zh" font-size="16">现实证据来自持续观察、时间、支持、反证与复核，而不是来自“感觉很准”。</text>
<path d="M1280 910c40 0 80 24 80 62" fill="none" stroke="#12356B" stroke-width="2.5" stroke-dasharray="6 6"/>
<path d="M1360 972c0-30 20-55 48-63" fill="none" stroke="#12356B" stroke-width="2.5"/>
<text x="850" y="995" text-anchor="middle" class="t muted" font-size="16">Continue ↺ Review ↺ Revise</text>

</svg>