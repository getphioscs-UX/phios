<svg xmlns="http://www.w3.org/2000/svg" class="pe-native-radar" viewBox="0 0 320 320" role="img" aria-label="单一来源自陈位置，轴标签见配对图例 / Single-source self-report positions; axes identified in paired legend" data-source-key="CUSTOMER_SELF_REPORT::UNSPECIFIED"><style>@layer pvp.profile.mvp {
  .prf-visual-mvp{display:grid;gap:clamp(18px,3vw,28px);margin:22px 0 8px}
  .prf-visual-mvp__intro{max-width:760px}.prf-visual-mvp__intro h2{margin:.2rem 0 .5rem;font-size:clamp(1.45rem,3vw,2rem)}.prf-visual-mvp__intro p{margin:0;color:var(--pvp-supporting,#676a61);line-height:1.65}
  .prf-pfig{border:1px solid var(--cx-color-border,rgba(23,25,20,.14));border-radius:clamp(16px,2vw,22px);background:linear-gradient(145deg,var(--pvp-visual-surface,#fff),color-mix(in srgb,var(--pvp-visual-surface-raised,#fffefa) 88%,var(--pvp-method-profile,#b59a5c)));padding:clamp(18px,3vw,28px);box-shadow:0 14px 38px rgba(23,25,20,.055)}
  .prf-pfig__head{display:grid;grid-template-columns:minmax(0,.8fr) minmax(240px,.55fr);gap:20px;align-items:start;margin-bottom:20px}.prf-pfig__head h3{margin:.2rem 0 0;font-size:clamp(1.2rem,2vw,1.6rem)}.prf-pfig__head>p{margin:0;color:var(--pvp-supporting,#676a61);line-height:1.6;font-size:.92rem}.prf-pfig__eyebrow{margin:0;font-size:.72rem;letter-spacing:.14em;font-weight:700;color:var(--pvp-supporting,#676a61);text-transform:uppercase}
  .prf-pfig--empty{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--pvp-visual-surface,#fff);box-shadow:none}.prf-pfig--empty h3{margin:.15rem 0 .3rem}.prf-pfig--empty p:last-child{margin:0;color:var(--pvp-supporting,#676a61)}.prf-pfig-empty__mark{width:44px;height:44px;border-radius:50%;border:1px dashed var(--pvp-chart-muted,rgba(23,25,20,.24));position:relative}.prf-pfig-empty__mark:after{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--pvp-method-profile,#b59a5c);opacity:.28}
  .prf-dimension-lanes{display:grid;gap:12px}.prf-dimension-lane{display:grid;grid-template-columns:minmax(150px,.28fr) minmax(0,.72fr);gap:14px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--pvp-visual-surface,#fff) 92%,var(--pvp-method-profile,#b59a5c));border:1px solid color-mix(in srgb,var(--pvp-method-profile,#b59a5c) 28%,transparent)}.prf-dimension-lane__source{display:grid;align-content:center;gap:3px}.prf-dimension-lane__source span{font-weight:750}.prf-dimension-lane__source small{color:var(--pvp-supporting,#676a61)}.prf-dimension-lane__items{display:flex;gap:8px;flex-wrap:wrap}.prf-dimension-chip{display:grid;gap:2px;min-width:110px;padding:9px 11px;border-radius:12px;background:var(--pvp-visual-surface,#fff);border:1px solid var(--cx-color-border,rgba(23,25,20,.12))}.prf-dimension-chip span{font-size:.76rem;color:var(--pvp-supporting,#676a61)}.prf-dimension-chip strong{font-size:.96rem}
  .prf-sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.prf-sc-col{padding:16px;border-radius:16px;border:1px solid var(--cx-color-border,rgba(23,25,20,.12));background:var(--pvp-visual-surface,#fff)}.prf-sc-col__title{display:flex;align-items:center;gap:8px;margin-bottom:11px}.prf-sc-col__title span{width:10px;height:10px;border-radius:50%;background:var(--pvp-reality,#2f6a4f)}.prf-sc-col[data-kind="cost"] .prf-sc-col__title span{background:var(--pvp-topic,#7a6331)}.prf-sc-col article{display:grid;gap:3px;padding:10px 0;border-top:1px solid var(--cx-color-border,rgba(23,25,20,.09))}.prf-sc-col article small,.prf-sc-col__none{color:var(--pvp-supporting,#676a61);font-size:.8rem}.prf-sc-col__none{margin:.6rem 0 0}
  .prf-convergence-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.prf-convergence-state{min-height:150px;padding:14px;border:1px solid var(--cx-color-border,rgba(23,25,20,.12));border-radius:15px;background:var(--pvp-visual-surface,#fff)}.prf-convergence-state__top{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center}.prf-convergence-state__top span{width:9px;height:9px;border-radius:50%;background:var(--pvp-chart-muted)}.prf-convergence-state[data-state="CONVERGES"] .prf-convergence-state__top span{background:var(--pvp-reality,#2f6a4f)}.prf-convergence-state[data-state="CONTEXT_DEPENDENT"] .prf-convergence-state__top span{background:var(--pvp-method-profile,#b59a5c)}.prf-convergence-state[data-state="DIVERGES"] .prf-convergence-state__top span{background:var(--pvp-topic,#7a6331)}.prf-convergence-state__top b{font-size:1.2rem}.prf-convergence-state>small{display:block;color:var(--pvp-supporting,#676a61);margin:.5rem 0 .7rem;line-height:1.4}.prf-convergence-state>p{font-size:.8rem;line-height:1.45;margin:.4rem 0;padding-top:.45rem;border-top:1px solid var(--cx-color-border,rgba(23,25,20,.09))}
  .prf-bridge-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}.prf-bridge-stage{position:relative;display:grid;grid-template-columns:auto 1fr;gap:10px;padding:14px 18px 14px 0}.prf-bridge-stage:not(:last-child):after{content:"";position:absolute;top:26px;right:2px;width:18px;border-top:1px solid var(--pvp-chart-muted)}.prf-bridge-stage__n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--pvp-method-profile,#b59a5c);font-size:.68rem;font-weight:800}.prf-bridge-stage[data-active="false"]{opacity:.48}.prf-bridge-stage strong{font-size:.9rem}.prf-bridge-stage p{margin:.3rem 0 0;color:var(--pvp-supporting,#676a61);font-size:.8rem;line-height:1.45}.prf-bridge-actions{margin-top:14px}
  @media(max-width:900px){.prf-pfig__head{grid-template-columns:1fr}.prf-convergence-grid,.prf-bridge-flow{grid-template-columns:1fr 1fr}.prf-bridge-stage:nth-child(2):after{display:none}.prf-dimension-lane{grid-template-columns:1fr}}
  @media(max-width:600px){.prf-sc-grid,.prf-convergence-grid,.prf-bridge-flow{grid-template-columns:1fr}.prf-bridge-stage:after{display:none}.prf-pfig{padding:16px}.prf-dimension-lane__items{display:grid;grid-template-columns:1fr 1fr}.prf-dimension-chip{min-width:0}}
  @media print{.prf-pfig{break-inside:avoid;box-shadow:none}.prf-bridge-actions{display:none}}
}
</style><title>单源自陈 / Single-source self-report</title><desc>同一来源内的记录位置；不代表总人格或能力 / Recorded positions within one source; not a global personality or ability result</desc><polygon points="160,125 181.65063509461098,137.5 181.65063509461098,162.5 160,175 138.34936490538905,162.5 138.34936490538902,137.5" fill="none" stroke="#baa77e" /><polygon points="160,100 203.30127018922192,125 203.30127018922195,175 160,200 116.69872981077808,175.00000000000003 116.69872981077808,125" fill="none" stroke="#baa77e" /><polygon points="160,75 224.9519052838329,112.5 224.9519052838329,187.5 160,225 95.04809471616711,187.50000000000003 95.0480947161671,112.5" fill="none" stroke="#baa77e" /><polygon points="160,50 246.60254037844385,99.99999999999999 246.60254037844388,199.99999999999997 160,250 73.39745962155615,200.00000000000006 73.39745962155614,99.99999999999999" fill="none" stroke="#baa77e" /><line x1="160" y1="150" x2="160" y2="50" stroke="#baa77e" /><line x1="160" y1="150" x2="246.60254037844385" y2="99.99999999999999" stroke="#baa77e" /><line x1="160" y1="150" x2="246.60254037844388" y2="199.99999999999997" stroke="#baa77e" /><line x1="160" y1="150" x2="160" y2="250" stroke="#baa77e" /><line x1="160" y1="150" x2="73.39745962155615" y2="200.00000000000006" stroke="#baa77e" /><line x1="160" y1="150" x2="73.39745962155614" y2="99.99999999999999" stroke="#baa77e" /><polygon data-native-values="50,75,0,25,100,0" points="160,100 224.9519052838329,112.5 160,150 160,175 73.39745962155615,200.00000000000006 160,150" fill="#648caa38" stroke="#416781" stroke-width="2" /><text x="160" y="30" text-anchor="middle" dominant-baseline="middle" font-size="16">A · 50</text><text x="263.92304845413264" y="89.99999999999999" text-anchor="middle" dominant-baseline="middle" font-size="16">B · 75</text><text x="263.92304845413264" y="209.99999999999997" text-anchor="middle" dominant-baseline="middle" font-size="16">C · 0</text><text x="160.00000000000003" y="270" text-anchor="middle" dominant-baseline="middle" font-size="16">D · 25</text><text x="56.07695154586739" y="210.00000000000006" text-anchor="middle" dominant-baseline="middle" font-size="16">E · 100</text><text x="56.076951545867374" y="89.99999999999999" text-anchor="middle" dominant-baseline="middle" font-size="16">F · 0</text><text x="160" y="312" text-anchor="middle" font-size="14">0–100 · 自陈 / Self-report</text></svg>