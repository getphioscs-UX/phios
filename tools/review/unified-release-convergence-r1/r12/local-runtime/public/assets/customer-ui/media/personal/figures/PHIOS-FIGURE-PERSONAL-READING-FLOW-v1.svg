<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img">
<title>PHI OS Personal Reading Flow</title>

<style>
.t{font-family:Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif;fill:#26364A}
.en{font-weight:700;letter-spacing:.6px}
.zh{font-weight:600}
.muted{fill:#667487}
</style>
<text x="900" y="60" text-anchor="middle" class="t en" font-size="38">PERSONAL READING FLOW</text>
<text x="900" y="96" text-anchor="middle" class="t zh" font-size="24">个人读取流程</text>
<text x="900" y="132" text-anchor="middle" class="t muted" font-size="20">Choose → provide only what is needed → read → compare → continue or leave open</text>

<rect x="120" y="205" width="310" height="230" rx="24" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.2"/>
<rect x="120" y="205" width="310" height="12" rx="6" fill="#1F4E8C"/>
<text x="146" y="251" class="t en" font-size="18" fill="#1F4E8C">01</text>
<circle cx="275" cy="275" r="35" fill="#1F4E8C" fill-opacity=".08" stroke="#1F4E8C" stroke-width="2"/>
<circle cx="263" cy="275" r="8" fill="none" stroke="#1F4E8C" stroke-width="3"/>
<circle cx="287" cy="275" r="8" fill="none" stroke="#1F4E8C" stroke-width="3"/>
<path d="M271 275h8M287 267l5-5M287 283l5 5" stroke="#1F4E8C" stroke-width="3"/>
<text x="275" y="332" text-anchor="middle" class="t en" font-size="20" fill="#1F4E8C">CHOOSE PERSPECTIVES</text>
<text x="275" y="361" text-anchor="middle" class="t zh" font-size="19">选择视角</text>
<text x="275" y="392" text-anchor="middle" class="t muted" font-size="14.5">Start with the lenses you want to</text><text x="275" y="413" text-anchor="middle" class="t muted" font-size="14.5">explore.</text><path d="M446 320H487" stroke="#12356B" stroke-width="3"/><path d="M475 312l12 8-12 8" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="505" y="205" width="310" height="230" rx="24" fill="#FFFFFF" stroke="#2F8C87" stroke-width="2.2"/>
<rect x="505" y="205" width="310" height="12" rx="6" fill="#2F8C87"/>
<text x="531" y="251" class="t en" font-size="18" fill="#2F8C87">02</text>
<circle cx="660" cy="275" r="35" fill="#2F8C87" fill-opacity=".08" stroke="#2F8C87" stroke-width="2"/>
<rect x="637" y="257" width="46" height="36" rx="6" fill="none" stroke="#2F8C87" stroke-width="3"/>
<path d="M647 268h26M647 277h20M647 286h12" stroke="#2F8C87" stroke-width="3"/>
<text x="660" y="332" text-anchor="middle" class="t en" font-size="20" fill="#2F8C87">PROVIDE REQUIRED INPUT</text>
<text x="660" y="361" text-anchor="middle" class="t zh" font-size="19">提供所需资料</text>
<text x="660" y="392" text-anchor="middle" class="t muted" font-size="14.5">Only the information required by those</text><text x="660" y="413" text-anchor="middle" class="t muted" font-size="14.5">perspectives appears.</text><path d="M831 320H872" stroke="#12356B" stroke-width="3"/><path d="M860 312l12 8-12 8" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="890" y="205" width="310" height="230" rx="24" fill="#FFFFFF" stroke="#687584" stroke-width="2.2"/>
<rect x="890" y="205" width="310" height="12" rx="6" fill="#687584"/>
<text x="916" y="251" class="t en" font-size="18" fill="#687584">03</text>
<circle cx="1045" cy="275" r="35" fill="#687584" fill-opacity=".08" stroke="#687584" stroke-width="2"/>
<rect x="1025" y="255" width="40" height="40" rx="7" fill="none" stroke="#687584" stroke-width="3"/>
<path d="M1035 275l7 7 14-16" stroke="#687584" stroke-width="3"/>
<text x="1045" y="332" text-anchor="middle" class="t en" font-size="20" fill="#687584">CONFIRM &amp; CONSENT</text>
<text x="1045" y="361" text-anchor="middle" class="t zh" font-size="19">确认与同意</text>
<text x="1045" y="392" text-anchor="middle" class="t muted" font-size="14.5">Nothing is processed until you</text><text x="1045" y="413" text-anchor="middle" class="t muted" font-size="14.5">confirm.</text><path d="M1216 320H1257" stroke="#12356B" stroke-width="3"/><path d="M1245 312l12 8-12 8" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="1275" y="205" width="310" height="230" rx="24" fill="#FFFFFF" stroke="#C7952E" stroke-width="2.2"/>
<rect x="1275" y="205" width="310" height="12" rx="6" fill="#C7952E"/>
<text x="1301" y="251" class="t en" font-size="18" fill="#C7952E">04</text>
<circle cx="1430" cy="275" r="35" fill="#C7952E" fill-opacity=".08" stroke="#C7952E" stroke-width="2"/>
<circle cx="1412" cy="285" r="4" fill="#C7952E"/><circle cx="1425" cy="265" r="4" fill="#C7952E"/><circle cx="1439" cy="275" r="4" fill="#C7952E"/>
<path d="M1416 282L1422 269M1429 267L1435 273M1443 275h10" stroke="#C7952E" stroke-width="3"/>
<path d="M1448 268l10 7-10 7z" fill="none" stroke="#C7952E" stroke-width="3"/>
<text x="1430" y="332" text-anchor="middle" class="t en" font-size="20" fill="#C7952E">CALCULATE PROJECTION</text>
<text x="1430" y="361" text-anchor="middle" class="t zh" font-size="19">形成方法投影</text>
<text x="1430" y="392" text-anchor="middle" class="t muted" font-size="14.5">Each method keeps its own calculation</text><text x="1430" y="413" text-anchor="middle" class="t muted" font-size="14.5">and scope.</text><path d="M1430 449V572" stroke="#12356B" stroke-width="3"/><path d="M1422 560l8 12 8-12" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="1275" y="590" width="310" height="230" rx="24" fill="#FFFFFF" stroke="#7B5AA6" stroke-width="2.2"/>
<rect x="1275" y="590" width="310" height="12" rx="6" fill="#7B5AA6"/>
<text x="1301" y="636" class="t en" font-size="18" fill="#7B5AA6">05</text>
<circle cx="1430" cy="660" r="35" fill="#7B5AA6" fill-opacity=".08" stroke="#7B5AA6" stroke-width="2"/>
<path d="M1407 645h31c8 0 14 5 14 12v5c0 7-6 12-14 12h-10l-9 8v-8h-12z" fill="none" stroke="#7B5AA6" stroke-width="3"/>
<circle cx="1422" cy="660" r="2.5" fill="#7B5AA6"/><circle cx="1430" cy="660" r="2.5" fill="#7B5AA6"/><circle cx="1438" cy="660" r="2.5" fill="#7B5AA6"/>
<text x="1430" y="717" text-anchor="middle" class="t en" font-size="20" fill="#7B5AA6">COMPOSE INTERPRETATION</text>
<text x="1430" y="746" text-anchor="middle" class="t zh" font-size="19">形成解释</text>
<text x="1430" y="777" text-anchor="middle" class="t muted" font-size="14.5">Meaning appears only where governed</text><text x="1430" y="798" text-anchor="middle" class="t muted" font-size="14.5">sources support it.</text><path d="M1259 705H1218" stroke="#12356B" stroke-width="3"/><path d="M1230 697l-12 8 12 8" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="890" y="590" width="310" height="230" rx="24" fill="#FFFFFF" stroke="#3F6DB5" stroke-width="2.2"/>
<rect x="890" y="590" width="310" height="12" rx="6" fill="#3F6DB5"/>
<text x="916" y="636" class="t en" font-size="18" fill="#3F6DB5">06</text>
<circle cx="1045" cy="660" r="35" fill="#3F6DB5" fill-opacity=".08" stroke="#3F6DB5" stroke-width="2"/>
<circle cx="1035" cy="660" r="16" fill="none" stroke="#3F6DB5" stroke-width="3"/>
<circle cx="1057" cy="660" r="16" fill="none" stroke="#3F6DB5" stroke-width="3"/>
<path d="M1044 648c5 4 8 8 8 12s-3 8-8 12" stroke="#3F6DB5" stroke-width="3"/>
<text x="1045" y="717" text-anchor="middle" class="t en" font-size="20" fill="#3F6DB5">COMPARE WITH REALITY</text>
<text x="1045" y="746" text-anchor="middle" class="t zh" font-size="19">与现实对照</text>
<text x="1045" y="777" text-anchor="middle" class="t muted" font-size="14.5">Compare the perspective with what you</text><text x="1045" y="798" text-anchor="middle" class="t muted" font-size="14.5">actually observe.</text><path d="M874 705H833" stroke="#12356B" stroke-width="3"/><path d="M845 697l-12 8 12 8" fill="none" stroke="#12356B" stroke-width="3"/>
<rect x="505" y="590" width="310" height="230" rx="24" fill="#FFFFFF" stroke="#12356B" stroke-width="2.2"/>
<rect x="505" y="590" width="310" height="12" rx="6" fill="#12356B"/>
<text x="531" y="636" class="t en" font-size="18" fill="#12356B">07</text>
<circle cx="660" cy="660" r="35" fill="#12356B" fill-opacity=".08" stroke="#12356B" stroke-width="2"/>
<path d="M636 672c12-25 26-28 42-14" fill="none" stroke="#12356B" stroke-width="3"/>
<path d="M673 651l8 6-9 5" fill="none" stroke="#12356B" stroke-width="3"/>
<circle cx="640" cy="675" r="4" fill="#12356B"/>
<text x="660" y="717" text-anchor="middle" class="t en" font-size="20" fill="#12356B">CONTINUE OR LEAVE OPEN</text>
<text x="660" y="746" text-anchor="middle" class="t zh" font-size="19">继续观察 / 保持未知</text>
<text x="660" y="777" text-anchor="middle" class="t muted" font-size="14.5">Carry selected observations forward,</text><text x="660" y="798" text-anchor="middle" class="t muted" font-size="14.5">or leave uncertainty visible.</text>
<rect x="120" y="890" width="1560" height="52" rx="18" fill="#F7F4ED" stroke="#C9D5E6" stroke-width="1.5"/>
<text x="900" y="922" text-anchor="middle" class="t" font-size="18">Perspective ≠ Fact · Unknown stays unknown · Nothing is saved automatically</text>

</svg>