<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img">
<title>PHI OS Personal Reading Map</title>

<style>
.t{font-family:Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif;fill:#26364A}
.en{font-weight:700;letter-spacing:.55px}
.zh{font-weight:600}
.muted{fill:#667487}
</style>
<text x="800" y="58" text-anchor="middle" class="t en" font-size="38">PERSONAL READING MAP</text>
<text x="800" y="94" text-anchor="middle" class="t zh" font-size="24">个人读取地图</text>
<text x="800" y="130" text-anchor="middle" class="t muted" font-size="20">A result map shows what this reading actually established—and what it did not.</text>
<line x1="310" y1="212" x2="310" y2="902" stroke="#12356B" stroke-width="4" opacity=".8"/>

<circle cx="310" cy="230" r="17" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="4"/>
<circle cx="310" cy="230" r="6" fill="#1F4E8C"/>
<rect x="365" y="170" width="940" height="120" rx="23" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2"/>
<rect x="365" y="170" width="16" height="120" rx="8" fill="#1F4E8C"/>
<text x="420" y="210" class="t en" font-size="24" fill="#1F4E8C">INPUT</text>
<text x="420" y="240" class="t zh" font-size="20">输入</text>
<text x="420" y="269" class="t muted" font-size="17">Required information confirmed</text>

<rect x="1080" y="204" width="185" height="52" rx="17" fill="#1F4E8C" fill-opacity=".07" stroke="#1F4E8C" stroke-width="1.5"/>
<circle cx="1104" cy="230" r="11" fill="none" stroke="#1F4E8C" stroke-width="2"/><path d="M1098 230l5 5 9-10" fill="none" stroke="#1F4E8C" stroke-width="2.5"/>
<text x="1128" y="236" class="t en" font-size="13.5" fill="#1F4E8C">CONFIRMED</text>

<circle cx="310" cy="375" r="17" fill="#FFFFFF" stroke="#C7952E" stroke-width="4"/>
<circle cx="310" cy="375" r="6" fill="#C7952E"/>
<rect x="365" y="315" width="940" height="120" rx="23" fill="#FFFFFF" stroke="#C7952E" stroke-width="2"/>
<rect x="365" y="315" width="16" height="120" rx="8" fill="#C7952E"/>
<text x="420" y="355" class="t en" font-size="24" fill="#C7952E">PROJECTIONS</text>
<text x="420" y="385" class="t zh" font-size="20">投影</text>
<text x="420" y="414" class="t muted" font-size="17">Method calculations prepared</text>

<rect x="1080" y="349" width="185" height="52" rx="17" fill="#C7952E" fill-opacity=".07" stroke="#C7952E" stroke-width="1.5"/>
<circle cx="1104" cy="375" r="11" fill="#C7952E" fill-opacity=".12" stroke="#C7952E" stroke-width="2"/><circle cx="1104" cy="375" r="4" fill="#C7952E"/>
<text x="1128" y="381" class="t en" font-size="13.5" fill="#C7952E">AVAILABLE</text>

<circle cx="310" cy="520" r="17" fill="#FFFFFF" stroke="#7B5AA6" stroke-width="4"/>
<circle cx="310" cy="520" r="6" fill="#7B5AA6"/>
<rect x="365" y="460" width="940" height="120" rx="23" fill="#FFFFFF" stroke="#7B5AA6" stroke-width="2"/>
<rect x="365" y="460" width="16" height="120" rx="8" fill="#7B5AA6"/>
<text x="420" y="500" class="t en" font-size="24" fill="#7B5AA6">INTERPRETATIONS</text>
<text x="420" y="530" class="t zh" font-size="20">解释</text>
<text x="420" y="559" class="t muted" font-size="17">Source-bound explanations where supported</text>

<rect x="1080" y="494" width="185" height="52" rx="17" fill="#7B5AA6" fill-opacity=".07" stroke="#7B5AA6" stroke-width="1.5"/>
<circle cx="1104" cy="520" r="11" fill="none" stroke="#7B5AA6" stroke-width="2" stroke-dasharray="17 17" transform="rotate(-90 1104 520)"/><path d="M1104 509v22" stroke="#7B5AA6" stroke-width="2"/>
<text x="1128" y="526" class="t en" font-size="13.5" fill="#7B5AA6">PARTIAL</text>

<circle cx="310" cy="665" r="17" fill="#FFFFFF" stroke="#2F8C87" stroke-width="4"/>
<circle cx="310" cy="665" r="6" fill="#2F8C87"/>
<rect x="365" y="605" width="940" height="120" rx="23" fill="#FFFFFF" stroke="#2F8C87" stroke-width="2"/>
<rect x="365" y="605" width="16" height="120" rx="8" fill="#2F8C87"/>
<text x="420" y="645" class="t en" font-size="24" fill="#2F8C87">CURRENT CONTEXT</text>
<text x="420" y="675" class="t zh" font-size="20">当前情境</text>
<text x="420" y="704" class="t muted" font-size="17">Time-sensitive layer only when established</text>

<rect x="1080" y="639" width="185" height="52" rx="17" fill="#2F8C87" fill-opacity=".07" stroke="#2F8C87" stroke-width="1.5"/>
<circle cx="1104" cy="665" r="11" fill="#2F8C87" fill-opacity=".12" stroke="#2F8C87" stroke-width="2"/><circle cx="1104" cy="665" r="4" fill="#2F8C87"/>
<text x="1128" y="671" class="t en" font-size="13.5" fill="#2F8C87">AVAILABLE</text>

<circle cx="310" cy="810" r="17" fill="#FFFFFF" stroke="#3F6DB5" stroke-width="4"/>
<circle cx="310" cy="810" r="6" fill="#3F6DB5"/>
<rect x="365" y="750" width="940" height="120" rx="23" fill="#FFFFFF" stroke="#3F6DB5" stroke-width="2"/>
<rect x="365" y="750" width="16" height="120" rx="8" fill="#3F6DB5"/>
<text x="420" y="790" class="t en" font-size="24" fill="#3F6DB5">REALITY COMPARISON</text>
<text x="420" y="820" class="t zh" font-size="20">现实对照</text>
<text x="420" y="849" class="t muted" font-size="17">Your lived observation remains separate</text>

<rect x="1080" y="784" width="185" height="52" rx="17" fill="#3F6DB5" fill-opacity=".07" stroke="#3F6DB5" stroke-width="1.5"/>
<circle cx="1104" cy="810" r="11" fill="none" stroke="#3F6DB5" stroke-width="2" stroke-dasharray="3 4"/><path d="M1100 810h8" stroke="#3F6DB5" stroke-width="2"/>
<text x="1128" y="816" class="t en" font-size="13.5" fill="#3F6DB5">NOT REVIEWED</text>

<circle cx="310" cy="955" r="17" fill="#FFFFFF" stroke="#687584" stroke-width="4"/>
<circle cx="310" cy="955" r="6" fill="#687584"/>
<rect x="365" y="895" width="940" height="120" rx="23" fill="#FFFFFF" stroke="#687584" stroke-width="2"/>
<rect x="365" y="895" width="16" height="120" rx="8" fill="#687584"/>
<text x="420" y="935" class="t en" font-size="24" fill="#687584">WHAT REMAINS OPEN</text>
<text x="420" y="965" class="t zh" font-size="20">仍然未知</text>
<text x="420" y="994" class="t muted" font-size="17">Missing, unsupported or unresolved items stay visible</text>

<rect x="1080" y="929" width="185" height="52" rx="17" fill="#687584" fill-opacity=".07" stroke="#687584" stroke-width="1.5"/>
<circle cx="1104" cy="955" r="11" fill="none" stroke="#687584" stroke-width="2" stroke-dasharray="3 4"/>
<text x="1128" y="961" class="t en" font-size="13.5" fill="#687584">OPEN</text>

<rect x="120" y="965" width="1360" height="102" rx="22" fill="#F7F4ED" stroke="#C9D5E6" stroke-width="1.5"/>
<text x="165" y="1000" class="t en" font-size="17">STATUS LANGUAGE</text>
<text x="165" y="1030" class="t muted" font-size="16">AVAILABLE · PARTIAL · UNAVAILABLE · NOT REVIEWED · UNKNOWN are normal product states—not failure states.</text>
<text x="165" y="1054" class="t muted zh" font-size="16">可用、部分可用、不可用、尚未复核与未知，都属于正常产品状态，不等于错误。</text>

</svg>