<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" role="img" aria-labelledby="r27-P24-title r27-P24-desc"><title id="r27-P24-title">计算、学派与证据边界</title><desc id="r27-P24-desc">出生日期计算: 原生输入与归约；可核对; 姓名逐段归约: 西方来源对齐角色；全名合计单列对照; 档案三角法: 来源待审；未并入客户计算; 现实材料: 未提供；数字不证明现实结论</desc><style>text{font-family:ReportCJK,Arial,sans-serif;fill:#193442}.label{font-size:15px}.strong{font-size:15px;font-weight:bold}.small{font-size:12px}.value{font-size:24px;font-weight:bold}</style><text x="20" y="27" class="strong" text-anchor="start">出生日期计算</text><text x="20" y="52" class="label" text-anchor="start">原生输入与归约；可核对</text><text x="20" y="109" class="strong" text-anchor="start">姓名逐段归约</text><text x="20" y="134" class="label" text-anchor="start">西方来源对齐角色；全名合计单列对照</text><text x="20" y="191" class="strong" text-anchor="start">档案三角法</text><text x="20" y="216" class="label" text-anchor="start">来源待审；未并入客户计算</text><text x="20" y="273" class="strong" text-anchor="start">现实材料</text><text x="20" y="298" class="label" text-anchor="start">未提供；数字不证明现实结论</text></svg>