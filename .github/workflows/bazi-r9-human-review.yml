name: BaZi R11 Content Quality Human Review Package

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-bazi-r9-review.mjs'
      - 'functions/personal-reading/**'
      - 'functions/canonical-presentation-runtime/**'
      - 'assets/customer-ui/js/personal-products/**'
      - 'assets/customer-ui/surfaces/**'
      - 'config/reports/**'
      - 'docs/guided-report-successor-r2/bazi-source.json'
      - '.github/workflows/bazi-r9-human-review.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bazi-r11-content-quality-human-review
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Build R11 browser runtime
        run: node scripts/sync-bazi-r9-review-browser.mjs
      - name: Build R11 review package
        run: node scripts/build-bazi-r9-review.mjs
      - name: Commit R11 review package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/customer-ui/js/personal-products/bazi-r9-review-runtime.bundle.js docs/acceptance/bazi-paid-report/r11
          if git diff --cached --quiet; then
            echo "No R9 package changes"
          else
            git commit -m "bazi: materialize R11 content-quality human review package"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Upload R11 review package
        uses: actions/upload-artifact@v4
        with:
          name: bazi-r11-content-quality-human-review
          path: docs/acceptance/bazi-paid-report/r11
          if-no-files-found: error
