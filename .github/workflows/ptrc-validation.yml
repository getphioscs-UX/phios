name: PTRC repository validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Runner disk before checkout
        shell: bash
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          df -i "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Runner disk after checkout
        if: always()
        shell: bash
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          df -i "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          if [ -d .git ]; then
            du -sh .git .
            git rev-parse HEAD
            git rev-parse --is-shallow-repository
            git config --get remote.origin.partialclonefilter
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Prepare exact immutable Main096 validation inputs
        run: |
          node scripts/prepare-main096-immutable-ci-inputs-r1.mjs --self-test
          node scripts/prepare-main096-immutable-ci-inputs-r1.mjs
      - run: npm ci
      - name: Global fraud R5 current rules, real handlers, DOM and version boundaries
        env:
          REPORT_PROVIDER_LIVE_ALLOWED: 'false'
          REPORT_ZERO_COST_REPLAY: 'true'
        run: node --import ./scripts/lib/report-zero-cost-preload.mjs --import ./scripts/lib/pages-json-import-preload.mjs --test tests/fraud/*.test.mjs
      - run: npm run check:ptrc:machine
      - run: npm run build:pages
      - run: npm run check
      - run: git diff --exit-code
