name: PTRC repository validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:ptrc:machine
      - name: Build Pages publication assets before repository checks
        run: npm run build:pages
      - name: Verify source-schema and generated-output boundaries
        run: node scripts/check-schema-references-ci-regression.mjs
      - run: npm run check
      - run: git diff --exit-code
