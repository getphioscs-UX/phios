            scripts/check-founder-owner-r3.mjs
            scripts/check-founder-publication-r1.mjs
            scripts/check-pds-w3-core-component-shell.mjs
            scripts/check-pis-r1-presentation.mjs
            scripts/check-world-readability-compatibility-r1.mjs
            scripts/lib/audit-r2-public-receiver-r2.mjs
            scripts/lib/founder-human-presence-successor-r2.mjs
            scripts/lib/founder-owner-r3-strict-r4.mjs
            scripts/lib/founder-r3-historical-view-r1.mjs
