name: Figure Story Deck R1 validation
on:
  pull_request:
    paths:
      - 'assets/js/figure-story-deck.js'
      - 'assets/css/figure-story-deck.css'
      - 'assets/js/global-visual-r2.js'
      - 'scripts/check-figure-story-deck-r1.mjs'
      - 'index.html'
      - 'perspectives/**'
      - 'reality/**'
      - 'account/**'
      - 'about/**'
      - 'professional/financial/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  figure-story-deck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .node-version
            package.json
            package-lock.json
            index.html
            assets/js/figure-story-deck.js
            assets/js/global-visual-r2.js
            assets/css/figure-story-deck.css
            scripts/check-figure-story-deck-r1.mjs
            perspectives/tarot/index.html
            perspectives/iching/consult/index.html
            reality/index.html
            perspectives/profile/index.html
            account/index.html
            about/reality-navigation/index.html
            professional/financial/index.html
            perspectives/personal/index.html
            perspectives/index.html
            about/founder/index.html
            scripts/lib/public-customer-report-convergence-successor-r1.mjs
            scripts/lib/bzr-public-fidelity-reception-r1.mjs
            content/production-closure/live-customer-commercial-convergence/final-unified-production-r1/BZR-PUBLIC-FIDELITY-RECEPTION-R1.json
            scripts/lib/hd-private-decorative-reception-r1.mjs
            content/production-closure/live-customer-commercial-convergence/final-unified-production-r1/HD-PRIVATE-DECORATIVE-RECEPTION-R1.json
            scripts/lib/world-readability-compatibility-r1.mjs
            scripts/lib/report-zwr-revision-reception-r1.mjs
            content/production-closure/live-customer-commercial-convergence/final-unified-production-r1/REPORT-ZWR-REVISION-RECEPTION-R1.json
            content/production-closure/live-customer-commercial-convergence/final-unified-production-r1/PUBLIC-CUSTOMER-REPORT-CONVERGENCE-SUCCESSOR-R4.json
            content/production-closure/live-customer-commercial-convergence/final-unified-production-r1/REPORT-LOCAL-TECHNICAL16-RECEIVER-SUCCESSOR-R1.json
            content/production-closure/live-customer-commercial-convergence/final-unified-production-r1/SYMBOLIC-FROZEN20-RECEIVER-SUCCESSOR-R1.json
            content/production-closure/live-customer-commercial-convergence/final-unified-production-r1/R6-VISUAL-ALLOCATION-SUCCESSOR.json
            content/production-closure/live-customer-commercial-convergence/final-unified-production-r1/PUBLIC-CUSTOMER-REPORT-CONVERGENCE-SUCCESSOR-R1.json
            content/production-closure/live-customer-commercial-convergence/final-unified-production-r1/PUBLIC-CUSTOMER-REPORT-CONVERGENCE-SUCCESSOR-R2.json
            content/production-closure/live-customer-commercial-convergence/final-unified-production-r1/PUBLIC-CUSTOMER-REPORT-CONVERGENCE-SUCCESSOR-R3.json
            subjects/personal/index.html
            subjects/family/index.html
            subjects/team/index.html
            subjects/business/index.html
            subjects/institution/index.html
            subjects/country/index.html
            scripts/lib/atlas-visual-w16-source-bridge-r1.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node --check assets/js/figure-story-deck.js
      - run: node --check assets/js/global-visual-r2.js
      - run: node scripts/check-figure-story-deck-r1.mjs
