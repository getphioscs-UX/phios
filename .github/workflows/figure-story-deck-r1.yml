name: Figure Story Deck R1 validation
on:
  pull_request:
    paths:
      - 'assets/js/figure-story-deck.js'
      - 'assets/css/figure-story-deck.css'
      - 'assets/js/global-visual-r2.js'
      - 'scripts/check-figure-story-deck-r1.mjs'
      - 'index.html'
      - 'perspectives/**'
      - 'reality/**'
      - 'account/**'
      - 'about/**'
      - 'professional/financial/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  figure-story-deck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .node-version
            package.json
            package-lock.json
            index.html
            assets/js/figure-story-deck.js
            assets/js/global-visual-r2.js
            assets/css/figure-story-deck.css
            scripts/check-figure-story-deck-r1.mjs
            perspectives/tarot/index.html
            perspectives/iching/consult/index.html
            reality/index.html
            perspectives/profile/index.html
            account/index.html
            about/reality-navigation/index.html
            professional/financial/index.html
            perspectives/personal/index.html
            perspectives/index.html
            about/founder/index.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node --check assets/js/figure-story-deck.js
      - run: node --check assets/js/global-visual-r2.js
      - run: node scripts/check-figure-story-deck-r1.mjs
