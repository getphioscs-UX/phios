            tools/review/founder-owner-r3-strict-r4/predecessor/scripts/check-founder-human-presence-r2.mjs
            tools/review/founder-owner-r3-strict-r4/predecessor/scripts/check-founder-publication-r1.mjs
            tools/review/founder-owner-r3-strict-r4/predecessor/tools/review/founder-human-presence-r2/ASSET-VERIFICATION.json
            world/index.html
            content/production-closure/live-customer-commercial-convergence/final-unified-production-r1/FOUNDER-LEGACY-ROUTE-COMPATIBILITY-R1.json
            scripts/lib/founder-legacy-route-compatibility-r1.mjs
            _redirects
            assets/js/explore-about-compat.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node --check assets/js/figure-story-deck.js
      - run: node --check assets/js/global-visual-r2.js
      - run: node scripts/check-figure-story-deck-r1.mjs
