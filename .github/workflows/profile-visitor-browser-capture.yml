name: Profile Visual R1 Browser Capture
on:
  pull_request:
    paths:
      - 'perspectives/profile/index.html'
      - 'assets/customer-ui/surfaces/profile-visitor-r1.css'
      - 'assets/customer-ui/js/surfaces/profile-visitor-r1.js'
      - 'assets/icons/profile-r1/**'
      - 'scripts/capture-profile-visitor-r1.mjs'
      - '.github/workflows/profile-visitor-browser-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .node-version
            package.json
            package-lock.json
            perspectives/profile/index.html
            assets/icons/profile-r1
            assets/images/branding/PHIOS-LOGO-MARK-v1.png
            assets/customer-ui/surfaces/profile-visitor-r1.css
            assets/customer-ui/js/surfaces/profile-visitor-r1.js
            scripts/capture-profile-visitor-r1.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo 'Chrome not found; inspect runner image before installing a browser'
            exit 1
          fi
          google-chrome --version
      - run: node scripts/capture-profile-visitor-r1.mjs
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-visual-r1-browser-candidate-${{ github.run_id }}
          path: artifacts/profile-visitor-r1/browser-capture
          if-no-files-found: warn
          retention-days: 14
      - run: |
          node -e "const r=require('./artifacts/profile-visitor-r1/browser-capture/CAPTURE-REPORT.json');if(r.failCount)process.exit(1)"
