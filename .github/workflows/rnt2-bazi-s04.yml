name: REPORT-NARRATIVE-T2-R1 · BaZi S04 T2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/personal-reading/narrative/report-*.js'
      - 'functions/personal-reading/narrative/bazi-explanatory-authority.js'
      - 'functions/personal-reading/narrative/bazi-s04-t2-runtime.js'
      - 'scripts/build-rnt2-bazi-s04-review.mjs'
      - 'content/ai-economics/providers/ai-provider-cost-registry-v1.json'
      - '.github/workflows/rnt2-bazi-s04.yml'

permissions:
  contents: read

concurrency:
  group: rnt2-bazi-s04
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_NARRATIVE_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Audit BaZi S04 authority and Rich Claim IR
        run: node scripts/check-rnt2-bazi-s04-authority.mjs
      - name: Build governed BaZi S04 T2 review
        run: node scripts/build-rnt2-bazi-s04-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rnt2-bazi-s04
          path: docs/acceptance/report-narrative-t2-r1/bazi/s04
          if-no-files-found: error
