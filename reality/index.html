<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>PHI OS Reality Workspace — Phase 19 Review</title>
  <link rel="stylesheet" href="/assets/css/reality-workspace-phase19.css">
</head>
<body>
  <main class="rjx19-shell" data-rjx19-review-only="true">
    <header class="rjx19-header">
      <div class="rjx19-header__topline">
        <p class="rjx19-eyebrow" data-copy="eyebrow"></p>
        <div class="rjx19-locale" role="group" aria-label="Language">
          <button type="button" data-locale="en" aria-pressed="true">EN</button>
          <button type="button" data-locale="zh-Hans" aria-pressed="false">简中</button>
        </div>
      </div>
      <h1 data-copy="title"></h1>
      <p class="rjx19-lede" data-copy="lede"></p>
      <div class="rjx19-boundary" role="note" data-copy="boundary"></div>
      <nav class="rjx19-stages" aria-label="Reality workspace stages">
        <button type="button" data-stage="UNDERSTAND" class="is-active" aria-current="step"></button>
        <button type="button" data-stage="CHOOSE"></button>
        <button type="button" data-stage="REVIEW"></button>
      </nav>
    </header>

    <section class="rjx19-toolbar" aria-label="Review controls">
      <div>
        <span class="rjx19-toolbar__label" data-copy="complexityLabel"></span>
        <div class="rjx19-segmented" role="group" aria-label="Case complexity">
          <button type="button" data-complexity="SIMPLE" class="is-active" aria-pressed="true"></button>
          <button type="button" data-complexity="COMPLEX" aria-pressed="false"></button>
        </div>
      </div>
      <p class="rjx19-toolbar__hint" data-copy="complexityHint"></p>
    </section>

    <section id="workspace" class="rjx19-workspace" aria-live="polite" aria-busy="true"></section>

    <footer class="rjx19-footer">
      <p data-copy="footer"></p>
      <p><code>/reality/</code> · <span data-copy="redirectState"></span></p>
    </footer>
  </main>
  <script type="module" src="/assets/js/pages/reality-workspace-phase19.js"></script>
</body>
</html>
