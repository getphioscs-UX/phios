<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHI OS · Bilingual Final Approval</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5;color:#181818;background:#f5f5f2}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:12px 18px}.brand{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.brand strong{font-size:18px}.muted{color:#666}.summary{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #ccc;border-radius:999px;padding:3px 9px;background:#fff}.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.filters button[aria-pressed="true"]{font-weight:700;text-decoration:underline}.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 120px)}.nav{border-right:1px solid #ddd;background:#fff;padding:12px;overflow:auto}.node{width:100%;text-align:left;border:1px solid #ddd;background:#fff;padding:10px;margin:0 0 8px;border-radius:10px}.node.active{border-width:2px}.node .status{font-size:12px}.main{padding:18px}.review-grid{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(0,1.4fr);gap:18px;align-items:start}.brief{position:sticky;top:150px;max-height:calc(100vh - 175px);overflow:auto}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}.card h2,.card h3{margin-top:0}.article-body{white-space:pre-wrap}.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button[aria-selected="true"]{font-weight:700;text-decoration:underline}.status-PASS{font-weight:700}.status-WARNING{font-weight:700}.status-BLOCKED{font-weight:700}.decision-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:12px;display:flex;gap:8px;flex-wrap:wrap}.decision-bar button{padding:9px 12px}.approve{font-weight:700}.approve:disabled{opacity:.45}.site-preview{border:1px solid #bbb;border-radius:12px;padding:20px;margin-top:10px;background:#fafafa;transition:max-width .2s}.site-preview.mobile{max-width:390px}.site-preview h1{font-family:Georgia,serif;font-size:clamp(24px,4vw,42px);line-height:1.1}.site-preview .preview-body{white-space:pre-wrap;max-height:420px;overflow:auto}.figure-preview{max-width:100%;height:auto;border-radius:8px}.coverage table{width:100%;border-collapse:collapse}.coverage th,.coverage td{border-bottom:1px solid #eee;padding:6px;text-align:left}.intake textarea{width:100%;min-height:180px}.progress{font-weight:600}.hidden{display:none!important}@media(max-width:900px){.shell{grid-template-columns:1fr}.nav{border-right:0;border-bottom:1px solid #ddd;max-height:240px}.review-grid{grid-template-columns:1fr}.brief{position:static;max-height:none}.main{padding:12px}.top{position:static}.decision-bar{position:static}}
</style>
</head>
<body>
<header class="top"><div class="brand"><strong>PHI OS · Bilingual Final Approval</strong><span id="batch"></span><span class="progress" id="progress"></span></div><div class="summary" id="summary"></div><div class="filters" role="group" aria-label="Review filters"><button data-filter="All" aria-pressed="true">All</button><button data-filter="Ready">Ready</button><button data-filter="Warnings">Warnings</button><button data-filter="Blocked">Blocked</button><button data-filter="Approved">Approved</button><button data-filter="Deferred">Deferred</button><button id="approveSelected">Approve Selected for Publication</button><button id="approvePassing">Approve All Passing</button></div></header>
<div class="shell"><nav class="nav" aria-label="Batch nodes"><div id="nodes"></div></nav><main class="main" id="main"><p>Loading review data…</p></main></div>
<script>
const state={data:null,index:0,filter:'All',tab:'zh-Hans',selected:new Set()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch(path,{headers:{'content-type':'application/json',...(opts.headers||{})},...opts});if(!r.ok)throw new Error(await r.text());return r.json()}
async function load(){try{state.data=await api('/api/review-data')}catch{state.data=await fetch('./review-data.json').then(r=>r.json())}render()}
function statusOf(e){if(e.decisionState==='APPROVED')return'Approved';if(e.decisionState==='DEFERRED')return'Deferred';if(!e.package||e.package.publicationReadiness?.state!=='READY_FOR_FINAL_APPROVAL')return'Blocked';if(e.package.automaticEvidence?.status==='WARNING')return'Warnings';return'Ready'}
function filtered(){return state.data.entries.filter(e=>state.filter==='All'||statusOf(e)===state.filter)}
function render(){document.getElementById('batch').textContent=state.data.batchCode;const s=state.data.summary||{};document.getElementById('summary').innerHTML=`<span class="pill">Nodes ${s.nodes??state.data.entries.length}</span><span class="pill">Ready ${s.articleReady??0}</span><span class="pill">Warnings ${s.warnings??0}</span><span class="pill">Blocked ${s.blocked??0}</span><span class="pill">Approved ${s.finalApproved??0}</span><span class="pill">Deferred ${s.deferred??0}</span><span class="pill">Published ${s.published??0}</span>`;document.getElementById('progress').textContent=`Reviewed ${(s.finalApproved??0)+(s.deferred??0)} / ${state.data.entries.length}`;renderNodes();renderEntry()}
function renderNodes(){const rows=filtered();document.getElementById('nodes').innerHTML=rows.map(e=>{const selectable=statusOf(e)==='Ready';return `<div class="node ${state.data.entries[state.index]===e?'active':''}">${selectable?`<label><input type="checkbox" data-select="${esc(e.nodeCode)}" ${state.selected.has(e.nodeCode)?'checked':''}> Select</label><br>`:''}<button style="border:0;background:transparent;text-align:left;padding:0;width:100%" data-node="${esc(e.nodeCode)}"><strong>${esc(e.nodeCode)}</strong><br>${esc(e.title??e.package?.locales?.['zh-Hans']?.article?.title??'Incomplete package')}<br><span class="status">Article ${e.package?'✓':'✕'} · Figure ${esc(e.figure?.state??e.package?.figure?.state??'—')} · Preflight ${esc(e.package?.automaticEvidence?.status??'BLOCKED')} · Decision ${esc(e.decisionState??'Pending')}</span></button></div>`}).join('');document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{state.index=state.data.entries.findIndex(e=>e.nodeCode===b.dataset.node);render()});document.querySelectorAll('[data-select]').forEach(c=>c.onchange=()=>{c.checked?state.selected.add(c.dataset.select):state.selected.delete(c.dataset.select)})}
function list(xs){return `<ul>${(xs??[]).map(x=>`<li>${esc(typeof x==='string'?x:x.requirement??JSON.stringify(x))}</li>`).join('')}</ul>`}
function articlePanel(e){if(!e.package)return `<section class="card"><h2>Complete package blocked</h2><p>${esc((e.blockers??[]).join(', '))}</p><button id="copyPrompt">Copy Authoring Prompt</button><div class="intake"><h3>Candidate intake</h3><label>Locale <select id="intakeLocale"><option>en</option><option>zh-Hans</option></select></label><label>Title <input id="intakeTitle"></label><label>Summary <textarea id="intakeSummary"></textarea></label><label>Body Markdown <textarea id="intakeBody"></textarea></label><button id="submitCandidate">Save Candidate Intake</button><input type="file" id="candidateFile" accept=".md,.markdown,.json,text/markdown,application/json"><button id="uploadCandidate">Upload Markdown / JSON</button></div></section>`;const p=e.package;const loc=state.tab;const a=p.locales[loc].article;const compare=p.automaticEvidence?.meaningCoverage?.requirements??[];return `<section class="card"><div class="tabs" role="tablist"><button data-tab="zh-Hans" aria-selected="${loc==='zh-Hans'}">zh-Hans</button><button data-tab="en" aria-selected="${loc==='en'}">English</button><button data-tab="compare" aria-selected="${loc==='compare'}">Meaning Compare</button></div>${loc==='compare'?`<div class="coverage"><table><thead><tr><th>Canonical requirement</th><th>zh-Hans</th><th>English</th></tr></thead><tbody>${compare.map(x=>`<tr><td>${esc(x.requirement)}</td><td>${x.zhHans?'✓':'✕'}</td><td>${x.en?'✓':'✕'}</td></tr>`).join('')}</tbody></table></div>`:`<article><h1>${esc(a.title)}</h1><p><strong>${esc(a.summary)}</strong></p><div class="article-body">${esc(a.bodyMarkdown)}</div></article>`}</section><section class="card"><h3>Figure</h3><p><strong>${esc(p.figure.state)}</strong></p><p>${esc(p.figure.reason??'')}</p>${p.figure.car?`<dl><dt>CAR Candidate / Asset</dt><dd>${esc(p.figure.car.candidateCode??p.figure.car.publishedAssetCode??'—')}</dd><dt>Human Review</dt><dd>${esc(p.figure.car.humanReview??'—')}</dd><dt>Asset Approval</dt><dd>${esc(p.figure.car.assetApproval??'—')}</dd><dt>Rights</dt><dd>${esc(p.figure.car.rights??'—')}</dd><dt>Accessibility</dt><dd>${esc(p.figure.car.accessibility??'—')}</dd><dt>Placement</dt><dd>${esc(p.figure.placement??'—')}</dd></dl>${p.figure.car.previewUrl?`<img class="figure-preview" src="${esc(p.figure.car.previewUrl)}" alt="${esc(p.figure.alt??'Figure preview')}">`:''}`:''}${p.figure.alt?`<p>Alt: ${esc(p.figure.alt)}</p>`:''}</section><section class="card"><h3>Automatic Evidence · <span class="status-${esc(p.automaticEvidence.status)}">${esc(p.automaticEvidence.status)}</span></h3>${list(Object.values(p.automaticEvidence.byLocale??{}).flatMap(x=>(x.checks??[]).filter(c=>c.status!=='PASS').map(c=>`${c.status} · ${c.code}${c.detail?' · '+c.detail:''}`)))}</section><section class="card"><h3>Final Presentation Preview</h3><p>CPR projection only · ${esc(p.sameRouteIdentity.canonicalRoute)}</p><button data-viewport="desktop">Desktop</button> <button data-viewport="mobile">Mobile</button><div id="sitePreview" class="site-preview"><div class="muted">${esc(loc==='compare'?'zh-Hans':loc)} · PHI OS Knowledge</div><h1>${esc((p.locales[loc==='compare'?'zh-Hans':loc]||p.locales['zh-Hans']).article.title)}</h1><p><strong>${esc((p.locales[loc==='compare'?'zh-Hans':loc]||p.locales['zh-Hans']).article.summary)}</strong></p><div class="preview-body">${esc((p.locales[loc==='compare'?'zh-Hans':loc]||p.locales['zh-Hans']).article.bodyMarkdown)}</div></div></section>`}
function renderEntry(){const e=state.data.entries[state.index];if(!e){document.getElementById('main').innerHTML='<p>No entries.</p>';return}const pr=e.projection||e.package?.pjaBrief||{};document.getElementById('main').innerHTML=`<div class="review-grid"><aside class="brief card"><h2>${esc(e.nodeCode)}</h2><p><strong>Canonical Question</strong><br>${esc(pr.canonicalQuestion)}</p><p><strong>Canonical Meaning</strong><br>${esc(pr.canonicalMeaning)}</p><h3>Required Coverage</h3>${list(pr.requiredCoverage)}<h3>Required Distinctions</h3>${list(pr.requiredDistinctions)}<h3>Must Not Claim</h3>${list(pr.mustNotClaim)}<h3>Terminology</h3>${list((pr.terminology??[]).map(t=>`${t.zhHans??''} / ${t.en??''}`))}<button id="copyPrompt">Copy Authoring Prompt</button></aside><section>${articlePanel(e)}</section></div><div class="decision-bar"><button id="prev">Previous</button><button id="next">Next</button><button id="nextPending">Next Pending</button><button data-decision="revise">Revise</button><button data-decision="defer">Defer</button><button data-decision="do_not_publish">Do Not Publish</button><button class="approve" data-decision="approve_for_publication" ${!e.package||e.package.publicationReadiness?.state!=='READY_FOR_FINAL_APPROVAL'?'disabled':''}>Approve for Publication</button></div>`;wire(e)}
function wire(e){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderEntry()});document.querySelectorAll('[data-viewport]').forEach(b=>b.onclick=()=>{const el=document.getElementById('sitePreview');if(el)el.classList.toggle('mobile',b.dataset.viewport==='mobile')});document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>decide(e,b.dataset.decision));const cp=document.getElementById('copyPrompt');if(cp)cp.onclick=()=>navigator.clipboard.writeText(e.prompts?.[state.tab==='en'?'en':'zh-Hans']?.prompt??e.prompts?.en?.prompt??'');document.getElementById('prev').onclick=()=>{state.index=Math.max(0,state.index-1);render()};document.getElementById('next').onclick=()=>{state.index=Math.min(state.data.entries.length-1,state.index+1);render()};document.getElementById('nextPending').onclick=()=>{const n=state.data.entries.findIndex((x,i)=>i>state.index&&!['APPROVED','DEFERRED','DO_NOT_PUBLISH'].includes(x.decisionState));if(n>=0){state.index=n;render()}};const sc=document.getElementById('submitCandidate');if(sc)sc.onclick=()=>submitCandidate(e);const up=document.getElementById('uploadCandidate');if(up)up.onclick=()=>uploadCandidate(e)}
async function decide(e,decision){try{const warningAcknowledgements=[];if(decision==='approve_for_publication'&&e.package?.automaticEvidence?.status==='WARNING'){if(!confirm('This package has automatic warnings. Accept the warnings and approve for publication?'))return;warningAcknowledgements.push({resolution:'accept_warning',source:'BFA Final Review Workspace',acknowledgedBy:'TL'});}await api('/api/decision',{method:'POST',body:JSON.stringify({nodeCode:e.nodeCode,decision,summary:`TL ${decision} from BFA Final Review Workspace.`,warningAcknowledgements})});await load()}catch(err){alert(err.message)}}
async function submitCandidate(e){const locale=document.getElementById('intakeLocale').value;const payload={nodeCode:e.nodeCode,locale,title:document.getElementById('intakeTitle').value,summary:document.getElementById('intakeSummary').value,bodyMarkdown:document.getElementById('intakeBody').value,briefDigest:e.projection?.sourceDigest,promptDigest:e.prompts?.[locale]?.promptDigest,canonicalAuthorityDigest:e.canonicalAuthority?.sourceDigest??e.package?.canonicalAuthority?.sourceDigest??null};try{await api('/api/candidate',{method:'POST',body:JSON.stringify(payload)});alert('Candidate intake saved. Import/generation authority must promote it before it can enter the final package.')}catch(err){alert(err.message)}}
async function uploadCandidate(e){const f=document.getElementById('candidateFile').files[0];if(!f)return;const txt=await f.text();let obj;if(f.name.endsWith('.json'))obj=JSON.parse(txt);else obj={bodyMarkdown:txt,title:(txt.match(/^#\s+(.+)$/m)||[])[1]||'',summary:''};document.getElementById('intakeTitle').value=obj.title??obj.article?.title??'';document.getElementById('intakeSummary').value=obj.summary??obj.article?.summary??'';document.getElementById('intakeBody').value=obj.bodyMarkdown??obj.article?.bodyMarkdown??''}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderNodes()});document.getElementById('approveSelected').onclick=async()=>{try{await api('/api/approve-selected',{method:'POST',body:JSON.stringify({nodeCodes:[...state.selected]})});state.selected.clear();await load()}catch(e){alert(e.message)}};document.getElementById('approvePassing').onclick=async()=>{try{await api('/api/approve-all-passing',{method:'POST',body:'{}'});await load()}catch(e){alert(e.message)}};load();
</script>
</body></html>
